# ============================================================
# RestPoint — Host Nginx Config
# File: /etc/nginx/sites-available/restpoint
#
# ARCHITECTURE:
#   HTTPS/WSS → host nginx → API gateway (port 5000)  [all /api/ traffic]
#                          → socketio  (port 5013)     [all /socket.io/ traffic]
#                          → frontend  (port 8080)     [everything else = SPA]
#
# NOTE on the socketio port: docker-compose.prod.yml publishes the socketio
# container on the host as SOCKETIO_SERVICE_EXTERNAL_PORT (5013 by default,
# see .env.production) → container port 5000. Port 5018 is the DEV compose
# mapping — proxying to it in production yields 502 for every /socket.io/
# request (polling AND WebSocket upgrade).
#
# The API gateway at port 5000 handles ALL routing to microservices.
# Do NOT proxy individual services here — that is the gateway's job.
# ============================================================

# WebSocket connection header map
# Sends 'upgrade' for WS requests, 'close' for regular HTTP
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================
# HTTP → HTTPS redirect
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name restpoint.co.ke www.restpoint.co.ke app.restpoint.co.ke portal.restpoint.co.ke paymontenzuma.restpoint.co.ke;

    # Allow certbot renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# MAIN SITE — restpoint.co.ke / www / app
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name restpoint.co.ke www.restpoint.co.ke app.restpoint.co.ke paymontenzuma.restpoint.co.ke;

    ssl_certificate     /etc/letsencrypt/live/restpoint.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restpoint.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Logging
    access_log /var/log/nginx/restpoint_access.log;
    error_log  /var/log/nginx/restpoint_error.log;

    # ============================================================
    # Socket.IO — MUST come before /api/ and / blocks
    # Routes WebSocket AND long-polling to the socketio container
    # ============================================================
    location /socket.io/ {
        # PROD: socketio-service is published on host port 5013
        # (SOCKETIO_SERVICE_EXTERNAL_PORT in .env.production → container 5000).
        # This used to point at 5018 — the DEV compose port — so in production
        # nginx answered 502 for every Socket.IO handshake.
        proxy_pass http://127.0.0.1:5013;

        proxy_http_version 1.1;
        proxy_buffering off;

        # Critical: map variable ensures HTTP polling works, not just WS
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Long timeouts — WebSocket connections are persistent
        proxy_connect_timeout 7d;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;
    }

    # ============================================================
    # API Gateway — handles ALL /api/ routing to microservices
    # Gateway at port 5000 already knows every service route.
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 15-minute timeout for slow operations (org setup, PDF generation etc.)
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # ============================================================
    # Gateway Health Probe — GET /health (gateway ROOT)
    # Serves the fast {status:"healthy"} JSON check for the React frontend,
    # preventing it from falling through to the SPA index.html and CORS-failing.
    # ============================================================
    location = /health {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ============================================================
    # Infrastructure Monitor — GET /monitoring  (gateway ROOT)
    # CRITICAL: the React dashboard polls `${API_GATEWAY_URL}/monitoring`,
    # i.e. the gateway ROOT and NOT /api/v1/restpoint/<service>/..., so this
    # exact path must reach the gateway. Without this block the request falls
    # through to `location /` below, the SPA answers with index.html, and the
    # dashboard dies on:
    #     Unexpected token '<', "<!DOCTYPE "... is not valid JSON
    # showing every card as "—"/blank behind a GATEWAY UNREACHABLE banner.
    #
    # Exact match ("= /monitoring") on purpose: it must NOT swallow the SPA
    # route /<slug>/monitoring, which is a different path and must stay HTML.
    # ============================================================
    location = /monitoring {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # The report probes every routed service (3s timeout each, bounded
        # concurrency) and reads Redis, so allow headroom. The gateway's
        # own MONITOR_PROBE_TIMEOUT_MS bounds how long that can take.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ============================================================
    # Scanner Bridge grant endpoints — /bridge/grant + /bridge/verify-grant
    #
    # CRITICAL: these are the ONLY two routes the bridge flow uses, and BOTH sit
    # at the gateway ROOT, not under /api/. Two callers:
    #   POST /bridge/grant         — the browser (utils/scannerBridge.js)
    #   POST /bridge/verify-grant  — the desktop agent on the reception PC
    #
    # Without this block BOTH fell through to `location /` below and hit the SPA.
    # The SPA answers a POST on a static file with **405 Method Not Allowed**,
    # which is exactly what the browser reported for /bridge/grant — the route
    # was never missing from the gateway, it was never reachable through nginx.
    # The agent's verify-grant failed the same way, so a scan could never be
    # authorised even once the browser half was fixed.
    #
    # No /api/ rewrite here on purpose: the gateway registers these exact paths.
    # ============================================================
    location /bridge/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # A grant is tiny and instant; a hung request here would leave the user
        # staring at a scanner that never starts, so fail fast.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ============================================================
    # Uploads — signatures / logos / documents from the ONE shared
    # uploads folder. Served directly by the tenant-service static
    # mount (/opt/storage/uploads) on its loopback port 5002.
    # CRITICAL: without this block, /uploads/ falls through to the
    # SPA and every signature/image 502s over HTTPS.
    # ============================================================
    location /uploads/ {
        proxy_pass http://127.0.0.1:5002;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Cache uploaded files
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ============================================================
    # Frontend React SPA — catches everything else
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

    }


    # Nginx health check
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================
# PORTAL SUBDOMAIN — portal.restpoint.co.ke
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portal.restpoint.co.ke;

    ssl_certificate     /etc/letsencrypt/live/restpoint.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restpoint.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100M;

    access_log /var/log/nginx/restpoint_portal_access.log;
    error_log  /var/log/nginx/restpoint_portal_error.log;

    location /socket.io/ {
        # PROD: socketio-service is published on host port 5013 (see main
        # server block) — 5018 is the DEV compose port.
        proxy_pass http://127.0.0.1:5013;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 7d;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 900s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # ============================================================
    # Uploads — signatures / logos / documents (portal subdomain)
    # Served by the tenant-service static mount on loopback port 5002
    # ============================================================
    location /uploads/ {
        proxy_pass http://127.0.0.1:5002;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
