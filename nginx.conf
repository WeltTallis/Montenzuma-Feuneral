# RestPoint Frontend Nginx Configuration
# Serves React SPA and proxies API requests to gateway
# Supports subdomain routing: portal.restpoint.co.ke → Portal Login only
# NOTE: SSL termination is handled at the host/reverse proxy level (e.g., Cloudflare, HAProxy, or host nginx)
# This config is for the Docker container internal nginx (HTTP only on port 80)

events {
    worker_connections 1024;
}

http {
    # Map for WebSocket connection upgrade
    # Sends 'upgrade' for WS, 'close' for regular HTTP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default server — reject traffic from unknown domains (siasahub etc.)
    server {
        listen 80 default_server;
        server_name _;
        return 444; # Drop connections from unknown domains
    }

    # ============================================
    # Proxy Upstreams - Using container names with restpoint_ prefix
    # ============================================
    upstream api_gateway {
        server restpoint_api_gateway:5000;
    }

    upstream socketio_backend {
        server restpoint_socketio_service:5000;
    }

    upstream uploads_service {
        # The dedicated 5012 uploads-service no longer exists — /uploads is
        # served directly by the tenant-service static mount of the shared
        # uploads volume (/opt/storage/uploads).
        server restpoint_tenant_service:5000;
    }

    # ============================================
    # MAIN SITE - restpoint.co.ke / app.restpoint.co.ke
    # ============================================
    server {
    listen 80;
    server_name restpoint.co.ke app.restpoint.co.ke paymontenzuma.restpoint.co.ke;

    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_min_length 1000;
    gzip_proxied any;

    # Root for React app
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ============================================
    # API Gateway Proxy - Match all API paths with path rewrite
    # Handles both:
    #   - Frontend calls /api/v1/restpoint/*  → proxy as-is
    #   - Frontend calls /api/*               → rewrite to /api/v1/restpoint/*
    # ============================================
    location /api/ {
        proxy_pass http://api_gateway;
        
        # Rewrite /api/* to /api/v1/restpoint/* (only if /v1/restpoint not already present)
        rewrite ^/api/(?!v1/restpoint/)(.*)$ /api/v1/restpoint/$1 break;

        # Required proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for real-time responses
        proxy_buffering off;
        proxy_request_buffering off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # Socket.IO Proxy - Direct to socketio service
    # ============================================
    location /socket.io/ {
        proxy_pass http://socketio_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ============================================
    # Infrastructure Monitor - GET /monitoring
    # The dashboard polls the gateway ROOT (/monitoring), NOT under
    # /api/v1/restpoint. CRITICAL: without this block the request falls
    # through to the SPA fallback below, which answers with index.html,
    # and the dashboard dies on "Unexpected token '<'" leaving every
    # card blank behind a GATEWAY UNREACHABLE banner.
    # Exact match on purpose - it must not shadow the SPA route
    # /<slug>/monitoring, which is a different path and stays HTML.
    # ============================================
    location = /monitoring {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

# ============================================
    # Scanner Bridge grants - POST /bridge/grant + /bridge/verify-grant
    #
    # These two routes sit at the GATEWAY ROOT, NOT under /api/ (see
    # api-gateway/bridge.js), so the SPA fallback in `location /` used to
    # swallow them: nginx serves index.html for a POST on a static file and
    # replies 405 Method Not Allowed - the error the browser reported.
    # No /api/ rewrite here; the gateway registers these paths verbatim.
    # ============================================
    location /bridge/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A grant is tiny and instant. Failing fast beats leaving the user
        # waiting on a scanner that will never start.
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ============================================
    # Uploads Proxy - Serve uploaded files (signatures, documents, images)
    # from the tenant-service static mount of the shared uploads volume
    # ============================================
    location /uploads/ {
        proxy_pass http://uploads_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache uploaded files
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # Static Assets - Long Cache
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================
    # SPA Fallback - All routes to index.html
    # Exclude API and socket.io paths
    # ============================================
    location / {
        # Try file first, then directory, finally index.html for SPA routing
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # Health Check Endpoint
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Deny Access
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

    # ============================================
    # PORTAL SUBDOMAIN - portal.restpoint.co.ke
    # Serves ONLY the Portal Login page
    # ============================================
server {
    listen 80;
    server_name portal.restpoint.co.ke;

    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_min_length 1000;
    gzip_proxied any;

    # Root for React app
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ============================================
    # API Gateway Proxy (Portal routes only) with path rewrite
    # ============================================
    location /api/ {
        proxy_pass http://api_gateway;
        
        # Rewrite /api/* to /api/v1/restpoint/* (only if /v1/restpoint not already present)
        rewrite ^/api/(?!v1/restpoint/)(.*)$ /api/v1/restpoint/$1 break;

        # Required proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # Socket.IO Proxy
    # ============================================
    location /socket.io/ {
        proxy_pass http://socketio_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

# ============================================
    # Scanner Bridge grants - POST /bridge/grant + /bridge/verify-grant
    # Gateway ROOT paths, NOT /api/. Without this block the SPA fallback
    # answers a POST on a static file with 405 Method Not Allowed.
    # ============================================
    location /bridge/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ============================================
    # Uploads Proxy - Serve uploaded files (signatures, documents, images)
    # from the tenant-service static mount of the shared uploads volume
    # ============================================
    location /uploads/ {
        proxy_pass http://uploads_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache uploaded files
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

        # ============================================
    # Scanner Bridge app download — served directly
    # from the frontend public/downloads/ directory, NOT proxied through the
    # backend. Forces Content-Disposition:attachment so the browser downloads
    # the zip instead of falling through the SPA try_files fallback to index.html.
    # ============================================
    location ^~ /downloads/ {
        autoindex off;
        types { }
        default_type application/zip;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ============================================
    # Static Assets
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============================================
    # Portal SPA - All routes serve index.html
    # The React app will show Portal Login by default
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # Health Check
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Deny Access
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
}