# ============================================================
# RestPoint Frontend Nginx
# Domain: restpoint.co.ke
#
# HTTPS / Let's Encrypt is terminated by the HOST Nginx.
# This container serves the frontend over HTTP internally.
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name restpoint.co.ke www.restpoint.co.ke;

    root /usr/share/nginx/html;
    index index.html;

    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # --------------------------------------------------------
    # Compression
    # --------------------------------------------------------

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript;

    gzip_min_length 1000;

    # --------------------------------------------------------
    # Never expose hidden files or environment files
    # --------------------------------------------------------

    location ~ /\. {
        deny all;
        return 404;
    }

    # Explicit protection for environment/config files
    location ~* \.(env|env\..*|ini|log|sql|bak|backup)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------
    # Socket.IO / WebSocket
    # --------------------------------------------------------

    location /socket.io/ {
        proxy_pass http://restpoint_socketio_service:5000;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # --------------------------------------------------------
    # Health check
    # --------------------------------------------------------

    location = /health {
        access_log off;

        default_type text/plain;

        return 200 "healthy\n";
    }

    # --------------------------------------------------------
    # Static assets
    # --------------------------------------------------------

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;

        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # --------------------------------------------------------
    # React/Vue/SPA routing
    # --------------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
