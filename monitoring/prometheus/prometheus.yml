global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    datacenter: restpoint

scrape_configs:
  # ============================================
  # PROMETHEUS SELF-MONITORING
  # ============================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ============================================
  # INFRASTRUCTURE METRICS
  # ============================================
  - job_name: 'node-exporter'
    # node-exporter runs with network_mode: host so use host gateway
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['restpoint-cadvisor:8080']

  - job_name: 'process-exporter'
    static_configs:
      - targets: ['restpoint-process-exporter:9256']

  # ============================================
  # DATABASE METRICS
  # ============================================
  - job_name: 'mysql-exporter'
    static_configs:
      - targets: ['restpoint-mysql-exporter:9104']

  # ============================================
  # CACHE METRICS
  # ============================================
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['restpoint-redis-exporter:9121']

  # ============================================
  # MESSAGE QUEUE METRICS
  # ============================================
  - job_name: 'rabbitmq-exporter'
    static_configs:
      - targets: ['restpoint-rabbitmq-exporter:9419']

  # ============================================
  # API GATEWAY - Request Metrics
  # ============================================
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['restpoint_api_gateway:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # ============================================
  # ALL MICROSERVICES - Health & Metrics
  # ============================================
  - job_name: 'auth-service'
    static_configs:
      - targets: ['restpoint_auth_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'tenant-service'
    static_configs:
      - targets: ['restpoint_tenant_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'deceased-service'
    static_configs:
      - targets: ['restpoint_deceased_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'hearse-service'
    static_configs:
      - targets: ['restpoint_hearse_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'coffin-service'
    static_configs:
      - targets: ['restpoint_coffin_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'florist-service'
    static_configs:
      - targets: ['restpoint_florist_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'workshop-service'
    static_configs:
      - targets: ['restpoint_workshop_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'bodycheckout-service'
    static_configs:
      - targets: ['restpoint_bodycheckout_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'billing-service'
    static_configs:
      - targets: ['restpoint_billing_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['restpoint_analytics_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'socketio-service'
    static_configs:
      - targets: ['restpoint_socketio_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'documents-service'
    static_configs:
      - targets: ['restpoint_documents_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'support-service'
    static_configs:
      - targets: ['restpoint_support_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'chemicals-service'
    static_configs:
      - targets: ['restpoint_chemical_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'leave-service'
    static_configs:
      - targets: ['restpoint_leave_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'scanner-service'
    static_configs:
      - targets: ['restpoint_scanner_service:2024']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'invoice-service'
    static_configs:
      - targets: ['restpoint_invoice_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ============================================
  # WORKER SERVICES - Background Jobs (BullMQ)
  # ============================================
  - job_name: 'bullmq-workers'
    static_configs:
      - targets: ['restpoint_deceased_service:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ============================================
  # BLACKBOX - External Service Monitoring
  # ============================================
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://restpoint_api_gateway:5000/health
          - http://restpoint_auth_service:5000/health
          - http://restpoint_tenant_service:5000/health
          - http://restpoint_deceased_service:5000/health
          - http://restpoint_socketio_service:5000/health
          - http://restpoint_bodycheckout_service:5000/health
          - http://restpoint_hearse_service:5000/health
          - http://restpoint_coffin_service:5000/health
          - http://restpoint_workshop_service:5000/health
          - http://restpoint_billing_service:5000/health
          - http://restpoint_analytics_service:5000/health
          - http://restpoint_support_service:5000/health
          - http://restpoint_leave_service:5000/health
          - http://restpoint_chemical_service:5000/health
          - http://restpoint_invoice_service:5000/health
          - http://restpoint_monitoring_grafana:3000
          - https://restpoint.co.ke
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: restpoint-blackbox-exporter:9115
