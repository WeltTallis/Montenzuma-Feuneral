<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearse Weekly Dispatch Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF;
            --bg-soft: #FAFAFA;
            --bg-hover: #F5F5F5;
            --border: #EEEEEE;
            --border-light: #F0F0F0;
            --text: #000000;
            --text-muted: #888888;
            --text-dim: #BBBBBB;
            --green: #059669;
            --green-bg: #ECFDF5;
            --red: #D32F2F;
            --red-bg: #FEF2F2;
            --blue: #2563EB;
            --blue-bg: #EFF6FF;
            --amber: #D97706;
            --amber-bg: #FFFBEB;
            --purple: #7C3AED;
            --purple-bg: #F5F3FF;
            --teal: #0D9488;
            --teal-bg: #F0FDFA;
            --sidebar-w: 420px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            height: 68px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
            background: var(--bg);
            z-index: 20;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-logo {
            width: 36px;
            height: 36px;
            background: var(--text);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .topbar-logo svg {
            width: 18px;
            height: 18px;
        }

        .topbar-brand {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .topbar-brand span {
            color: var(--text-muted);
            font-weight: 500;
        }

        .topbar-center {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .nav-btn:hover {
            background: var(--text);
            color: white;
            border-color: var(--text);
        }

        .week-label {
            font-size: 15px;
            font-weight: 700;
            min-width: 240px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .today-btn {
            padding: 7px 14px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .today-btn:hover {
            background: var(--text);
            color: white;
            border-color: var(--text);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .add-btn {
            padding: 8px 18px;
            background: var(--text);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
        }

        .add-btn:hover {
            background: #222;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* ── MAIN AREA ── */
        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .calendar-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            transition: margin-right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        .calendar-area.shifted {
            margin-right: var(--sidebar-w);
        }

        /* ── STATS ROW ── */
        .stats-row {
            display: flex;
            gap: 10px;
            padding: 16px 32px 12px;
            flex-shrink: 0;
        }

        .stat-card {
            flex: 1;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .stat-card.sc-green::after {
            background: var(--green);
        }

        .stat-card.sc-blue::after {
            background: var(--blue);
        }

        .stat-card.sc-amber::after {
            background: var(--amber);
        }

        .stat-card.sc-red::after {
            background: var(--red);
        }

        .stat-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        /* ── FLOATING INDICATORS ── */
        .floating-indicators {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .float-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: var(--shadow-lg);
            animation: floatIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            pointer-events: auto;
            white-space: nowrap;
        }

        .float-badge.fb-green {
            background: var(--green-bg);
            color: var(--green);
            border: 1px solid rgba(5, 150, 105, 0.15);
        }

        .float-badge.fb-amber {
            background: var(--amber-bg);
            color: var(--amber);
            border: 1px solid rgba(217, 119, 6, 0.15);
        }

        .float-badge.fb-red {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid rgba(211, 47, 47, 0.15);
        }

        .float-badge.fb-blue {
            background: var(--blue-bg);
            color: var(--blue);
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .float-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: relative;
        }

        .float-pulse::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0.4;
            animation: pulse 2s ease-in-out infinite;
        }

        .fb-green .float-pulse {
            background: var(--green);
        }

        .fb-amber .float-pulse {
            background: var(--amber);
        }

        .fb-red .float-pulse {
            background: var(--red);
        }

        .fb-blue .float-pulse {
            background: var(--blue);
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.4;
            }

            50% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ── LEGEND ── */
        .legend-row {
            display: flex;
            gap: 16px;
            align-items: center;
            padding: 0 32px 10px;
            flex-shrink: 0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* ── WEEK GRID ── */
        .grid-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 0 32px 24px;
            position: relative;
        }

        .grid-wrapper::-webkit-scrollbar {
            width: 5px;
        }

        .grid-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid-wrapper::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .day-headers {
            display: grid;
            grid-template-columns: 56px repeat(7, 1fr);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 8;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .dh-spacer {
            border-right: 1px solid var(--border-light);
        }

        .dh-cell {
            text-align: center;
            padding: 4px 0 0;
            border-right: 1px solid var(--border-light);
        }

        .dh-cell:last-child {
            border-right: none;
        }

        .dh-name {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .dh-num {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .dh-cell.is-today .dh-name {
            color: var(--green);
        }

        .dh-cell.is-today .dh-num {
            background: var(--green);
            color: white;
        }

        .week-grid {
            display: grid;
            grid-template-columns: 56px repeat(7, 1fr);
            position: relative;
        }

        .time-label {
            height: 60px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 0 8px 0 0;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            border-right: 1px solid var(--border-light);
            transform: translateY(-6px);
        }

        .day-col {
            position: relative;
            border-right: 1px solid var(--border-light);
        }

        .day-col:last-child {
            border-right: none;
        }

        .day-col.is-today {
            background: rgba(5, 150, 105, 0.015);
        }

        .hour-cell {
            height: 60px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background 0.12s;
            position: relative;
        }

        .hour-cell:hover {
            background: var(--bg-hover);
        }

        .hour-cell::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-bottom: 1px dashed rgba(0, 0, 0, 0.04);
            pointer-events: none;
        }

        /* ── BOOKINGS ── */
        .booking-block {
            position: absolute;
            left: 2px;
            right: 2px;
            border-radius: 6px;
            padding: 5px 7px;
            font-size: 11px;
            cursor: pointer;
            overflow: hidden;
            z-index: 5;
            border-left: 3px solid;
            transition: all 0.18s;
            animation: blockIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .booking-block:hover {
            transform: scale(1.03);
            z-index: 9;
            box-shadow: var(--shadow-lg);
        }

        @keyframes blockIn {
            from {
                opacity: 0;
                transform: scaleY(0.9) translateY(3px);
            }

            to {
                opacity: 1;
                transform: scaleY(1) translateY(0);
            }
        }

        .bb-title {
            font-weight: 700;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bb-time {
            font-size: 9px;
            opacity: 0.75;
            font-weight: 500;
        }

        .bb-client {
            font-size: 9px;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .booking-block.st-pending {
            background: var(--amber-bg);
            border-color: var(--amber);
            color: var(--amber);
        }

        .booking-block.st-booked {
            background: var(--blue-bg);
            border-color: var(--blue);
            color: var(--blue);
        }

        .booking-block.st-transit {
            background: var(--red-bg);
            border-color: var(--red);
            color: var(--red);
        }

        .booking-block.st-completed {
            background: var(--green-bg);
            border-color: var(--green);
            color: var(--green);
        }

        .booking-block.st-reserved {
            background: var(--purple-bg);
            border-color: var(--purple);
            color: var(--purple);
        }

        .booking-block.st-standby {
            background: var(--teal-bg);
            border-color: var(--teal);
            color: var(--teal);
        }

        .booking-block.st-pending:hover {
            background: rgba(217, 119, 6, 0.18);
        }

        .booking-block.st-booked:hover {
            background: rgba(37, 99, 235, 0.14);
        }

        .booking-block.st-transit:hover {
            background: rgba(211, 47, 47, 0.14);
        }

        .booking-block.st-completed:hover {
            background: rgba(5, 150, 105, 0.14);
        }

        .booking-block.st-reserved:hover {
            background: rgba(124, 58, 237, 0.14);
        }

        .booking-block.st-standby:hover {
            background: rgba(13, 148, 136, 0.14);
        }

        /* ── NOW LINE ── */
        .now-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--green);
            z-index: 10;
            pointer-events: none;
        }

        .now-line::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
        }

        /* ── SIDEBAR ── */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.15);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg);
            border-left: 1px solid var(--border);
            z-index: 60;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.06);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 24px 28px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-header h3 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .sidebar-close {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .sidebar-close:hover {
            background: var(--text);
            color: white;
            border-color: var(--text);
        }

        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
        }

        .sidebar-body::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .sb-status-bar {
            height: 4px;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .sb-section {
            margin-bottom: 24px;
        }

        .sb-section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .sb-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .sb-info-card {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
        }

        .sb-info-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .sb-info-value {
            font-size: 13px;
            font-weight: 700;
        }

        .sb-detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .sb-detail-row:last-child {
            border-bottom: none;
        }

        .sb-detail-label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .sb-detail-val {
            font-size: 13px;
            font-weight: 700;
        }

        .sb-route {
            display: flex;
            align-items: stretch;
            gap: 12px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .sb-route-line {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
        }

        .sb-route-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid;
            flex-shrink: 0;
        }

        .sb-route-dash {
            flex: 1;
            width: 2px;
            background: var(--border);
        }

        .sb-route-info {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sb-route-point {
            font-size: 13px;
            font-weight: 700;
        }

        .sb-route-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .sb-timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            position: relative;
            padding-left: 24px;
        }

        .sb-timeline::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--border);
        }

        .sb-tl-step {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 0;
            position: relative;
        }

        .sb-tl-dot {
            position: absolute;
            left: -24px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border);
            border: 2px solid var(--bg);
            z-index: 2;
        }

        .sb-tl-step.done .sb-tl-dot {
            background: var(--green);
        }

        .sb-tl-step.active .sb-tl-dot {
            background: var(--text);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.08);
        }

        .sb-tl-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }

        .sb-tl-step.done .sb-tl-text,
        .sb-tl-step.active .sb-tl-text {
            color: var(--text);
        }

        .sidebar-footer {
            padding: 16px 28px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .sb-btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }

        .sb-btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .sb-btn-ghost:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .sb-btn-danger {
            background: var(--red-bg);
            border: 1px solid rgba(211, 47, 47, 0.15);
            color: var(--red);
        }

        .sb-btn-danger:hover {
            background: rgba(211, 47, 47, 0.15);
        }

        .sb-btn-primary {
            background: var(--text);
            border: 1px solid var(--text);
            color: white;
        }

        .sb-btn-primary:hover {
            background: #222;
        }

        /* ── ADD MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 30px;
            width: 440px;
            max-width: 92vw;
            box-shadow: var(--shadow-lg);
            animation: modalUp 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalUp {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--text);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .status-pick {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .status-chip {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            border: 1.5px solid transparent;
            transition: all 0.15s;
        }

        .status-chip:hover {
            transform: scale(1.05);
        }

        .status-chip.selected {
            border-color: var(--text);
            box-shadow: 0 0 0 2px var(--bg);
        }

        .sc-pending {
            background: var(--amber-bg);
            color: var(--amber);
        }

        .sc-booked {
            background: var(--blue-bg);
            color: var(--blue);
        }

        .sc-transit {
            background: var(--red-bg);
            color: var(--red);
        }

        .sc-completed {
            background: var(--green-bg);
            color: var(--green);
        }

        .sc-reserved {
            background: var(--purple-bg);
            color: var(--purple);
        }

        .sc-standby {
            background: var(--teal-bg);
            color: var(--teal);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        /* ── TOAST ── */
        .toast-area {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toast-msg {
            padding: 10px 18px;
            background: var(--text);
            color: white;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            animation: toastSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1), toastFade 0.3s ease 2.5s forwards;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes toastSlide {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastFade {
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }

        @media (max-width: 900px) {
            :root {
                --sidebar-w: 100vw;
            }

            .stats-row {
                flex-wrap: wrap;
                padding: 12px 16px;
            }

            .stat-card {
                min-width: 140px;
            }

            .grid-wrapper {
                padding: 0 8px 16px;
            }

            .day-headers {
                padding-left: 8px;
            }

            .topbar {
                padding: 0 16px;
            }

            .legend-row {
                padding: 0 16px 8px;
                flex-wrap: wrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0s !important;
                transition-duration: 0s !important;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="topbar-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="6" width="18" height="12" rx="3" />
                    <path d="M7 6V4a2 2 0 012-2h6a2 2 0 012 2v2" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                </svg>
            </div>
            <div class="topbar-brand">Hearse Dispatch <span>Board</span></div>
        </div>
        <div class="topbar-center">
            <button class="nav-btn" id="prevWeek" aria-label="Previous week">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="week-label" id="weekLabel"></div>
            <button class="nav-btn" id="nextWeek" aria-label="Next week">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
            <button class="today-btn" id="todayBtn">Today</button>
        </div>
        <div class="topbar-right">
            <button class="add-btn" id="addBtn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                New Booking
            </button>
        </div>
    </header>

    <!-- MAIN -->
    <div class="main-area">
        <div class="calendar-area" id="calendarArea">
            <!-- Stats -->
            <div class="stats-row" id="statsRow"></div>

            <!-- Legend -->
            <div class="legend-row" id="legendRow"></div>

            <!-- Grid -->
            <div class="grid-wrapper" id="gridWrapper">
                <!-- Floating indicators -->
                <div class="floating-indicators" id="floatingIndicators"></div>
                <div class="day-headers" id="dayHeaders"></div>
                <div class="week-grid" id="weekGrid"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" role="dialog" aria-label="Booking details">
        <div class="sidebar-header">
            <h3>Booking Details</h3>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div class="sidebar-body" id="sidebarBody"></div>
        <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>

    <!-- ADD MODAL -->
    <div class="modal-overlay" id="addModal">
        <div class="modal" role="dialog" aria-label="Add booking">
            <div class="modal-header">
                <h3 id="modalTitle">New Booking</h3>
                <button class="sidebar-close" id="modalClose" aria-label="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="form-group">
                <label for="fClient">Client Name</label>
                <input type="text" id="fClient" placeholder="e.g. John Doe">
            </div>
            <div class="form-group">
                <label for="fDest">Destination</label>
                <input type="text" id="fDest" placeholder="e.g. Greenwood Cemetery">
            </div>
            <div class="form-group">
                <label for="fFrom">Departure From</label>
                <input type="text" id="fFrom" placeholder="e.g. City Mortuary">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="fDay">Day</label>
                    <select id="fDay"></select>
                </div>
                <div class="form-group">
                    <label for="fPlate">Vehicle Plate</label>
                    <input type="text" id="fPlate" placeholder="e.g. HF-001">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="fStart">Start Time</label>
                    <select id="fStart"></select>
                </div>
                <div class="form-group">
                    <label for="fEnd">End Time</label>
                    <select id="fEnd"></select>
                </div>
            </div>
            <div class="form-group">
                <label for="fPhone">Client Phone</label>
                <input type="text" id="fPhone" placeholder="e.g. 555-0100">
            </div>
            <div class="form-group">
                <label>Status</label>
                <div class="status-pick" id="statusPick"></div>
            </div>
            <div class="modal-actions">
                <button class="sb-btn sb-btn-ghost" id="mCancel" style="flex:none;padding:10px 20px;">Cancel</button>
                <button class="sb-btn sb-btn-primary" id="mSave" style="flex:none;padding:10px 24px;">Save
                    Booking</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-area" id="toastArea"></div>

    <script>
        // ── Constants ──
        const HOUR_H = 60;
        const START_H = 5;
        const END_H = 22;
        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const DAYS_S = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        const STATUSES = {
            pending: { label: 'Pending', color: '#D97706', bg: '#FFFBEB', cls: 'st-pending', chip: 'sc-pending' },
            booked: { label: 'Booked', color: '#2563EB', bg: '#EFF6FF', cls: 'st-booked', chip: 'sc-booked' },
            transit: { label: 'In Transit', color: '#D32F2F', bg: '#FEF2F2', cls: 'st-transit', chip: 'sc-transit' },
            completed: { label: 'Completed', color: '#059669', bg: '#ECFDF5', cls: 'st-completed', chip: 'sc-completed' },
            reserved: { label: 'Reserved', color: '#7C3AED', bg: '#F5F3FF', cls: 'st-reserved', chip: 'sc-reserved' },
            standby: { label: 'Standby', color: '#0D9488', bg: '#F0FDFA', cls: 'st-standby', chip: 'sc-standby' },
        };

        // ── State ──
        let weekStart = getWeekStart(new Date());
        let selectedStatus = 'booked';
        let editingId = null;
        let viewingId = null;
        let bookings = {};

        function getWeekStart(d) {
            const dt = new Date(d);
            dt.setDate(dt.getDate() - dt.getDay());
            dt.setHours(0, 0, 0, 0);
            return dt;
        }

        function dk(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function fmtDate(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }

        function fmtTime(h) {
            const hr = Math.floor(h);
            const mn = Math.round((h - hr) * 60);
            const ap = hr >= 12 ? 'PM' : 'AM';
            const h12 = hr === 0 ? 12 : hr > 12 ? hr - 12 : hr;
            return `${h12}:${String(mn).padStart(2, '0')} ${ap}`;
        }

        // ── Seed Data ──
        function seed() {
            const samples = [
                { client: 'John Doe', dest: 'Greenwood Cemetery', from: 'City Mortuary', dayOff: 1, s: 8, e: 9.5, status: 'booked', phone: '555-0100', plate: 'HF-001' },
                { client: 'Sarah Mitchell', dest: 'Hillside Memorial', from: 'St. Mary\'s Chapel', dayOff: 1, s: 11, e: 12.5, status: 'transit', phone: '555-0101', plate: 'HF-002' },
                { client: 'Robert Chen', dest: 'Ocean View Gardens', from: 'Central Mortuary', dayOff: 2, s: 9, e: 10.25, status: 'completed', phone: '555-0102', plate: 'HF-001' },
                { client: 'Maria Garcia', dest: 'Rosewood Park', from: 'General Hospital', dayOff: 2, s: 13, e: 14.5, status: 'pending', phone: '555-0103', plate: 'HF-003' },
                { client: 'James Wilson', dest: 'State Mausoleum', from: 'City Mortuary', dayOff: 3, s: 8.5, e: 10, status: 'booked', phone: '555-0104', plate: 'HF-002' },
                { client: 'Patricia Brown', dest: 'Evergreen Fields', from: 'Private Residence', dayOff: 3, s: 14, e: 16, status: 'reserved', phone: '555-0105', plate: 'HF-004' },
                { client: 'David Lee', dest: 'Mountain Rest', from: 'Valley Funeral Home', dayOff: 4, s: 9, e: 10.5, status: 'standby', phone: '555-0106', plate: 'HF-001' },
                { client: 'Linda Taylor', dest: 'Harbor Memorial', from: 'City Mortuary', dayOff: 4, s: 11, e: 12, status: 'booked', phone: '555-0107', plate: 'HF-003' },
                { client: 'Michael Scott', dest: 'Dunder Mifflin Lot', from: 'Scranton Mortuary', dayOff: 5, s: 10, e: 11.5, status: 'pending', phone: '555-0108', plate: 'HF-002' },
                { client: 'Emily Davis', dest: 'Lakeside Gardens', from: 'St. John\'s Church', dayOff: 5, s: 15, e: 16.5, status: 'booked', phone: '555-0109', plate: 'HF-004' },
                { client: 'Thomas Moore', dest: 'Sunset Valley', from: 'Central Mortuary', dayOff: 6, s: 8, e: 9.25, status: 'completed', phone: '555-0110', plate: 'HF-001' },
                { client: 'Karen White', dest: 'Pine Ridge Cemetery', from: 'City Mortuary', dayOff: 0, s: 10, e: 11.5, status: 'reserved', phone: '555-0111', plate: 'HF-003' },
                { client: 'Andrew Clark', dest: 'Heritage Park', from: 'Private Residence', dayOff: 0, s: 14, e: 15, status: 'pending', phone: '555-0112', plate: 'HF-002' },
                { client: 'Nancy Hall', dest: 'Meadow Brook', from: 'City Mortuary', dayOff: 6, s: 13, e: 14.5, status: 'transit', phone: '555-0113', plate: 'HF-004' },
            ];

            for (let w = -2; w <= 3; w++) {
                const ws = new Date(weekStart);
                ws.setDate(ws.getDate() + w * 7);
                samples.forEach((s, i) => {
                    const day = new Date(ws);
                    day.setDate(day.getDate() + s.dayOff);
                    const key = dk(day);
                    if (!bookings[key]) bookings[key] = [];
                    bookings[key].push({
                        id: `${key}-${i}`,
                        client: s.client,
                        dest: s.dest,
                        from: s.from,
                        start: s.s,
                        end: s.e,
                        status: s.status,
                        phone: s.phone,
                        plate: s.plate
                    });
                });
            }
        }

        // ── Render ──
        function render() {
            renderWeekLabel();
            renderLegend();
            renderDayHeaders();
            renderGrid();
            renderStats();
            renderFloats();
        }

        function renderWeekLabel() {
            const end = new Date(weekStart);
            end.setDate(end.getDate() + 6);
            document.getElementById('weekLabel').textContent =
                `${fmtDate(weekStart)} — ${fmtDate(end)}`;
        }

        function renderLegend() {
            document.getElementById('legendRow').innerHTML = Object.entries(STATUSES).map(([k, v]) =>
                `<div class="legend-item"><div class="legend-dot" style="background:${v.color};"></div>${v.label}</div>`
            ).join('');
        }

        function renderDayHeaders() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let html = '<div class="dh-spacer"></div>';
            for (let i = 0; i < 7; i++) {
                const d = new Date(weekStart);
                d.setDate(d.getDate() + i);
                const isToday = d.getTime() === today.getTime();
                html += `<div class="dh-cell ${isToday ? 'is-today' : ''}">
                <div class="dh-name">${DAYS_S[i]}</div>
                <div class="dh-num">${d.getDate()}</div>
            </div>`;
            }
            document.getElementById('dayHeaders').innerHTML = html;
        }

        function renderGrid() {
            const grid = document.getElementById('weekGrid');
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let html = '';

            for (let h = START_H; h < END_H; h++) {
                const label = h === 0 ? '12 AM' : h < 12 ? `${h} AM` : h === 12 ? '12 PM' : `${h - 12} PM`;
                html += `<div class="time-label">${label}</div>`;
                for (let d = 0; d < 7; d++) {
                    const dayDate = new Date(weekStart);
                    dayDate.setDate(dayDate.getDate() + d);
                    const isToday = dayDate.getTime() === today.getTime();
                    html += `<div class="hour-cell ${isToday ? 'is-today' : ''}" data-day="${d}" data-hour="${h}" style="position:relative;"></div>`;
                }
            }
            grid.innerHTML = html;

            // Place bookings
            for (let d = 0; d < 7; d++) {
                const dayDate = new Date(weekStart);
                dayDate.setDate(dayDate.getDate() + d);
                const key = dk(dayDate);
                const dayBookings = bookings[key] || [];
                const colIdx = 1 + d;

                dayBookings.forEach((b, idx) => {
                    if (b.end <= START_H || b.start >= END_H) return;
                    const top = Math.max(0, (b.start - START_H)) * HOUR_H;
                    const height = Math.max(HOUR_H * 0.2, (Math.min(b.end, END_H) - Math.max(b.start, START_H)) * HOUR_H);
                    const st = STATUSES[b.status] || STATUSES.booked;

                    const el = document.createElement('div');
                    el.className = `booking-block ${st.cls}`;
                    el.style.top = top + 'px';
                    el.style.height = height + 'px';
                    el.style.gridColumn = colIdx + 1;
                    el.style.gridRow = '1 / -1';
                    el.style.animationDelay = (idx * 0.04) + 's';

                    el.innerHTML = `
                    <div class="bb-title">${b.client}</div>
                    ${height > 38 ? `<div class="bb-time">${fmtTime(b.start)} – ${fmtTime(b.end)}</div>` : ''}
                    ${height > 56 ? `<div class="bb-client">${b.plate} · ${b.dest.split(' ').slice(0, 2).join(' ')}</div>` : ''}
                `;
                    el.addEventListener('click', (e) => { e.stopPropagation(); openSidebar(b.id); });
                    grid.appendChild(el);
                });
            }

            // Now line
            const now = new Date();
            const nowWs = getWeekStart(now);
            if (nowWs.getTime() === weekStart.getTime()) {
                const nh = now.getHours() + now.getMinutes() / 60;
                if (nh >= START_H && nh < END_H) {
                    const line = document.createElement('div');
                    line.className = 'now-line';
                    line.style.top = ((nh - START_H) * HOUR_H) + 'px';
                    line.style.gridColumn = '1 / -1';
                    line.style.gridRow = '1 / -1';
                    grid.appendChild(line);
                }
            }
        }

        function renderStats() {
            let total = 0, transit = 0, completed = 0, available = 4;
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            for (let d = 0; d < 7; d++) {
                const dayDate = new Date(weekStart);
                dayDate.setDate(dayDate.getDate() + d);
                const key = dk(dayDate);
                (bookings[key] || []).forEach(b => {
                    total++;
                    if (b.status === 'transit') transit++;
                    if (b.status === 'completed') completed++;
                });
            }
            available = Math.max(0, 4 - transit);

            document.getElementById('statsRow').innerHTML = `
            <div class="stat-card sc-blue">
                <div class="stat-label">Total Bookings</div>
                <div class="stat-value">${total}</div>
            </div>
            <div class="stat-card sc-red">
                <div class="stat-label">In Transit</div>
                <div class="stat-value">${transit}</div>
            </div>
            <div class="stat-card sc-green">
                <div class="stat-label">Completed</div>
                <div class="stat-value">${completed}</div>
            </div>
            <div class="stat-card sc-amber">
                <div class="stat-label">Hearses Available</div>
                <div class="stat-value">${available}</div>
            </div>
        `;
        }

        function renderFloats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayKey = dk(today);
            const todayBookings = bookings[todayKey] || [];
            const inTransit = todayBookings.filter(b => b.status === 'transit').length;
            const available = Math.max(0, 4 - inTransit);
            const pending = todayBookings.filter(b => b.status === 'pending').length;

            const el = document.getElementById('floatingIndicators');
            let html = '';

            if (available > 0) {
                html += `<div class="float-badge fb-green" style="animation-delay:0s;">
                <div class="float-pulse"></div>
                ${available} Hearse${available > 1 ? 's' : ''} Available Now
            </div>`;
            }

            if (inTransit > 0) {
                html += `<div class="float-badge fb-red" style="animation-delay:0.1s;">
                <div class="float-pulse"></div>
                ${inTransit} In Transit
            </div>`;
            }

            if (pending > 0) {
                html += `<div class="float-badge fb-amber" style="animation-delay:0.2s;">
                <div class="float-pulse"></div>
                ${pending} Pending Confirmation
            </div>`;
            }

            if (todayBookings.length === 0) {
                html += `<div class="float-badge fb-blue" style="animation-delay:0s;">
                <div class="float-pulse"></div>
                All Clear Today
            </div>`;
            }

            el.innerHTML = html;
        }

        // ── Sidebar ──
        function findBooking(id) {
            for (const k in bookings) {
                const f = bookings[k].find(b => b.id === id);
                if (f) return f;
            }
            return null;
        }

        function openSidebar(id) {
            const b = findBooking(id);
            if (!b) return;
            viewingId = id;
            const st = STATUSES[b.status] || STATUSES.booked;
            const parts = id.split('-');
            const bd = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            const dur = b.end - b.start;
            const durH = Math.floor(dur);
            const durM = Math.round((dur - durH) * 60);

            // Determine timeline steps based on status
            const steps = [
                { label: 'Booking Created', done: true },
                { label: 'Confirmed & Assigned', done: ['booked', 'transit', 'completed', 'reserved', 'standby'].includes(b.status) },
                { label: 'Hearse Dispatched', done: ['transit', 'completed'].includes(b.status), active: b.status === 'transit' },
                { label: 'Arrived at Destination', done: b.status === 'completed', active: false },
                { label: 'Service Completed', done: b.status === 'completed', active: b.status === 'completed' },
            ];

            document.getElementById('sidebarBody').innerHTML = `
            <div class="sb-status-bar" style="background:${st.color};"></div>

            <div class="sb-section">
                <div class="sb-section-title">Client Information</div>
                <div class="sb-info-grid">
                    <div class="sb-info-card">
                        <div class="sb-info-label">Client</div>
                        <div class="sb-info-value">${b.client}</div>
                    </div>
                    <div class="sb-info-card">
                        <div class="sb-info-label">Phone</div>
                        <div class="sb-info-value">${b.phone}</div>
                    </div>
                </div>
            </div>

            <div class="sb-section">
                <div class="sb-section-title">Schedule</div>
                <div class="sb-detail-row">
                    <span class="sb-detail-label">Date</span>
                    <span class="sb-detail-val">${DAYS[bd.getDay()]}, ${MONTHS[bd.getMonth()]} ${bd.getDate()}</span>
                </div>
                <div class="sb-detail-row">
                    <span class="sb-detail-label">Time</span>
                    <span class="sb-detail-val">${fmtTime(b.start)} — ${fmtTime(b.end)}</span>
                </div>
                <div class="sb-detail-row">
                    <span class="sb-detail-label">Duration</span>
                    <span class="sb-detail-val">${durH > 0 ? durH + 'h ' : ''}${durM > 0 ? durM + 'm' : ''}</span>
                </div>
                <div class="sb-detail-row">
                    <span class="sb-detail-label">Status</span>
                    <span class="sb-detail-val" style="color:${st.color};">${st.label}</span>
                </div>
            </div>

            <div class="sb-section">
                <div class="sb-section-title">Route</div>
                <div class="sb-route">
                    <div class="sb-route-line">
                        <div class="sb-route-dot" style="border-color:${st.color};"></div>
                        <div class="sb-route-dash"></div>
                        <div class="sb-route-dot" style="border-color:${st.color};"></div>
                    </div>
                    <div class="sb-route-info">
                        <div>
                            <div class="sb-route-point">${b.from}</div>
                            <div class="sb-route-sub">Departure Point</div>
                        </div>
                        <div>
                            <div class="sb-route-point">${b.dest}</div>
                            <div class="sb-route-sub">Destination</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sb-section">
                <div class="sb-section-title">Vehicle</div>
                <div class="sb-info-grid">
                    <div class="sb-info-card">
                        <div class="sb-info-label">Plate</div>
                        <div class="sb-info-value">${b.plate}</div>
                    </div>
                    <div class="sb-info-card">
                        <div class="sb-info-label">Type</div>
                        <div class="sb-info-value">Hearse</div>
                    </div>
                </div>
            </div>

            <div class="sb-section">
                <div class="sb-section-title">Progress</div>
                <div class="sb-timeline">
                    ${steps.map(s => `
                        <div class="sb-tl-step ${s.done ? 'done' : ''} ${s.active ? 'active' : ''}">
                            <div class="sb-tl-dot"></div>
                            <div class="sb-tl-text">${s.label}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;

            document.getElementById('sidebarFooter').innerHTML = `
            <button class="sb-btn sb-btn-danger" id="sbDelete"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>Delete</button>
            <button class="sb-btn sb-btn-ghost" id="sbEdit"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>
            <button class="sb-btn sb-btn-primary" id="sbClose">Close</button>
        `;

            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarOverlay').classList.add('open');
            document.getElementById('calendarArea').classList.add('shifted');

            // Wire footer buttons
            document.getElementById('sbDelete').addEventListener('click', deleteBooking);
            document.getElementById('sbEdit').addEventListener('click', () => {
                const bk = findBooking(viewingId);
                closeSidebar();
                if (bk) setTimeout(() => openEditModal(bk), 250);
            });
            document.getElementById('sbClose').addEventListener('click', closeSidebar);
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
            document.getElementById('calendarArea').classList.remove('shifted');
            viewingId = null;
        }

        function deleteBooking() {
            if (!viewingId) return;
            for (const k in bookings) {
                bookings[k] = bookings[k].filter(b => b.id !== viewingId);
            }
            closeSidebar();
            render();
            toast('Booking deleted');
        }

        // ── Add/Edit Modal ──
        function populateForm() {
            const daySel = document.getElementById('fDay');
            const startSel = document.getElementById('fStart');
            const endSel = document.getElementById('fEnd');
            const sp = document.getElementById('statusPick');

            daySel.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const d = new Date(weekStart);
                d.setDate(d.getDate() + i);
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${DAYS[i]}, ${fmtDate(d)}`;
                daySel.appendChild(opt);
            }

            startSel.innerHTML = '';
            endSel.innerHTML = '';
            for (let h = START_H; h < END_H; h++) {
                for (let m = 0; m < 60; m += 15) {
                    const t = h + m / 60;
                    const lbl = fmtTime(t);
                    startSel.innerHTML += `<option value="${t}">${lbl}</option>`;
                    endSel.innerHTML += `<option value="${t}">${lbl}</option>`;
                }
            }
            endSel.innerHTML += `<option value="${END_H}">${fmtTime(END_H)}</option>`;
            startSel.value = 9;
            endSel.value = 10;

            sp.innerHTML = '';
            Object.entries(STATUSES).forEach(([k, v]) => {
                const chip = document.createElement('div');
                chip.className = `status-chip ${v.chip} ${k === selectedStatus ? 'selected' : ''}`;
                chip.textContent = v.label;
                chip.addEventListener('click', () => {
                    sp.querySelectorAll('.status-chip').forEach(c => c.classList.remove('selected'));
                    chip.classList.add('selected');
                    selectedStatus = k;
                });
                sp.appendChild(chip);
            });
        }

        function openAddModal(dayIdx, hour) {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'New Booking';
            document.getElementById('mSave').textContent = 'Save Booking';
            populateForm();
            if (dayIdx !== undefined) document.getElementById('fDay').value = dayIdx;
            if (hour !== undefined) {
                const sv = Math.round(hour * 4) / 4;
                document.getElementById('fStart').value = sv;
                document.getElementById('fEnd').value = sv + 1;
            }
            document.getElementById('fClient').value = '';
            document.getElementById('fDest').value = '';
            document.getElementById('fFrom').value = '';
            document.getElementById('fPlate').value = '';
            document.getElementById('fPhone').value = '';
            selectedStatus = 'booked';
            document.getElementById('statusPick').querySelectorAll('.status-chip').forEach((c, i) => {
                c.classList.toggle('selected', Object.keys(STATUSES)[i] === 'booked');
            });
            document.getElementById('addModal').classList.add('open');
            setTimeout(() => document.getElementById('fClient').focus(), 100);
        }

        function openEditModal(b) {
            editingId = b.id;
            document.getElementById('modalTitle').textContent = 'Edit Booking';
            document.getElementById('mSave').textContent = 'Update Booking';
            populateForm();

            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(weekStart);
                d.setDate(d.getDate() + i);
                weekDays.push(dk(d));
            }
            const parts = b.id.split('-');
            const bkDate = `${parts[0]}-${parts[1]}-${parts[2]}`;
            const di = weekDays.indexOf(bkDate);
            if (di >= 0) document.getElementById('fDay').value = di;

            document.getElementById('fStart').value = b.start;
            document.getElementById('fEnd').value = b.end;
            document.getElementById('fClient').value = b.client;
            document.getElementById('fDest').value = b.dest;
            document.getElementById('fFrom').value = b.from;
            document.getElementById('fPlate').value = b.plate;
            document.getElementById('fPhone').value = b.phone;
            selectedStatus = b.status;
            document.getElementById('statusPick').querySelectorAll('.status-chip').forEach((c, i) => {
                c.classList.toggle('selected', Object.keys(STATUSES)[i] === b.status);
            });
            document.getElementById('addModal').classList.add('open');
            setTimeout(() => document.getElementById('fClient').focus(), 100);
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
            editingId = null;
        }

        function saveBooking() {
            const client = document.getElementById('fClient').value.trim();
            const dest = document.getElementById('fDest').value.trim();
            const from = document.getElementById('fFrom').value.trim();
            const plate = document.getElementById('fPlate').value.trim();
            const phone = document.getElementById('fPhone').value.trim();
            const dayIdx = parseInt(document.getElementById('fDay').value);
            const start = parseFloat(document.getElementById('fStart').value);
            const end = parseFloat(document.getElementById('fEnd').value);

            if (!client) { toast('Enter client name'); return; }
            if (!dest) { toast('Enter destination'); return; }
            if (end <= start) { toast('End must be after start'); return; }

            const dayDate = new Date(weekStart);
            dayDate.setDate(dayDate.getDate() + dayIdx);
            const key = dk(dayDate);
            if (!bookings[key]) bookings[key] = [];

            if (editingId) {
                for (const k in bookings) bookings[k] = bookings[k].filter(b => b.id !== editingId);
                bookings[key].push({
                    id: editingId, client, dest, from: from || 'TBD',
                    start, end, status: selectedStatus,
                    phone: phone || '—', plate: plate || 'TBD'
                });
                toast('Booking updated');
            } else {
                bookings[key].push({
                    id: `${key}-${Date.now()}`, client, dest, from: from || 'TBD',
                    start, end, status: selectedStatus,
                    phone: phone || '—', plate: plate || 'TBD'
                });
                toast('Booking created');
            }

            closeAddModal();
            render();
        }

        // ── Toast ──
        function toast(msg) {
            const area = document.getElementById('toastArea');
            const el = document.createElement('div');
            el.className = 'toast-msg';
            el.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>${msg}`;
            area.appendChild(el);
            setTimeout(() => { if (el.parentNode) el.remove(); }, 3000);
        }

        // ── Events ──
        document.getElementById('prevWeek').addEventListener('click', () => {
            weekStart.setDate(weekStart.getDate() - 7);
            render();
        });
        document.getElementById('nextWeek').addEventListener('click', () => {
            weekStart.setDate(weekStart.getDate() + 7);
            render();
        });
        document.getElementById('todayBtn').addEventListener('click', () => {
            weekStart = getWeekStart(new Date());
            render();
            setTimeout(scrollToNow, 50);
        });
        document.getElementById('addBtn').addEventListener('click', () => openAddModal());

        document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
        document.getElementById('sidebarClose').addEventListener('click', closeSidebar);

        document.getElementById('modalClose').addEventListener('click', closeAddModal);
        document.getElementById('mCancel').addEventListener('click', closeAddModal);
        document.getElementById('mSave').addEventListener('click', saveBooking);
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('addModal')) closeAddModal();
        });

        document.getElementById('weekGrid').addEventListener('click', (e) => {
            const cell = e.target.closest('.hour-cell');
            if (cell) {
                openAddModal(parseInt(cell.dataset.day), parseInt(cell.dataset.hour));
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeAddModal(); closeSidebar(); }
            if (e.key === 'Enter' && document.getElementById('addModal').classList.contains('open')) saveBooking();
        });

        function scrollToNow() {
            const now = new Date();
            const nh = now.getHours() + now.getMinutes() / 60;
            if (nh >= START_H && nh < END_H) {
                const scroll = document.getElementById('gridWrapper');
                scroll.scrollTo({ top: Math.max(0, (nh - START_H - 1.5) * HOUR_H), behavior: 'smooth' });
            }
        }

        // ── Init ──
        seed();
        render();
        setTimeout(scrollToNow, 200);
        setInterval(() => { render(); }, 60000);
    </script>
</body>

</html>
