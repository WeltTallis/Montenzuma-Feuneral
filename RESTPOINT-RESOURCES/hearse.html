<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hearse Booking Calendar</title>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200;0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=Cormorant+Garamond:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #F7F6F3;
            --bg-pure: #FFFFFF;
            --bg-subtle: #F0EFEB;
            --bg-inset: #FAFAF8;
            --surface: #FFFFFF;
            --surface-raised: #FFFFFF;
            --border: #E5E4DF;
            --border-subtle: #EDECE8;
            --border-strong: #D4D3CE;
            --fg: #1A1A18;
            --fg-secondary: #4A4A46;
            --fg-tertiary: #7A7A74;
            --fg-quaternary: #A8A8A2;
            --fg-inverse: #FFFFFF;
            --accent: #1B4332;
            --accent-light: #2D6A4F;
            --accent-pale: #E8F0EC;
            --accent-muted: #D1E2DA;
            --gold: #9C7A3C;
            --gold-light: #C8A97E;
            --gold-pale: #F5EFE4;
            --gold-muted: #EDE4D3;
            --status-pending: #D97706;
            --status-pending-bg: #FFFBEB;
            --status-pending-border: #FDE68A;
            --status-booked: #2563EB;
            --status-booked-bg: #EFF6FF;
            --status-booked-border: #BFDBFE;
            --status-confirmed: #7C3AED;
            --status-confirmed-bg: #F5F3FF;
            --status-confirmed-border: #DDD6FE;
            --status-transit: #DC2626;
            --status-transit-bg: #FEF2F2;
            --status-transit-border: #FECACA;
            --status-completed: #059669;
            --status-completed-bg: #ECFDF5;
            --status-completed-border: #A7F3D0;
            --status-cancelled: #6B7280;
            --status-cancelled-bg: #F9FAFB;
            --status-cancelled-border: #E5E7EB;
            --radius-xs: 4px;
            --radius-sm: 6px;
            --radius: 8px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1), 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--fg);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background: var(--accent-pale);
            color: var(--accent);
        }

        /* ===== APP LAYOUT ===== */
        .app {
            display: flex;
            height: 100vh;
            position: relative;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 300px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
        }

        .sb-header {
            padding: 24px 22px 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sb-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .sb-brand-icon {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(27, 67, 50, 0.25);
            position: relative;
            overflow: hidden;
        }

        .sb-brand-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
        }

        .sb-brand h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--fg);
            line-height: 1.1;
            letter-spacing: -0.3px;
        }

        .sb-brand-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--fg-tertiary);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-top: 1px;
        }

        /* Search */
        .sb-search {
            position: relative;
        }

        .sb-search i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--fg-quaternary);
        }

        .sb-search input {
            width: 100%;
            padding: 9px 12px 9px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            font-family: inherit;
            color: var(--fg);
            background: var(--bg-inset);
            outline: none;
            transition: all 0.2s;
        }

        .sb-search input::placeholder {
            color: var(--fg-quaternary);
        }

        .sb-search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-pale);
            background: var(--surface);
        }

        /* Mini Calendar */
        .sb-minical {
            padding: 18px 22px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .mc-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .mc-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--fg);
        }

        .mc-nav {
            display: flex;
            gap: 2px;
        }

        .mc-nav button {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg-tertiary);
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .mc-nav button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-pale);
        }

        .mc-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            text-align: center;
        }

        .mc-dow {
            font-size: 10px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 6px 0;
        }

        .mc-day {
            font-size: 12px;
            font-weight: 500;
            color: var(--fg-secondary);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .mc-day:hover {
            background: var(--bg-subtle);
        }

        .mc-day.other {
            opacity: 0.2;
            pointer-events: none;
        }

        .mc-day.today {
            font-weight: 800;
            color: var(--accent);
            background: var(--accent-pale);
        }

        .mc-day.selected {
            background: var(--accent);
            color: white;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(27, 67, 50, 0.3);
        }

        .mc-day.selected.today {
            color: white;
            background: var(--accent);
        }

        .mc-day.has-ev::after {
            content: '';
            position: absolute;
            bottom: 3px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
        }

        .mc-day.selected.has-ev::after {
            background: rgba(255, 255, 255, 0.7);
        }

        /* Filter Chips */
        .sb-filters {
            padding: 14px 22px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg-tertiary);
            user-select: none;
        }

        .filter-chip:hover {
            border-color: var(--border-strong);
            color: var(--fg-secondary);
        }

        .filter-chip.active {
            border-color: var(--accent);
            background: var(--accent-pale);
            color: var(--accent);
        }

        .fc-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .fc-count {
            font-weight: 700;
            font-size: 10px;
            opacity: 0.7;
        }

        /* Upcoming Bookings */
        .sb-upcoming {
            flex: 1;
            overflow-y: auto;
            padding: 14px 22px;
        }

        .sb-upcoming::-webkit-scrollbar {
            width: 3px;
        }

        .sb-upcoming::-webkit-scrollbar-track {
            background: transparent;
        }

        .sb-upcoming::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .su-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .su-count {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-pale);
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 0;
            text-transform: none;
        }

        .su-card {
            padding: 12px 14px;
            background: var(--bg-inset);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .su-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        .su-card:hover {
            border-color: var(--border);
            box-shadow: var(--shadow-sm);
            transform: translateX(2px);
        }

        .su-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 6px;
            padding-left: 10px;
        }

        .su-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--fg);
            line-height: 1.2;
        }

        .su-time {
            font-size: 10px;
            font-weight: 700;
            color: var(--fg-tertiary);
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            padding: 2px 8px;
            border-radius: var(--radius-xs);
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .su-details {
            padding-left: 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .su-detail {
            font-size: 11px;
            color: var(--fg-tertiary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .su-detail i {
            font-size: 9px;
            width: 12px;
            text-align: center;
            color: var(--fg-quaternary);
        }

        .su-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 6px;
            margin-left: 10px;
        }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-pure);
            position: relative;
        }

        /* Top Bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--surface);
            flex-shrink: 0;
            gap: 16px;
            flex-wrap: wrap;
        }

        .tb-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .tb-nav {
            display: flex;
            gap: 4px;
        }

        .tb-nav-btn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg-tertiary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .tb-nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-pale);
        }

        .tb-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--fg);
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .tb-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tb-today {
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.15s;
        }

        .tb-today:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-pale);
        }

        .tb-views {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 3px;
            gap: 2px;
        }

        .tb-view {
            padding: 6px 16px;
            border: none;
            background: transparent;
            color: var(--fg-tertiary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            border-radius: var(--radius-xs);
            transition: all 0.2s;
        }

        .tb-view:hover {
            color: var(--fg-secondary);
        }

        .tb-view.active {
            background: var(--surface);
            color: var(--fg);
            box-shadow: var(--shadow-xs);
            font-weight: 700;
        }

        /* Stats Ribbon */
        .stats-ribbon {
            display: flex;
            align-items: stretch;
            gap: 0;
            border-bottom: 1px solid var(--border-subtle);
            background: var(--surface);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .stats-ribbon::-webkit-scrollbar {
            display: none;
        }

        .sr-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 22px;
            border-right: 1px solid var(--border-subtle);
            white-space: nowrap;
            cursor: default;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .sr-item:last-child {
            border-right: none;
        }

        .sr-item:hover {
            background: var(--bg-inset);
        }

        .sr-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .sr-info {
            display: flex;
            flex-direction: column;
        }

        .sr-num {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
        }

        .sr-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--fg-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== CALENDAR ===== */
        .cal-area {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* MONTH VIEW */
        .mv {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .mv-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border);
            background: var(--bg-inset);
            flex-shrink: 0;
        }

        .mv-dow {
            padding: 10px 12px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mv-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .mv-cell {
            border-right: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
            padding: 6px 8px;
            cursor: pointer;
            transition: background 0.15s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            background: var(--surface);
        }

        .mv-cell:nth-child(7n) {
            border-right: none;
        }

        .mv-cell:hover {
            background: var(--bg-inset);
        }

        .mv-cell.other {
            background: var(--bg);
        }

        .mv-cell.other .mv-date {
            opacity: 0.25;
        }

        .mv-cell.other .mv-ev {
            opacity: 0.3;
        }

        .mv-cell.selected {
            background: var(--accent-pale);
            box-shadow: inset 0 0 0 2px var(--accent);
            z-index: 2;
        }

        .mv-date-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .mv-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--fg-secondary);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.15s;
        }

        .mv-cell.today .mv-date {
            background: var(--accent);
            color: white;
            font-weight: 800;
            box-shadow: 0 1px 4px rgba(27, 67, 50, 0.3);
        }

        .mv-cell.selected.today .mv-date {
            box-shadow: 0 1px 4px rgba(27, 67, 50, 0.3);
        }

        .mv-ev-count {
            font-size: 9px;
            font-weight: 700;
            color: var(--fg-quaternary);
            background: var(--bg);
            padding: 1px 6px;
            border-radius: 10px;
        }

        .mv-evs {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .mv-ev {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 7px;
            border-radius: var(--radius-xs);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            border-left: 2px solid;
        }

        .mv-ev:hover {
            transform: translateX(2px);
            box-shadow: var(--shadow-sm);
        }

        .mv-ev-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .mv-ev-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .mv-ev-time {
            font-size: 9px;
            font-weight: 700;
            opacity: 0.6;
            flex-shrink: 0;
        }

        .mv-more {
            font-size: 10px;
            font-weight: 700;
            color: var(--accent);
            padding: 1px 6px;
            cursor: pointer;
            border-radius: var(--radius-xs);
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .mv-more:hover {
            background: var(--accent-pale);
        }

        /* WEEK/DAY VIEW */
        .tv {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .tv-head {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--surface);
        }

        .tv-gutter-head {
            width: 72px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            padding: 12px 8px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .tv-gutter-head span {
            font-size: 9px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tv-day-heads {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(var(--cols, 7), 1fr);
        }

        .tv-dh {
            padding: 10px 12px;
            text-align: center;
            border-right: 1px solid var(--border-subtle);
            transition: background 0.15s;
            cursor: pointer;
            position: relative;
        }

        .tv-dh:last-child {
            border-right: none;
        }

        .tv-dh:hover {
            background: var(--bg-inset);
        }

        .tv-dh.today {
            background: var(--accent-pale);
        }

        .tv-dh.today .tv-dh-dow {
            color: var(--accent);
        }

        .tv-dh-dow {
            font-size: 10px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tv-dh-num {
            font-size: 26px;
            font-weight: 800;
            color: var(--fg);
            margin-top: 2px;
            line-height: 1;
        }

        .tv-dh.today .tv-dh-num {
            color: var(--accent);
        }

        .tv-dh-sub {
            font-size: 10px;
            color: var(--fg-tertiary);
            font-weight: 500;
            margin-top: 2px;
        }

        /* All-day bar */
        .tv-allday {
            display: grid;
            grid-template-columns: 72px repeat(var(--cols, 7), 1fr);
            border-bottom: 1px solid var(--border);
            background: var(--bg-inset);
            flex-shrink: 0;
            min-height: 34px;
        }

        .tv-allday-gutter {
            border-right: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tv-allday-gutter span {
            font-size: 8px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tv-allday-col {
            border-right: 1px solid var(--border-subtle);
            padding: 3px 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tv-allday-col:last-child {
            border-right: none;
        }

        .tv-ad-pill {
            padding: 3px 8px;
            border-radius: var(--radius-xs);
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 2px solid;
        }

        .tv-ad-pill:hover {
            box-shadow: var(--shadow-sm);
        }

        /* Time body */
        .tv-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            position: relative;
            background: var(--surface);
        }

        .tv-body::-webkit-scrollbar {
            width: 6px;
        }

        .tv-body::-webkit-scrollbar-track {
            background: var(--bg);
        }

        .tv-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .tv-body::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
        }

        .tv-gutter {
            width: 72px;
            flex-shrink: 0;
            border-right: 1px solid var(--border);
            background: var(--bg-inset);
            position: sticky;
            left: 0;
            z-index: 5;
        }

        .tv-time-label {
            height: 60px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            transform: translateY(-7px);
            font-size: 10px;
            font-weight: 600;
            color: var(--fg-quaternary);
        }

        .tv-cols {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(var(--cols, 7), 1fr);
            position: relative;
        }

        .tv-col {
            border-right: 1px solid var(--border-subtle);
            position: relative;
        }

        .tv-col:last-child {
            border-right: none;
        }

        .tv-col.today {
            background: rgba(27, 67, 50, 0.02);
        }

        .tv-hour {
            height: 60px;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
        }

        .tv-half {
            position: absolute;
            left: 0;
            right: 0;
            top: 30px;
            border-bottom: 1px dashed var(--border);
            pointer-events: none;
        }

        /* Now line */
        .now-indicator {
            position: absolute;
            left: -6px;
            right: 0;
            height: 2px;
            background: var(--status-transit);
            z-index: 12;
            pointer-events: none;
        }

        .now-indicator::before {
            content: '';
            position: absolute;
            left: 0;
            top: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--status-transit);
            box-shadow: 0 0 0 3px var(--status-transit-bg);
        }

        /* Time event cards */
        .tv-event {
            position: absolute;
            left: 4px;
            right: 4px;
            border-radius: var(--radius);
            padding: 8px 10px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s;
            z-index: 10;
            border: 1px solid;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(2px);
        }

        .tv-event:hover {
            transform: scale(1.015);
            z-index: 20;
            box-shadow: var(--shadow-md);
        }

        .tv-ev-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .tv-ev-time {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .tv-ev-badge {
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .tv-ev-name {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tv-ev-row {
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tv-ev-row i {
            font-size: 8px;
            flex-shrink: 0;
        }

        .tv-ev-plate {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.06);
            letter-spacing: 0.5px;
        }

        /* ===== DETAIL PANEL ===== */
        .dp-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s;
            backdrop-filter: blur(4px);
        }

        .dp-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .dp-panel {
            position: fixed;
            top: 0;
            right: -460px;
            width: 440px;
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 101;
            transition: right 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-xl);
        }

        .dp-panel.open {
            right: 0;
        }

        .dp-top {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .dp-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid;
        }

        .dp-status-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            animation: dpPulse 2s ease-in-out infinite;
        }

        @keyframes dpPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(1.4);
            }
        }

        .dp-close {
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--fg-tertiary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .dp-close:hover {
            border-color: var(--status-transit);
            color: var(--status-transit);
            background: var(--status-transit-bg);
        }

        .dp-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .dp-content::-webkit-scrollbar {
            width: 3px;
        }

        .dp-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .dp-client {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--fg);
            line-height: 1.15;
            margin-bottom: 4px;
        }

        .dp-code {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
            letter-spacing: 0.5px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dp-section {
            margin-bottom: 24px;
        }

        .dp-sec-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-subtle);
        }

        /* Route Card */
        .dp-route {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: var(--bg-inset);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
        }

        .dp-route-track {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3px 0;
        }

        .dp-route-node {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2.5px solid;
            flex-shrink: 0;
        }

        .dp-route-node.filled {
            background: currentColor;
        }

        .dp-route-line {
            width: 2px;
            flex: 1;
            min-height: 24px;
            margin: 3px 0;
            position: relative;
            overflow: hidden;
        }

        .dp-route-line::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to bottom,
                    var(--gold-light) 0px,
                    var(--gold-light) 4px,
                    transparent 4px,
                    transparent 8px);
            opacity: 0.5;
        }

        .dp-route-points {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .dp-rp-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .dp-rp-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--fg);
            line-height: 1.3;
        }

        /* Info Grid */
        .dp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .dp-card {
            padding: 14px;
            background: var(--bg-inset);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            transition: border-color 0.15s;
        }

        .dp-card:hover {
            border-color: var(--border);
        }

        .dp-card.wide {
            grid-column: 1 / -1;
        }

        .dp-card-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .dp-card-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--fg);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dp-card-value i {
            font-size: 12px;
            color: var(--fg-quaternary);
        }

        /* Timeline */
        .dp-timeline {
            position: relative;
            padding-left: 24px;
        }

        .dp-timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 6px;
            bottom: 6px;
            width: 2px;
            background: var(--border);
        }

        .dp-tl-item {
            position: relative;
            padding-bottom: 16px;
        }

        .dp-tl-item:last-child {
            padding-bottom: 0;
        }

        .dp-tl-dot {
            position: absolute;
            left: -20px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--border-strong);
            background: var(--surface);
        }

        .dp-tl-dot.active {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-pale);
        }

        .dp-tl-dot.done {
            border-color: var(--status-completed);
            background: var(--status-completed);
        }

        .dp-tl-time {
            font-size: 9px;
            font-weight: 700;
            color: var(--fg-quaternary);
            text-transform: uppercase;
        }

        .dp-tl-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--fg);
            margin-top: 1px;
        }

        /* Action buttons in panel */
        .dp-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .dp-act {
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid;
        }

        .dp-act:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .dp-act.wide {
            grid-column: 1 / -1;
        }

        /* Footer */
        .dp-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            background: var(--bg-inset);
        }

        .dp-btn {
            flex: 1;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
        }

        .dp-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .dp-btn-primary {
            background: var(--accent);
            color: white;
        }

        .dp-btn-primary:hover {
            background: var(--accent-light);
        }

        .dp-btn-ghost {
            background: var(--surface);
            color: var(--fg-tertiary);
            border: 1px solid var(--border);
        }

        .dp-btn-ghost:hover {
            color: var(--fg);
            border-color: var(--border-strong);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast-item {
            padding: 12px 20px;
            background: var(--fg);
            color: var(--fg-inverse);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(12px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: auto;
        }

        .toast-item.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-item i {
            font-size: 14px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1100px) {
            .sidebar {
                width: 260px;
            }

            .sr-item {
                padding: 10px 16px;
            }
        }

        @media (max-width: 860px) {
            .sidebar {
                display: none;
            }

            .topbar {
                padding: 12px 16px;
            }

            .tb-title {
                font-size: 20px;
            }

            .dp-panel {
                width: 100%;
                right: -100%;
            }

            .stats-ribbon {
                padding: 0 8px;
            }

            .sr-item {
                padding: 8px 12px;
            }

            .sr-icon {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }

            .sr-num {
                font-size: 15px;
            }
        }

        @media (max-width: 640px) {

            .tv-gutter,
            .tv-gutter-head,
            .tv-allday-gutter {
                width: 48px;
            }

            .tv-time-label {
                font-size: 8px;
            }

            .tv-dh-sub {
                display: none;
            }

            .tv-dh-num {
                font-size: 20px;
            }

            .tb-views {
                display: none;
            }
        }

        /* Animations */
        @keyframes cellFadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .mv-cell {
            animation: cellFadeIn 0.25s ease both;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <div class="app">
        <!-- SIDEBAR -->

            <div class="sb-minical">

                                class="fas fa-chevron-left"></i></button>

                    </div>
                </div>
            </div>

            <div class="stats-ribbon" id="statsRibbon"></div>
            <div class="cal-area" id="calArea"></div>
        </main>
    </div>

    <!-- Detail Panel -->
    <div class="dp-overlay" id="dpOverlay" onclick="closeDP()"></div>
    <div class="dp-panel" id="dpPanel">
        <div class="dp-top">
            <div class="dp-status" id="dpStatus"></div>
            <button class="dp-close" onclick="closeDP()" aria-label="Close"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="dp-content" id="dpContent"></div>
        <div class="dp-footer" id="dpFooter"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>

// ===== STATE =====
let B = genBookings();
let view = 'month';
let vd = new Date();
let mcd = new Date();
let selDate = null;
let activeFilters = new Set();
let searchQuery = '';

// ===== HELPERS =====
const dk = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sd = (a,b) => a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const ft = d => { let h=d.getHours(),m=d.getMinutes(),ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; };
const fd = d => DL[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
const filtered = () => B.filter(b => {
  if (activeFilters.size && !activeFilters.has(b.status)) return false;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    return b.client.toLowerCase().includes(q) || b.code.toLowerCase().includes(q) || b.plate.toLowerCase().includes(q) || b.dest.toLowerCase().includes(q) || b.from.toLowerCase().includes(q);
  }
  return true;
});
const forDate = d => filtered().filter(b => dk(b.date) === dk(d));

// ===== TOAST =====
function toast(msg, icon='check', color='var(--accent)') {
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.innerHTML = `<i class="fas fa-${icon}" style="color:${color}"></i> ${msg}`;
  c.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 2800);
}

// ===== SEARCH =====
function handleSearch(q) {
  searchQuery = q.trim();
  renderAll();
}

// ===== FILTERS =====
function renderFilters() {
  const el = document.getElementById('filters');
  const counts = {};
  filtered().forEach(b => counts[b.status] = (counts[b.status]||0)+1);
  el.innerHTML = Object.entries(S).map(([k,v]) =>
    `<div class="filter-chip ${activeFilters.has(k)?'active':''}" onclick="toggleFilter('${k}')">
      <div class="fc-dot" style="background:${v.color}"></div>
      ${v.label}
      <span class="fc-count">${counts[k]||0}</span>
    </div>`
  ).join('');
}

function toggleFilter(s) {
  activeFilters.has(s) ? activeFilters.delete(s) : activeFilters.add(s);
  renderAll();
}

// ===== UPCOMING =====
function renderUpcoming() {
  const el = document.getElementById('suList');
  const now = new Date();
  const list = filtered().filter(b => !b.allDay && b.date >= now && !['cancelled','completed'].includes(b.status)).sort((a,b)=>a.date-b.date).slice(0,8);
  document.getElementById('suCount').textContent = list.length;

  if (!list.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--fg-quaternary);padding:20px 0;text-align:center">No upcoming bookings</div>';
    return;
  }

  el.innerHTML = list.map(b => {
    const s = S[b.status]||S.pending;
    return `<div class="su-card" onclick="openDP(${b.id})" style="--c:${s.color}">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${s.color}"></div>
      <div class="su-top">
        <div class="su-name">${b.client}</div>
        <div class="su-time">${ft(b.date)}</div>
      </div>
      <div class="su-details">
        <div class="su-detail"><i class="fas fa-route"></i>${b.dest.length>30?b.dest.slice(0,30)+'...':b.dest}</div>
        <div class="su-detail"><i class="fas fa-car"></i>${b.plate} &middot; ${b.hearse.split(' ').slice(0,2).join(' ')}</div>
      </div>
      <div class="su-status-pill" style="background:${s.bg};color:${s.color};border:1px solid ${s.border}">${s.label}</div>
    </div>`;
  }).join('');
}

// ===== MINI CAL =====
function renderMC() {
  const y=mcd.getFullYear(), m=mcd.getMonth();
  document.getElementById('mcTitle').textContent = MO[m]+' '+y;
  const f=new Date(y,m,1), sw=f.getDay(), dim=new Date(y,m+1,0).getDate(), pd=new Date(y,m,0).getDate(), t=new Date();
  let h = DS.map(d=>`<div class="mc-dow">${d}</div>`).join('');
  for (let i=sw-1;i>=0;i--) h+=`<div class="mc-day other">${pd-i}</div>`;
  for (let d=1;d<=dim;d++) {
    const dt=new Date(y,m,d), it=sd(dt,t), is=selDate&&sd(dt,selDate), he=forDate(dt).length>0;
    const cls=['mc-day',it&&'today',is&&'selected',he&&'has-ev'].filter(Boolean).join(' ');
    h+=`<div class="${cls}" onclick="pickDate(${y},${m},${d})">${d}</div>`;
  }
  const tc=sw+dim, rem=(7-tc%7)%7;
  for (let i=1;i<=rem;i++) h+=`<div class="mc-day other">${i}</div>`;
  document.getElementById('mcGrid').innerHTML=h;
}

function mcNav(d) { mcd.setMonth(mcd.getMonth()+d); renderMC(); }

function pickDate(y,m,d) {
  selDate=new Date(y,m,d); vd=new Date(y,m,d); mcd=new Date(y,m,d);
  renderAll();
}

// ===== STATS =====
function renderStats() {
  const el = document.getElementById('statsRibbon');
  let rs,re;
  if (view==='month') { rs=new Date(vd.getFullYear(),vd.getMonth(),1); re=new Date(vd.getFullYear(),vd.getMonth()+1,0,23,59); }
  else if (view==='week') { const dow=vd.getDay(); rs=new Date(vd); rs.setDate(rs.getDate()-dow); rs.setHours(0,0,0,0); re=new Date(rs); re.setDate(re.getDate()+6); re.setHours(23,59,59); }
  else { rs=new Date(vd.getFullYear(),vd.getMonth(),vd.getDate(),0,0,0); re=new Date(vd.getFullYear(),vd.getMonth(),vd.getDate(),23,59,59); }
  const inR = filtered().filter(b=>b.date>=rs&&b.date<=re);
  const tot=inR.length, cn={}; inR.forEach(b=>cn[b.status]=(cn[b.status]||0)+1);

  const items = [
    { label:'Total Bookings', num:tot, icon:'calendar-days', color:'var(--accent)', bg:'var(--accent-pale)' },
    { label:'In Transit', num:cn.in_transit||0, icon:'truck-fast', color:'var(--status-transit)', bg:'var(--status-transit-bg)' },
    { label:'Confirmed', num:cn.confirmed||0, icon:'circle-check', color:'var(--status-confirmed)', bg:'var(--status-confirmed-bg)' },
    { label:'Booked', num:cn.booked||0, icon:'calendar-check', color:'var(--status-booked)', bg:'var(--status-booked-bg)' },
    { label:'Pending', num:cn.pending||0, icon:'clock', color:'var(--status-pending)', bg:'var(--status-pending-bg)' },
    { label:'Completed', num:cn.completed||0, icon:'flag-checkered', color:'var(--status-completed)', bg:'var(--status-completed-bg)' },
  ];

  el.innerHTML = items.map(i => `<div class="sr-item">
    <div class="sr-icon" style="background:${i.bg};color:${i.color}"><i class="fas fa-${i.icon}"></i></div>
    <div class="sr-info"><div class="sr-num" style="color:${i.color}">${i.num}</div><div class="sr-label">${i.label}</div></div>
  </div>`).join('');
}

// ===== TITLE =====
function renderTitle() {
  const el = document.getElementById('tbTitle');
  if (view==='month') el.textContent = MO[vd.getMonth()]+' '+vd.getFullYear();
  else if (view==='week') {
    const dow=vd.getDay(), s=new Date(vd); s.setDate(s.getDate()-dow), e=new Date(s); e.setDate(e.getDate()+6);
    el.textContent = s.getMonth()===e.getMonth() ? MO[s.getMonth()]+' '+s.getDate()+' – '+e.getDate()+', '+s.getFullYear() : MO[s.getMonth()].slice(0,3)+' '+s.getDate()+' – '+MO[e.getMonth()].slice(0,3)+' '+e.getDate()+', '+s.getFullYear();
  } else el.textContent = DL[vd.getDay()]+', '+MO[vd.getMonth()]+' '+vd.getDate()+', '+vd.getFullYear();
}

// ===== NAV =====
function navCal(d) {
  if (view==='month') vd.setMonth(vd.getMonth()+d);
  else if (view==='week') vd.setDate(vd.getDate()+d*7);
  else vd.setDate(vd.getDate()+d);
  renderCal(); renderTitle(); renderStats();
}

function goToday() {
  vd=new Date(); selDate=new Date(); mcd=new Date();
  renderAll(); toast('Jumped to today','crosshairs');
}

function setView(v) {
  view=v;
  document.querySelectorAll('.tb-view').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  renderCal(); renderTitle(); renderStats();
}

// ===== RENDER CAL =====
function renderCal() {
  const a=document.getElementById('calArea');
  if (view==='month') renderMonth(a); else renderTime(a, view==='week'?7:1);
}

// ===== MONTH =====
function renderMonth(a) {
  const y=vd.getFullYear(),m=vd.getMonth(),f=new Date(y,m,1),sw=f.getDay(),dim=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate(),t=new Date();
  const tc=Math.ceil((sw+dim)/7)*7;

  let h = '<div class="mv"><div class="mv-dow-row">'+DS.map(d=>`<div class="mv-dow">${d}</div>`).join('')+'</div><div class="mv-grid">';

  for (let i=0;i<tc;i++) {
    let dn,ot=false,dt;
    if (i<sw) { dn=pd-sw+1+i; dt=new Date(y,m-1,dn); ot=true; }
    else if (i>=sw+dim) { dn=i-sw-dim+1; dt=new Date(y,m+1,dn); ot=true; }
    else { dn=i-sw+1; dt=new Date(y,m,dn); }

    const it=sd(dt,t), is=selDate&&sd(dt,selDate);
    const cls=['mv-cell',ot&&'other',it&&'today',is&&'selected'].filter(Boolean).join(' ');
    const evs=forDate(dt), mx=3;

    h+=`<div class="${cls}" onclick="pickDate(${dt.getFullYear()},${dt.getMonth()},${dt.getDate()})">`;
    h+=`<div class="mv-date-row"><div class="mv-date">${dn}</div>`;
    if (evs.length) h+=`<div class="mv-ev-count">${evs.length}</div>`;
    h+=`</div><div class="mv-evs">`;

    evs.slice(0,mx).forEach(b => {
      const s=S[b.status]||S.pending;
      h+=`<div class="mv-ev" style="background:${s.bg};border-left-color:${s.color};color:${s.color}" onclick="event.stopPropagation();openDP(${b.id})">
        <div class="mv-ev-dot" style="background:${s.color}"></div>
        <div class="mv-ev-text">${b.client.length>18?b.client.slice(0,18)+'...':b.client}</div>
        ${!b.allDay?`<div class="mv-ev-time">${ft(b.date)}</div>`:''}
      </div>`;
    });

    if (evs.length>mx) h+=`<div class="mv-more" onclick="event.stopPropagation();pickDate(${dt.getFullYear()},${dt.getMonth()},${dt.getDate()});setView('day')">+${evs.length-mx} more</div>`;
    h+=`</div></div>`;
  }
  h+='</div></div>';
  a.innerHTML=h;
}

// ===== WEEK/DAY =====
function renderTime(a, cols) {
  const t=new Date(), days=[];
  if (cols===7) { const dow=vd.getDay(), s=new Date(vd); s.setDate(s.getDate()-dow); for (let i=0;i<7;i++){const d=new Date(s);d.setDate(d.getDate()+i);days.push(d);} }
  else days.push(new Date(vd.getFullYear(),vd.getMonth(),vd.getDate()));

  const sh=5, eh=23, hh=60;
  const adEv=[], tmEv=[];
  days.forEach((day,di)=>{
    forDate(day).forEach(b=>{
      if (b.allDay) adEv.push({...b,ci:di});
      else {
        const sm=(b.date.getHours()-sh)*60+b.date.getMinutes(), em=(b.end.getHours()-sh)*60+b.end.getMinutes();
        tmEv.push({...b,ci:di,sm,em,dur:Math.max(30,em-sm)});
      }
    });
  });

  let h=`<div class="tv" style="--cols:${cols}">`;

  // Headers
  h+='<div class="tv-head"><div class="tv-gutter-head"><span>Time</span></div><div class="tv-day-heads">';
  days.forEach(d=>{
    const it=sd(d,t);
    h+=`<div class="tv-dh ${it?'today':''}" onclick="pickDate(${d.getFullYear()},${d.getMonth()},${d.getDate()});setView('day')">
      <div class="tv-dh-dow">${DS[d.getDay()]}</div>
      <div class="tv-dh-num">${d.getDate()}</div>
      ${cols===1?`<div class="tv-dh-sub">${MO[d.getMonth()]} ${d.getFullYear()}</div>`:''}
    </div>`;
  });
  h+='</div></div>';

  // All-day
  if (adEv.length) {
    h+='<div class="tv-allday"><div class="tv-allday-gutter"><span>All Day</span></div>';
    for (let di=0;di<cols;di++) {
      h+='<div class="tv-allday-col">';
      adEv.filter(e=>e.ci===di).forEach(b=>{
        const s=S[b.status]||S.pending;
        h+=`<div class="tv-ad-pill" style="background:${s.bg};border-left-color:${s.color};color:${s.color}" onclick="openDP(${b.id})">${b.client}</div>`;
      });
      h+='</div>';
    }
    h+='</div>';
  }

  // Body
  h+='<div class="tv-body" id="tvBody"><div class="tv-gutter">';
  for (let hr=sh;hr<eh;hr++) {
    const lb=hr===0?'12 AM':hr<12?hr+' AM':hr===12?'12 PM':(hr-12)+' PM';
    h+=`<div class="tv-time-label">${lb}</div>`;
  }
  h+='</div><div class="tv-cols">';

  days.forEach((day,di)=>{
    const it=sd(day,t);
    h+=`<div class="tv-col ${it?'today':''}">`;
    for (let hr=sh;hr<eh;hr++) h+=`<div class="tv-hour"><div class="tv-half"></div></div>`;
    if (it) {
      const nm=(t.getHours()-sh)*60+t.getMinutes();
      if (nm>=0&&nm<(eh-sh)*60) h+=`<div class="now-indicator" style="top:${nm}px"></div>`;
    }
    // Events
    const ce=tmEv.filter(e=>e.ci===di);
    const placed=[];
    ce.forEach(ev=>{
      const ov=placed.filter(p=>!(ev.sm>=p.em||ev.em<=p.sm));
      ev.slot=ov.length?Math.max(...ov.map(o=>o.slot||0))+1:0;
      placed.push(ev);
    });
    const ms=placed.length?Math.max(...placed.map(e=>e.slot)):0;
    const sw=ms>0?(100-8)/(ms+1):92;

    placed.forEach(ev=>{
      const s=S[ev.status]||S.pending;
      const top=ev.sm, ht=Math.max(32,ev.dur), lf=4+ev.slot*(sw+1), w=Math.max(sw,30);
      h+=`<div class="tv-event" style="top:${top}px;height:${ht}px;left:${lf}%;width:${w}%;background:${s.bg};border-color:${s.border};color:${s.color}" onclick="openDP(${ev.id})">
        <div class="tv-ev-header">
          <div class="tv-ev-time">${ft(ev.date)} – ${ft(ev.end)}</div>
          <div class="tv-ev-badge" style="background:${s.color};color:white">${s.label}</div>
        </div>
        <div class="tv-ev-name">${ev.client}</div>
        ${ht>60?`<div class="tv-ev-row"><i class="fas fa-map-marker-alt"></i>${ev.dest.length>28?ev.dest.slice(0,28)+'...':ev.dest}</div>`:''}
        ${ht>85?`<div class="tv-ev-row"><i class="fas fa-car"></i>${ev.plate} &middot; ${ev.driver||'TBD'}</div>`:''}
        ${ht>110?`<div class="tv-ev-plate"><i class="fas fa-id-badge"></i>${ev.hearse}</div>`:''}
      </div>`;
    });
    h+='</div>';
  });
  h+='</div></div></div>';
  a.innerHTML=h;

  requestAnimationFrame(()=>{
    const body=document.getElementById('tvBody');
    if (body) { const nm=(t.getHours()-sh)*60+t.getMinutes(); body.scrollTop=Math.max(0,nm-150); }
  });
}

// ===== DETAIL PANEL =====
function openDP(id) {
  const b=B.find(x=>x.id===id);
  if (!b) return;
  const s=S[b.status]||S.pending;

  document.getElementById('dpStatus').innerHTML = `<div class="dp-status-pulse" style="background:${s.color}"></div>${s.label}`;
  document.getElementById('dpStatus').style.cssText = `background:${s.bg};color:${s.color};border-color:${s.border}`;

  const dur = b.allDay ? 'All Day' : Math.round((b.end-b.date)/60000)+' minutes';

  // Build timeline based on status
  const steps = [
    { time: b.allDay ? 'All Day' : ft(b.date), text: 'Vehicle dispatched from '+b.from.split(',')[0], done: ['in_transit','completed'].includes(b.status), active: b.status==='in_transit' },
    { time: b.allDay ? '' : ft(new Date(b.date.getTime()+(b.end-b.date)*0.3)), text: 'En route to destination', done: false, active: false },
    { time: b.allDay ? '' : ft(b.end), text: 'Arrival at '+b.dest.split(',')[0], done: b.status==='completed', active: false },
  ];

  if (['pending','booked','confirmed'].includes(b.status)) {
    steps[0].text = 'Vehicle to depart from '+b.from.split(',')[0];
    steps[0].active = true;
    steps[0].done = false;
  }
  if (b.status==='completed') { steps[0].done=true; steps[1].done=true; steps[2].done=true; }

  let html = `
    <div class="dp-client">${b.client}</div>
    <div class="dp-code"><i class="fas fa-barcode" style="opacity:0.5"></i> ${b.code}</div>

    <div class="dp-section">
      <div class="dp-sec-title">Route</div>
      <div class="dp-route">
        <div class="dp-route-track">
          <div class="dp-route-node filled" style="color:${s.color};border-color:${s.color}"></div>
          <div class="dp-route-line"></div>
          <div class="dp-route-node" style="color:var(--gold);border-color:var(--gold)"></div>
        </div>
        <div class="dp-route-points">
          <div><div class="dp-rp-label">Pickup Location</div><div class="dp-rp-value">${b.from}</div></div>
          <div><div class="dp-rp-label">Destination</div><div class="dp-rp-value">${b.dest}</div></div>
        </div>
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-sec-title">Schedule</div>
      <div class="dp-grid">
        <div class="dp-card"><div class="dp-card-label">Date</div><div class="dp-card-value"><i class="fas fa-calendar-day"></i>${b.allDay?'All Day Event':fd(b.date)}</div></div>
        <div class="dp-card"><div class="dp-card-label">Time</div><div class="dp-card-value"><i class="fas fa-clock"></i>${b.allDay?'Full Day':ft(b.date)+' – '+ft(b.end)}</div></div>
        <div class="dp-card"><div class="dp-card-label">Duration</div><div class="dp-card-value"><i class="fas fa-hourglass-half"></i>${dur}</div></div>
        <div class="dp-card"><div class="dp-card-label">Branch</div><div class="dp-card-value"><i class="fas fa-building"></i>${b.branch}</div></div>
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-sec-title">Vehicle & Driver</div>
      <div class="dp-grid">
        <div class="dp-card"><div class="dp-card-label">Vehicle</div><div class="dp-card-value"><i class="fas fa-car-side"></i>${b.hearse}</div></div>
        <div class="dp-card"><div class="dp-card-label">Plate</div><div class="dp-card-value"><i class="fas fa-id-badge"></i>${b.plate}</div></div>
        <div class="dp-card wide"><div class="dp-card-label">Assigned Driver</div><div class="dp-card-value"><i class="fas fa-user"></i>${b.driver||'Unassigned'}</div></div>
      </div>
    </div>

    ${b.phone?`<div class="dp-section">
      <div class="dp-sec-title">Client Contact</div>
      <div class="dp-card wide" style="padding:14px 16px;background:var(--bg-inset);border:1px solid var(--border-subtle);border-radius:var(--radius-md)">
        <div class="dp-card-label" style="margin-bottom:6px">Phone Number</div>
        <div class="dp-card-value" style="font-size:15px"><i class="fas fa-phone"></i>${b.phone}</div>
      </div>
    </div>`:''}

    ${b.notes?`<div class="dp-section">
      <div class="dp-sec-title">Service Notes</div>
      <div style="padding:14px 16px;background:var(--gold-pale);border:1px solid var(--gold-muted);border-radius:var(--radius-md);font-size:12px;color:var(--fg-secondary);line-height:1.6">
        <i class="fas fa-sticky-note" style="color:var(--gold);margin-right:6px"></i>${b.notes}
      </div>
    </div>`:''}

    <div class="dp-section">
      <div class="dp-sec-title">Progress</div>
      <div class="dp-timeline">
        ${steps.filter(st=>st.time).map(st=>`<div class="dp-tl-item">
          <div class="dp-tl-dot ${st.active?'active':''} ${st.done?'done':''}"></div>
          <div class="dp-tl-time">${st.time}</div>
          <div class="dp-tl-text">${st.text}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="dp-section">
      <div class="dp-sec-title">Quick Actions</div>
      <div class="dp-actions">
        <button class="dp-act" style="background:var(--status-confirmed-bg);border-color:var(--status-confirmed-border);color:var(--status-confirmed)" onclick="chgStatus(${b.id},'confirmed')"><i class="fas fa-circle-check"></i> Confirm</button>
        <button class="dp-act" style="background:var(--status-transit-bg);border-color:var(--status-transit-border);color:var(--status-transit)" onclick="chgStatus(${b.id},'in_transit')"><i class="fas fa-truck-fast"></i> Dispatch</button>
        <button class="dp-act" style="background:var(--status-completed-bg);border-color:var(--status-completed-border);color:var(--status-completed)" onclick="chgStatus(${b.id},'completed')"><i class="fas fa-flag-checkered"></i> Complete</button>
        <button class="dp-act" style="background:var(--status-pending-bg);border-color:var(--status-pending-border);color:var(--status-pending)" onclick="chgStatus(${b.id},'pending')"><i class="fas fa-clock-rotate-left"></i> Reset</button>
      </div>
    </div>
  `;

  document.getElementById('dpContent').innerHTML = html;
  document.getElementById('dpFooter').innerHTML = `
    <button class="dp-btn dp-btn-primary" onclick="toast('Editing ${b.client.replace(/'/g,"\\'")}','pen-to-square')"><i class="fas fa-pen-to-square"></i> Edit Booking</button>
    <button class="dp-btn dp-btn-ghost" onclick="chgStatus(${b.id},'cancelled');closeDP()"><i class="fas fa-ban"></i> Cancel</button>
  `;

  document.getElementById('dpOverlay').classList.add('open');
  document.getElementById('dpPanel').classList.add('open');
}

function closeDP() {
  document.getElementById('dpOverlay').classList.remove('open');
  document.getElementById('dpPanel').classList.remove('open');
}

function chgStatus(id, ns) {
  const b=B.find(x=>x.id===id);
  if (!b) return;
  b.status=ns;
  toast(`${b.client} → ${S[ns].label}`, S[ns].icon, S[ns].color);
  renderAll();
  if (document.getElementById('dpPanel').classList.contains('open')) openDP(id);
}

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (e.target.tagName==='INPUT') return;
  if (e.key==='Escape') closeDP();
  if (!document.getElementById('dpPanel').classList.contains('open')) {
    if (e.key==='ArrowLeft') navCal(-1);
    if (e.key==='ArrowRight') navCal(1);
  }
  if (e.key==='t'&&!e.ctrlKey&&!e.metaKey) { e.preventDefault(); goToday(); }
  if (e.key==='1') setView('month');
  if (e.key==='2') setView('week');
  if (e.key==='3') setView('day');
});

// ===== INIT =====
function renderAll() { renderMC(); renderFilters(); renderUpcoming(); renderCal(); renderTitle(); renderStats(); }
renderAll();
    </script>
</body>

</html>
