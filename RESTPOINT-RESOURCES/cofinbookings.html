<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffin Request Calendar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #F8FAFC;
            --bg-s: #FFFFFF;
            --bg-h: #F1F5F9;
            --bdr: #E2E8F0;
            --bdr-l: #EBF0F4;
            --tx: #0F172A;
            --mt: #64748B;
            --dm: #94A3B8;
            --r: 14px;
            --rs: 10px;
            --sw: 540px;
            --sh: 0 4px 16px rgba(0, 0, 0, .06);
            --sh-lg: 0 12px 40px rgba(0, 0, 0, .08);

            /* Status Colors */
            --st-requested: #F59E0B;
            --st-requested-bg: #FEF3C7;
            --st-reviewed: #8B5CF6;
            --st-reviewed-bg: #EDE9FE;
            --st-approved: #3B82F6;
            --st-approved-bg: #DBEAFE;
            --st-reserved: #10B981;
            --st-reserved-bg: #D1FAE5;
            --st-ready: #EC4899;
            --st-ready-bg: #FCE7F3;
            --st-dispatched: #8B5CF6;
            --st-dispatched-bg: #EDE9FE;
            --st-delivered: #059669;
            --st-delivered-bg: #D1FAE5;
            --st-completed: #64748B;
            --st-completed-bg: #F1F5F9;
            --st-rejected: #EF4444;
            --st-rejected-bg: #FEE2E2;
            --st-cancelled: #94A3B8;
            --st-cancelled-bg: #F1F5F9;

            /* Branch Colors */
            --branch-westlands: #8B5CF6;
            --branch-westlands-bg: #EDE9FE;
            --branch-east: #3B82F6;
            --branch-east-bg: #DBEAFE;
            --branch-south: #10B981;
            --branch-south-bg: #D1FAE5;
            --branch-main: #F59E0B;
            --branch-main-bg: #FEF3C7;
            --branch-north: #EC4899;
            --branch-north-bg: #FCE7F3;

            /* Coffin Type Colors */
            --ct-standard: #3B82F6;
            --ct-standard-bg: #DBEAFE;
            --ct-premium: #8B5CF6;
            --ct-premium-bg: #EDE9FE;
            --ct-eco: #10B981;
            --ct-eco-bg: #D1FAE5;
            --ct-child: #EC4899;
            --ct-child-bg: #FCE7F3;
            --ct-custom: #F59E0B;
            --ct-custom-bg: #FEF3C7;
            --ct-oversized: #EF4444;
            --ct-oversized-bg: #FEE2E2;

            /* Priority Colors */
            --pri-normal: #64748B;
            --pri-normal-bg: #F1F5F9;
            --pri-urgent: #F59E0B;
            --pri-urgent-bg: #FEF3C7;
            --pri-critical: #EF4444;
            --pri-critical-bg: #FEE2E2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--tx);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid var(--bdr);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            flex-shrink: 0;
            z-index: 20;
            background: var(--bg-s)
        }

        .tb-l {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 16px
        }

        .brand {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -.4px;
            color: var(--tx)
        }

        .brand span {
            color: var(--mt);
            font-weight: 400;
            font-size: 13px
        }

        .tb-c {
            display: flex;
            align-items: center;
            gap: 6px
        }

        .nbtn {
            width: 34px;
            height: 34px;
            border: 1px solid var(--bdr);
            background: var(--bg-s);
            border-radius: var(--rs);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all .15s;
            color: var(--mt)
        }

        .nbtn:hover {
            background: var(--tx);
            color: #fff;
            border-color: var(--tx)
        }

        .wlbl {
            font-size: 14px;
            font-weight: 600;
            min-width: 260px;
            text-align: center;
            letter-spacing: -.2px;
            color: var(--tx)
        }

        .tbtn {
            padding: 6px 16px;
            border: 1px solid var(--bdr);
            background: var(--bg-s);
            border-radius: var(--rs);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
            color: var(--mt)
        }

        .tbtn:hover {
            background: var(--tx);
            color: #fff;
            border-color: var(--tx)
        }

        .abtn {
            padding: 8px 20px;
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: #fff;
            border: none;
            border-radius: var(--rs);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all .15s;
            font-family: inherit
        }

        .abtn:hover {
            transform: translateY(-1px);
            box-shadow: var(--sh-lg)
        }

        .filters {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-bottom: 1px solid var(--bdr);
            flex-shrink: 0;
            flex-wrap: wrap;
            background: var(--bg)
        }

        .fg-label {
            font-size: 8px;
            font-weight: 600;
            color: var(--mt);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-right: 2px
        }

        .fsel {
            padding: 6px 12px;
            border: 1px solid var(--bdr);
            background: var(--bg-s);
            border-radius: var(--rs);
            font-size: 9px;
            font-weight: 500;
            color: var(--tx);
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            min-width: 120px
        }

        .fsel:hover {
            border-color: var(--tx)
        }

        .fsel:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .1)
        }

        .fsep {
            width: 1px;
            height: 24px;
            background: var(--bdr);
            margin: 0 4px
        }

        .summary {
            display: flex;
            gap: 8px;
            padding: 10px 24px 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
            background: var(--bg-s);
            border-bottom: 1px solid var(--bdr)
        }

        .sc {
            background: var(--bg);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            padding: 10px 16px 10px 18px;
            position: relative;
            overflow: hidden;
            flex: 1;
            min-width: 80px;
            transition: all .15s
        }

        .sc:hover {
            transform: translateY(-1px);
            box-shadow: var(--sh)
        }

        .sc::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            border-radius: var(--r) 0 0 var(--r)
        }

        .sl {
            font-size: 7px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--mt);
            margin-bottom: 2px
        }

        .sv {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -.4px;
            color: var(--tx)
        }

        .gw {
            flex: 1;
            overflow-y: auto;
            padding: 16px 24px 20px;
            position: relative;
            background: var(--bg)
        }

        .gw::-webkit-scrollbar {
            width: 5px
        }

        .gw::-webkit-scrollbar-track {
            background: transparent
        }

        .gw::-webkit-scrollbar-thumb {
            background: var(--bdr);
            border-radius: 3px
        }

        .gw::-webkit-scrollbar-thumb:hover {
            background: var(--mt)
        }

        .fl {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none
        }

        .fb {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 8px;
            font-weight: 600;
            box-shadow: var(--sh-lg);
            animation: fi .5s cubic-bezier(.22, 1, .36, 1) both;
            pointer-events: auto;
            white-space: nowrap;
            background: #fff;
            border: 1px solid var(--bdr)
        }

        .fp {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0
        }

        .fp::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: .3;
            animation: pu 2s ease-in-out infinite
        }

        @keyframes pu {

            0%,
            100% {
                transform: scale(1);
                opacity: .3
            }

            50% {
                transform: scale(1.8);
                opacity: 0
            }
        }

        @keyframes fi {
            from {
                opacity: 0;
                transform: translateX(14px)
            }

            to {
                opacity: 1;
                transform: translateX(0)
            }
        }

        .dh-row {
            display: flex;
            border-bottom: 2px solid var(--bdr);
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 8;
            padding-bottom: 10px
        }

        .dh-spacer {
            width: 56px;
            flex-shrink: 0;
            border-right: 1px solid var(--bdr-l)
        }

        .dh-cell {
            flex: 1;
            text-align: center;
            padding: 8px 2px 0;
            border-right: 1px solid var(--bdr-l)
        }

        .dh-cell:last-child {
            border-right: none
        }

        .dh-name {
            font-size: 8px;
            font-weight: 600;
            color: var(--dm);
            text-transform: uppercase;
            letter-spacing: .8px;
            margin-bottom: 4px
        }

        .dh-num {
            font-size: 16px;
            font-weight: 700;
            color: var(--mt);
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all .15s
        }

        .dh-cell.is-today .dh-name {
            color: #3B82F6
        }

        .dh-cell.is-today .dh-num {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            color: #fff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, .3)
        }

        .tl-row {
            display: flex;
            flex: 1;
            position: relative
        }

        .tl-spacer {
            width: 56px;
            flex-shrink: 0;
            border-right: 1px solid var(--bdr-l)
        }

        .tl-label {
            height: 64px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 0 8px 0 0;
            font-size: 8px;
            font-weight: 600;
            color: var(--dm);
            transform: translateY(-5px)
        }

        .days-wrap {
            display: flex;
            flex: 1;
            position: relative
        }

        .day-col {
            flex: 1;
            position: relative;
            border-right: 1px solid var(--bdr-l)
        }

        .day-col:last-child {
            border-right: none
        }

        .day-col.is-today {
            background: rgba(59, 130, 246, .03)
        }

        .hour-cell {
            height: 64px;
            border-bottom: 1px solid var(--bdr-l);
            cursor: pointer;
            transition: background .1s;
            position: relative
        }

        .hour-cell:hover {
            background: var(--bg-h)
        }

        .hour-cell::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-bottom: 1px dashed rgba(0, 0, 0, .04);
            pointer-events: none
        }

        /* Modern Request Card Design */
        .req-card {
            position: absolute;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 10px;
            cursor: pointer;
            overflow: hidden;
            z-index: 5;
            transition: all .2s;
            animation: bi .3s cubic-bezier(.22, 1, .36, 1) both;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
            border-left: 4px solid
        }

        .req-card:hover {
            transform: scale(1.03);
            z-index: 9;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .12)
        }

        @keyframes bi {
            from {
                opacity: 0;
                transform: scaleY(.88) translateY(2px)
            }

            to {
                opacity: 1;
                transform: scaleY(1) translateY(0)
            }
        }

        .req-card .rc-branch {
            font-size: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .6px;
            opacity: .7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .req-card .rc-client {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 1px 0
        }

        .req-card .rc-deceased {
            font-size: 7px;
            opacity: .65;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .req-card .rc-time {
            font-size: 7px;
            opacity: .7;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px
        }

        .req-card .rc-status {
            position: absolute;
            top: 4px;
            right: 5px;
            padding: 2px 6px;
            border-radius: 50px;
            font-size: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: #fff
        }

        .req-card .rc-priority {
            position: absolute;
            top: 4px;
            left: 5px;
            font-size: 5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            padding: 1px 6px;
            border-radius: 4px
        }

        .req-card .rc-booked-time {
            font-size: 5px;
            opacity: .5;
            position: absolute;
            bottom: 3px;
            right: 6px;
            display: flex;
            align-items: center;
            gap: 3px
        }

        /* Beautiful Branch Colors */
        .branch-westlands {
            background: var(--branch-westlands-bg);
            color: var(--branch-westlands);
            border-color: var(--branch-westlands)
        }

        .branch-east {
            background: var(--branch-east-bg);
            color: var(--branch-east);
            border-color: var(--branch-east)
        }

        .branch-south {
            background: var(--branch-south-bg);
            color: var(--branch-south);
            border-color: var(--branch-south)
        }

        .branch-main {
            background: var(--branch-main-bg);
            color: var(--branch-main);
            border-color: var(--branch-main)
        }

        .branch-north {
            background: var(--branch-north-bg);
            color: var(--branch-north);
            border-color: var(--branch-north)
        }

        /* Coffin Type Styles */
        .ct-standard {
            background: var(--ct-standard-bg);
            color: var(--ct-standard);
            border-color: var(--ct-standard)
        }

        .ct-premium {
            background: var(--ct-premium-bg);
            color: var(--ct-premium);
            border-color: var(--ct-premium)
        }

        .ct-eco {
            background: var(--ct-eco-bg);
            color: var(--ct-eco);
            border-color: var(--ct-eco)
        }

        .ct-child {
            background: var(--ct-child-bg);
            color: var(--ct-child);
            border-color: var(--ct-child)
        }

        .ct-custom {
            background: var(--ct-custom-bg);
            color: var(--ct-custom);
            border-color: var(--ct-custom)
        }

        .ct-oversized {
            background: var(--ct-oversized-bg);
            color: var(--ct-oversized);
            border-color: var(--ct-oversized)
        }

        /* Priority Badges */
        .priority-normal {
            background: var(--pri-normal-bg);
            color: var(--pri-normal)
        }

        .priority-urgent {
            background: var(--pri-urgent-bg);
            color: var(--pri-urgent)
        }

        .priority-critical {
            background: var(--pri-critical-bg);
            color: var(--pri-critical)
        }

        .now-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #EF4444;
            z-index: 10;
            pointer-events: none
        }

        .now-line::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -3px;
            width: 8px;
            height: 8px;
            background: #EF4444;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, .15)
        }

        .now-label {
            position: absolute;
            right: 0;
            top: -15px;
            font-size: 7px;
            font-weight: 700;
            color: #EF4444;
            background: var(--bg);
            padding: 0 3px;
            border-radius: 2px
        }

        /* Sidebar */
        .sov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .15);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s
        }

        .sov.op {
            opacity: 1;
            pointer-events: auto
        }

        .sb {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sw);
            height: 100vh;
            background: var(--bg-s);
            border-left: 1px solid var(--bdr);
            z-index: 60;
            transform: translateX(100%);
            transition: transform .35s cubic-bezier(.22, 1, .36, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 40px rgba(0, 0, 0, .04)
        }

        .sb.op {
            transform: translateX(0)
        }

        .sbh {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--bdr);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0
        }

        .sbh h3 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -.3px;
            color: var(--tx)
        }

        .cbtn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--bdr);
            background: var(--bg);
            border-radius: var(--rs);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all .15s;
            flex-shrink: 0;
            color: var(--mt)
        }

        .cbtn:hover {
            background: var(--tx);
            color: #fff;
            border-color: var(--tx)
        }

        .sbd {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px
        }

        .sbd::-webkit-scrollbar {
            width: 3px
        }

        .sbd::-webkit-scrollbar-thumb {
            background: var(--bdr);
            border-radius: 2px
        }

        .scb {
            height: 4px;
            border-radius: 2px;
            margin-bottom: 16px
        }

        .sbs {
            margin-bottom: 20px
        }

        .sbst {
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--dm);
            margin-bottom: 8px
        }

        .sig {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .sic {
            background: var(--bg);
            border: 1px solid var(--bdr);
            border-radius: var(--rs);
            padding: 10px 12px;
            transition: all .15s
        }

        .sic:hover {
            background: var(--bg-h)
        }

        .sil {
            font-size: 7px;
            font-weight: 600;
            color: var(--dm);
            text-transform: uppercase;
            margin-bottom: 2px
        }

        .siv {
            font-size: 11px;
            font-weight: 600;
            color: var(--tx)
        }

        .sdr {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--bdr-l)
        }

        .sdr:last-child {
            border-bottom: none
        }

        .sdl {
            font-size: 11px;
            color: var(--mt);
            font-weight: 500
        }

        .sdvl {
            font-size: 11px;
            font-weight: 600;
            color: var(--tx)
        }

        .sbf {
            padding: 14px 24px;
            border-top: 1px solid var(--bdr);
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap
        }

        .sbb {
            flex: 1;
            padding: 9px 12px;
            border-radius: var(--rs);
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 70px
        }

        .sbg {
            background: transparent;
            border: 1px solid var(--bdr);
            color: var(--mt)
        }

        .sbg:hover {
            background: var(--bg-h);
            color: var(--tx)
        }

        .sbdn {
            background: var(--st-rejected-bg);
            border: 1px solid rgba(239, 68, 68, .15);
            color: var(--st-rejected)
        }

        .sbdn:hover {
            background: rgba(239, 68, 68, .1)
        }

        .sbp {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6);
            border: none;
            color: #fff
        }

        .sbp:hover {
            opacity: .85
        }

        function toast(msg) { var el = document.createElement('div'); el.className = 'tm'; el.innerHTML = '<i class="fa-solid fa-check-circle"></i> ' + msg; document.getElementById('toastArea').appendChild(el); setTimeout(function () { if (el.parentNode) el.remove() }, 3000) }

        document.getElementById('prevW').onclick = function () { ws.setDate(ws.getDate() - 7); render() };
        document.getElementById('nextW').onclick = function () { ws.setDate(ws.getDate() + 7); render() };
        document.getElementById('todayBtn').onclick = function () { ws = wkS(new Date()); render(); setTimeout(scrollNow, 60) };
        document.getElementById('addBtn').onclick = function () { openAddMod() };
        document.getElementById('sbOv').onclick = closeSb;
        document.getElementById('sbClose').onclick = closeSb;
        document.getElementById('mClose').onclick = closeMod;
        document.getElementById('mCancel').onclick = closeMod;
        document.getElementById('mSave').onclick = saveBk;
        document.getElementById('addModal').onclick = function (e) { if (e.target === document.getElementById('addModal')) closeMod() };
        document.getElementById('timelineArea').addEventListener('click', function (e) { var cell = e.target.closest('.hour-cell'); if (cell) openAddMod(parseInt(cell.dataset.day), parseFloat(cell.dataset.hour)) });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeMod(); closeSb() } if (e.key === 'Enter' && document.getElementById('addModal').classList.contains('op')) saveBk() });

        function scrollNow() { var now = new Date(); var nh = now.getHours() + now.getMinutes() / 60; if (nh >= SH && nh < EH) document.getElementById('gridWrap').scrollTo({ top: Math.max(0, (nh - SH - 1.5) * HH), behavior: 'smooth' }) }

        loadData();
        render();
        setTimeout(scrollNow, 250);
        setInterval(function () { render() }, 60000);
    </script>
</body>

</html>
