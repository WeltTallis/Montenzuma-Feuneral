<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Dashboard — Coffin Production & Branch Requests</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F6F8;--surface:#FFFFFF;--surfaceHover:#F1F5F9;--border:#E2E8F0;--borderLight:#F1F5F9;
  --text:#0F172A;--textBody:#334155;--textSec:#64748B;--textMuted:#94A3B8;--textFaint:#CBD5E1;
  --primary:#1E40AF;--primaryBg:#EFF6FF;--primaryLight:#93C5FD;--primaryDark:#1E3A8A;
  --success:#059669;--successBg:#ECFDF5;--successLight:#6EE7B7;
  --warning:#D97706;--warningBg:#FFFBEB;--warningLight:#FCD34D;
  --danger:#DC2626;--dangerBg:#FEF2F2;--dangerLight:#FCA5A5;
  --purple:#7C3AED;--purpleBg:#F5F3FF;--purpleLight:#C4B5FD;
  --cyan:#0891B2;--cyanBg:#ECFEFF;--cyanLight:#67E8F9;
  --orange:#EA580C;--orangeBg:#FFF7ED;--orangeLight:#FDBA74;
  --pink:#DB2777;--pinkBg:#FDF2F8;
  --teal:#0D9488;--tealBg:#F0FDFA;
  --radius:10px;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.page{max-width:1500px;margin:0 auto;padding:1rem 1.5rem 3rem}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes progressFill{from{width:0%}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(30,64,175,.15)}50%{box-shadow:0 0 0 6px rgba(30,64,175,0)}}

.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem;animation:fadeIn .2s ease-out}
.header-left h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
.header-left p{font-size:.78rem;color:var(--textSec);margin-top:.15rem}
.header-right{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

.branch-selector{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.25rem .5rem .25rem .75rem}
.branch-selector .branch-label{font-size:.7rem;font-weight:700;color:var(--textMuted);text-transform:uppercase;letter-spacing:.04em}
.branch-selector select{border:none;background:none;font-size:.8rem;font-weight:700;color:var(--primary);cursor:pointer;font-family:inherit;padding:.25rem;outline:none;appearance:none}

.tabs{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px;margin-bottom:1rem;overflow-x:auto}
.tab{padding:.45rem .85rem;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--textSec);white-space:nowrap;border:none;background:none;display:flex;align-items:center;gap:.35rem}
.tab:hover{background:var(--surfaceHover);color:var(--textBody)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(30,64,175,.25)}
.tab .badge{background:rgba(255,255,255,.25);font-size:.6rem;font-weight:800;padding:.1rem .35rem;border-radius:8px;min-width:16px;text-align:center}

.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface);color:var(--textBody);font-family:inherit}
.btn:hover{background:var(--surfaceHover);border-color:var(--textMuted)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primaryDark);box-shadow:0 2px 8px rgba(30,64,175,.3)}
.btn-sm{padding:.25rem .55rem;font-size:.72rem;border-radius:5px}
.btn-danger{color:var(--danger);border-color:var(--dangerBg)}
.btn-danger:hover{background:var(--dangerBg)}
.btn-success{color:var(--success);border-color:var(--successBg);background:var(--successBg)}
.btn-success:hover{background:var(--successLight);border-color:var(--successLight)}
.btn-warning{color:var(--warning);border-color:var(--warningBg);background:var(--warningBg)}
.btn-warning:hover{background:var(--warningLight)}
.btn-outline-primary{color:var(--primary);border-color:var(--primary);background:var(--primaryBg)}
.btn-outline-primary:hover{background:var(--primary)}

.select{padding:.4rem 1.6rem .4rem .6rem;border:1px solid var(--border);border-radius:7px;font-size:.78rem;color:var(--textBody);background:var(--surface);cursor:pointer;font-family:inherit;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right .4rem center}

.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem;margin-bottom:1rem}
@media(max-width:1200px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem .9rem;transition:all .15s;animation:fadeIn .3s ease-out both;position:relative}
.stat-card:hover{border-color:var(--textMuted);box-shadow:0 4px 12px rgba(0,0,0,.05);transform:translateY(-2px)}
.stat-label{font-size:.62rem;font-weight:700;color:var(--textMuted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.25rem}
.stat-value{font-size:1.5rem;font-weight:900;line-height:1;letter-spacing:-.02em}
.stat-sub{font-size:.65rem;font-weight:600;margin-top:.2rem;display:inline-flex;align-items:center;gap:.15rem}
.stat-sub.up{color:var(--success)}.stat-sub.down{color:var(--danger)}.stat-sub.neutral{color:var(--textSec)}
.stat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem;position:absolute;top:.8rem;right:.8rem}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:fadeIn .3s ease-out both}
.card-header{padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--borderLight)}
.card-title{font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:.35rem}
.card-subtitle{font-size:.67rem;color:var(--textMuted);font-weight:500}
.card-body{padding:1rem}
.full-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1rem;animation:fadeIn .3s ease-out both}

.stage-bar{display:flex;gap:0;margin-bottom:1rem;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);animation:fadeIn .25s ease-out both}
.stage-seg{flex:1;padding:.55rem .4rem;text-align:center;cursor:default;transition:all .15s}
.stage-seg:hover{filter:brightness(.97)}
.stage-seg-count{font-size:1.2rem;font-weight:900;line-height:1}
.stage-seg-name{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.8;margin-top:.1rem}
.stage-seg-icon{font-size:.7rem;opacity:.5}

.pipeline{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem}
.pipeline-col{min-width:200px;flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:420px}
.pipeline-head{padding:.6rem .7rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--borderLight);flex-shrink:0}
.pipeline-head-left{display:flex;align-items:center;gap:.35rem}
.pipeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pipeline-name{font-size:.78rem;font-weight:700}
.pipeline-count{font-size:.62rem;font-weight:800;padding:.08rem .35rem;border-radius:8px;min-width:18px;text-align:center}
.pipeline-cards{padding:.4rem;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:.35rem}
.pipeline-empty{font-size:.68rem;color:var(--textMuted);text-align:center;padding:1.5rem .5rem;font-style:italic}
.p-card{background:var(--bg);border:1px solid var(--borderLight);border-radius:7px;padding:.55rem .65rem;transition:all .15s}
.p-card:hover{border-color:var(--border);box-shadow:0 2px 6px rgba(0,0,0,.04)}
.p-card-id{font-size:.62rem;font-weight:800;color:var(--textMuted);margin-bottom:.15rem}
.p-card-name{font-size:.78rem;font-weight:700;margin-bottom:.2rem}
.p-card-meta{display:flex;flex-wrap:wrap;gap:.15rem;margin-bottom:.3rem}
.p-tag{font-size:.58rem;font-weight:700;padding:.08rem .3rem;border-radius:3px}
.p-card-assignee{display:flex;align-items:center;gap:.25rem;margin-bottom:.3rem}
.p-avatar{width:18px;height:18px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.48rem;font-weight:800;flex-shrink:0}
.p-assignee-name{font-size:.68rem;color:var(--textSec)}
.p-card-actions{display:flex;gap:.2rem}
.p-time{font-size:.58rem;color:var(--textMuted);margin-top:.2rem}

.hbar-item{display:flex;align-items:center;gap:.5rem;margin-bottom:.55rem}
.hbar-item:last-child{margin-bottom:0}
.hbar-label{width:80px;font-size:.72rem;color:var(--textSec);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:24px;background:var(--borderLight);border-radius:5px;overflow:hidden}
.hbar-fill{height:100%;border-radius:5px;animation:progressFill .7s ease-out;display:flex;align-items:center;justify-content:flex-end;padding-right:.5rem;min-width:fit-content}
.hbar-fill span{font-size:.62rem;font-weight:700;color:#fff;white-space:nowrap}
.hbar-value{width:40px;font-size:.72rem;font-weight:700;flex-shrink:0}

.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:.45rem .65rem;text-align:left;font-size:.62rem;font-weight:700;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);background:var(--bg)}
.tbl td{padding:.55rem .65rem;font-size:.78rem;color:var(--textBody);vertical-align:middle}
.tbl tr.border-b{border-bottom:1px solid var(--borderLight)}
.tbl tr:hover{background:var(--surfaceHover)}
.tbl-name{display:flex;align-items:center;gap:.4rem}
.tbl-avatar{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:800;flex-shrink:0}

.meta{font-size:.58rem;font-weight:700;padding:.08rem .35rem;border-radius:4px;display:inline-flex;align-items:center;gap:.12rem;white-space:nowrap}
.meta-info{background:var(--primaryBg);color:var(--primary)}
.meta-warn{background:var(--warningBg);color:var(--warning)}
.meta-success{background:var(--successBg);color:var(--success)}
.meta-danger{background:var(--dangerBg);color:var(--danger)}
.meta-purple{background:var(--purpleBg);color:var(--purple)}
.meta-cyan{background:var(--cyanBg);color:var(--cyan)}
.meta-orange{background:var(--orangeBg);color:var(--orange)}
.meta-teal{background:var(--tealBg);color:var(--teal)}

.activity-item{display:flex;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--borderLight);animation:slideIn .25s ease-out both}
.activity-item:last-child{border-bottom:none}
.activity-content{flex:1;min-width:0}
.activity-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.activity-person{font-size:.78rem;font-weight:700}
.activity-time{font-size:.62rem;color:var(--textMuted);white-space:nowrap}
.activity-desc{font-size:.72rem;color:var(--textSec);margin-top:.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;animation:scaleIn .2s ease-out;box-shadow:0 25px 60px rgba(0,0,0,.18)}
.modal-header{padding:1rem 1.2rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:1rem;font-weight:800}
.modal-close{width:30px;height:30px;border-radius:7px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--textMuted);transition:all .15s;font-size:1.15rem}
.modal-close:hover{background:var(--dangerBg);color:var(--danger)}
.modal-body{padding:1.2rem}
.modal-footer{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.5rem}

.form-group{margin-bottom:.875rem}
.form-label{display:block;font-size:.78rem;font-weight:700;color:var(--textBody);margin-bottom:.25rem}
.form-input,.form-select,.form-textarea{width:100%;padding:.45rem .7rem;border:1px solid var(--border);border-radius:7px;font-size:.78rem;color:var(--text);background:var(--surface);font-family:inherit;transition:border-color .15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.08)}
.form-textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}

.advance-stage-list{display:flex;flex-direction:column;gap:.4rem}
.advance-stage-option{display:flex;align-items:center;gap:.65rem;padding:.65rem .9rem;border:2px solid var(--border);border-radius:9px;cursor:pointer;transition:all .15s}
.advance-stage-option:hover{border-color:var(--primaryLight);background:var(--primaryBg)}
.advance-stage-option.selected{border-color:var(--primary);background:var(--primaryBg);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.advance-stage-option.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.advance-stage-dot{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.85rem}
.advance-stage-info{flex:1}
.advance-stage-name{font-size:.82rem;font-weight:700}
.advance-stage-desc{font-size:.67rem;color:var(--textSec);margin-top:.05rem}

.toast-container{position:fixed;top:1rem;right:1rem;z-index:200;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.toast{padding:.65rem .9rem;border-radius:9px;font-size:.78rem;font-weight:600;animation:slideIn .3s ease-out;box-shadow:0 6px 20px rgba(0,0,0,.12);display:flex;align-items:center;gap:.4rem;max-width:380px;pointer-events:auto}
.toast-success{background:#059669;color:#fff}
.toast-error{background:#DC2626;color:#fff}
.toast-info{background:var(--primary);color:#fff}

.users-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.7rem}
.user-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;transition:all .15s;animation:fadeIn .3s ease-out both}
.user-card:hover{border-color:var(--textMuted);box-shadow:0 4px 12px rgba(0,0,0,.05);transform:translateY(-2px)}
.user-card-top{display:flex;align-items:center;gap:.65rem;margin-bottom:.75rem}
.user-card-avatar{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;flex-shrink:0}
.user-card-name{font-size:.9rem;font-weight:800}
.user-card-role{font-size:.68rem;color:var(--textSec)}
.user-card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.user-stat{text-align:center;padding:.35rem .2rem;background:var(--bg);border-radius:5px}
.user-stat-val{font-size:.9rem;font-weight:800;line-height:1.1}
.user-stat-label{font-size:.55rem;color:var(--textMuted);text-transform:uppercase;letter-spacing:.04em;margin-top:.05rem}

.stage-badge{font-size:.62rem;font-weight:700;padding:.15rem .4rem;border-radius:5px;white-space:nowrap;display:inline-flex;align-items:center;gap:.15rem}
.view{display:none}.view.active{display:block}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--textFaint);border-radius:10px}

.time-stage{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.time-stage:last-child{margin-bottom:0}
.time-stage-name{width:80px;font-size:.72rem;color:var(--textSec);text-align:right;flex-shrink:0}
.time-stage-bar{flex:1;height:20px;background:var(--borderLight);border-radius:4px;overflow:hidden}
.time-stage-fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:.4rem;animation:progressFill .8s ease-out}
.time-stage-fill span{font-size:.58rem;font-weight:700;color:#fff;white-space:nowrap}
.time-stage-val{width:32px;font-size:.72rem;font-weight:700;flex-shrink:0;text-align:right}

.progress-bg{height:8px;background:var(--borderLight);border-radius:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;animation:progressFill .8s ease-out}

.top-performer{background:linear-gradient(135deg,#EFF6FF 0%,#F5F3FF 100%);border:2px solid var(--primaryLight);border-radius:var(--radius);padding:1.1rem;position:relative;overflow:hidden}
.top-performer::before{content:'';position:absolute;top:-25px;right:-25px;width:80px;height:80px;background:var(--primaryLight);opacity:.1;border-radius:50%}

.donut-wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-total{font-size:1.2rem;font-weight:900;line-height:1}
.donut-label{font-size:.58rem;color:var(--textMuted);margin-top:.08rem;text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;flex-direction:column;gap:.35rem;flex:1;min-width:0}
.legend-item{display:flex;align-items:center;gap:.35rem}
.legend-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.legend-name{flex:1;font-size:.68rem;color:var(--textBody);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-val{font-size:.68rem;font-weight:700;white-space:nowrap}
.legend-pct{font-size:.62rem;color:var(--textMuted);width:28px;text-align:right}

/* Branch request specific styles */
.branch-stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
.branch-coffin-card{background:var(--bg);border:1px solid var(--borderLight);border-radius:8px;padding:.7rem;transition:all .15s}
.branch-coffin-card:hover{border-color:var(--border);box-shadow:0 2px 6px rgba(0,0,0,.04)}
.branch-coffin-card .bcc-id{font-size:.6rem;font-weight:800;color:var(--textMuted)}
.branch-coffin-card .bcc-name{font-size:.82rem;font-weight:700;margin:.15rem 0}
.branch-coffin-card .bcc-meta{display:flex;flex-wrap:wrap;gap:.15rem;margin-bottom:.4rem}
.branch-coffin-card .bcc-branch{font-size:.65rem;color:var(--textSec);margin-bottom:.4rem;display:flex;align-items:center;gap:.2rem}

.req-status{display:inline-flex;align-items:center;gap:.2rem;font-size:.62rem;font-weight:700;padding:.15rem .45rem;border-radius:5px}
.req-pending{background:var(--warningBg);color:var(--warning);animation:glowPulse 2s infinite}
.req-approved{background:var(--primaryBg);color:var(--primary)}
.req-transit{background:var(--cyanBg);color:var(--cyan)}
.req-delivered{background:var(--successBg);color:var(--success)}
.req-rejected{background:var(--dangerBg);color:var(--danger)}

.branch-section{margin-bottom:1rem}
.branch-section-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;background:var(--bg);border:1px solid var(--borderLight);border-radius:8px 8px 0 0;cursor:pointer;transition:all .15s}
.branch-section-header:hover{background:var(--surfaceHover)}
.branch-section-header h3{font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:.35rem}
.branch-section-body{border:1px solid var(--borderLight);border-top:none;border-radius:0 0 8px 8px;padding:.6rem}
.branch-section-body.collapsed{display:none}

.empty-state{text-align:center;padding:2rem 1rem;color:var(--textMuted)}
.empty-state i{font-size:2rem;margin-bottom:.5rem;display:block;opacity:.4}
.empty-state p{font-size:.82rem}

.stock-bar-bg{width:55px;height:5px;background:var(--borderLight);border-radius:10px;overflow:hidden}
.stock-bar-fill{height:100%;border-radius:10px}

@media(max-width:768px){
  .page{padding:.75rem}
  .header{flex-direction:column;align-items:flex-start}
  .form-row{grid-template-columns:1fr}
  .pipeline-col{min-width:160px}
  .stage-bar{flex-wrap:wrap}
  .stage-seg{min-width:55px;flex:1 1 55px}
  .user-card-stats{grid-template-columns:repeat(2,1fr)}
  .branch-stock-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="header-left">
      <h1><i class="fa-solid fa-industry" style="color:var(--primary)"></i> Workshop Dashboard</h1>
      <p>Coffin production, branch stock & inter-branch requests</p>
    </div>
    <div class="header-right">

let state;
function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function resetData(){if(!confirm('Reset all data to defaults?'))return;state=getDefaultState();saveState();render();toast('Data reset','info')}
function switchBranch(id){currentBranch=id;render()}

// ═══════════════════════════════════════════════════════════════
function initials(n){return n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function daysBetween(a,b){return Math.max(0,Math.round((b-a)/86400000))}
function formatDate(ts){const d=new Date(ts);return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]}
function formatDateTime(ts){return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function timeAgo(ts){const diff=Date.now()-ts,m=Math.floor(diff/60000);if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const dd=Math.floor(h/24);if(dd<7)return dd+'d ago';return formatDate(ts)}
function getUser(id){return state.users.find(u=>u.id===id)||{name:'Unknown',role:'',color:'#94A3B8'}}
function getBranch(id){return state.branches.find(b=>b.id===id)||{name:'Unknown',location:''}}
function getStageName(i){return STAGES[i]?STAGES[i].name:'Unknown'}
function getWeekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d.getTime()}
function getMonthStart(){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return d.getTime()}
function getBranchOrders(branchId){return state.orders.filter(o=>o.branch===branchId)}
function getBranchCompleted(branchId,since){return state.orders.filter(o=>o.branch===branchId&&o.completedAt&&(!since||o.completedAt>=since))}

function toast(msg,type='success'){const el=document.createElement('div');el.className=`toast toast-${type}`;el.innerHTML=`<i class="fa-solid ${type==='success'?'fa-check-circle':type==='error'?'fa-circle-exclamation':'fa-info-circle'}"></i> ${msg}`;document.getElementById('toasts').appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3000)}

// ═══════════════════════════════════════════════════════════════

function openAdvanceModal(orderId){
  const order=state.orders.find(o=>o.id===orderId);
  if(!order||order.currentStage>=4)return;
  pendingAdvance=order;selectedAdvanceStage=order.currentStage+1;
  const user=getUser(order.assignedTo),cs=STAGES[order.currentStage],lastH=order.stageHistory[order.stageHistory.length-1],days=daysBetween(lastH.t,Date.now());
  let h=`<div style="background:${cs.bg};border:1px solid ${cs.color}22;border-radius:9px;padding:.8rem 1rem;margin-bottom:1rem">
    <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.25rem"><span style="font-size:.65rem;font-weight:800;color:${cs.color};text-transform:uppercase;letter-spacing:.05em">Current Stage</span><span style="font-size:.62rem;color:var(--textMuted);margin-left:auto">${days} days here</span></div>
    <div style="font-size:.95rem;font-weight:800">${order.name}</div>
    <div style="font-size:.72rem;color:var(--textSec);margin-top:.1rem">${order.id} · ${order.size} · ${order.color}</div>
    <div style="display:flex;align-items:center;gap:.3rem;margin-top:.4rem"><div class="p-avatar" style="background:${user.color}">${initials(user.name)}</div><span style="font-size:.72rem;color:var(--textBody);font-weight:500">${user.name}</span></div>
  </div>
  <div style="font-size:.78rem;font-weight:700;margin-bottom:.5rem">Advance to:</div>
  <div class="advance-stage-list">`;
  STAGES.forEach((s,i)=>{
    const isCur=i===order.currentStage,isNext=i===order.currentStage+1,isPast=i<order.currentStage,isFut=i>order.currentStage+1,isSel=i===selectedAdvanceStage;
    let cls='advance-stage-option';if(isCur||isPast||isFut)cls+=' disabled';if(isSel)cls+=' selected';
    let arrow='';if(isPast)arrow='<i class="fa-solid fa-check" style="color:var(--success)"></i>';else if(isCur)arrow=`<span style="font-size:.6rem;font-weight:700;color:${s.color}">You are here</span>`;else if(isNext)arrow='<i class="fa-solid fa-arrow-right" style="color:var(--success)"></i>';
    h+=`<div class="${cls}" data-stage="${i}" onclick="selectAdvanceStage(${i})"><div class="advance-stage-dot" style="background:${s.bg};color:${s.color}"><i class="fa-solid ${s.icon}"></i></div><div class="advance-stage-info"><div class="advance-stage-name">${s.name}</div><div class="advance-stage-desc">${isPast?'Passed':isCur?'Current':isNext?'Next stage':'Not available'}</div></div>${arrow}</div>`;
  });
  h+='</div>';
  document.getElementById('advance-body').innerHTML=h;
  document.getElementById('modal-advance').classList.add('open');
}
function selectAdvanceStage(i){if(i!==pendingAdvance.currentStage+1)return;selectedAdvanceStage=i;document.querySelectorAll('.advance-stage-option').forEach(el=>el.classList.toggle('selected',parseInt(el.dataset.stage)===i))}
function confirmAdvance(){
  if(!pendingAdvance)return;const o=pendingAdvance,now=Date.now();o.currentStage=selectedAdvanceStage;o.stageHistory.push({s:selectedAdvanceStage,t:now});
  if(o.currentStage===4){o.completedAt=now;state.materials.forEach(m=>{m.stock=Math.max(0,+(m.stock-m.usedPerCoffin).toFixed(1))});toast(`${o.id} completed and moved to Store!`)}
  else toast(`${o.id} advanced to ${STAGES[o.currentStage].name}`);
  saveState();closeModal('advance');render();
}

function submitRequest(){

  const now=Date.now();state.requests.push({id:'REQ-'+String(state.nextRequestId++).padStart(3,'0'),coffinId:pendingRequestCoffin.id,coffinName:pendingRequestCoffin.name,coffinSize:pendingRequestCoffin.size,coffinColor:pendingRequestCoffin.color,fromBranch:currentBranch,toBranch:pendingRequestCoffin.branch,status:'pending',urgency:document.getElementById('f-urgency').value,reason,createdAt:now,updatedAt:now});

function updateRequestStatus(reqId,newStatus){

  saveState();render();toast(msgs[newStatus]||'Updated');

// ═══════════════════════════════════════════════════════════════
// ANALYTICS HELPERS
function getCompleted(branchId,since){return state.orders.filter(o=>o.branch===branchId&&o.completedAt&&(!since||o.completedAt>=since))}
function getProductivity(branchId){const c={};state.users.forEach(u=>c[u.id]=0);getCompleted(branchId).forEach(o=>{c[o.assignedTo]=(c[o.assignedTo]||0)+1});return state.users.map(u=>({...u,completed:c[u.id]||0})).sort((a,b)=>b.completed-a.completed)}
function getAvgTimePerStage(branchId){const comp=getCompleted(branchId).filter(o=>o.stageHistory.length>=5);if(!comp.length)return STAGES.map((_,i)=>({stage:i,avgDays:0}));return STAGES.map((s,i)=>{const times=comp.map(o=>{const curr=o.stageHistory.find(h=>h.s===i),prev=i===0?null:o.stageHistory.find(h=>h.s===i-1);return curr?(prev?daysBetween(prev.t,curr.t):daysBetween(o.createdAt,curr.t)):0}).filter(t=>t>0);return{stage:i,avgDays:times.length?+(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1):0}})}
function getWeeklyProduction(branchId){const weeks=[];for(let w=7;w>=0;w--){const end=new Date();end.setDate(end.getDate()-w*7);const start=new Date(end);start.setDate(start.getDate()-6);start.setHours(0,0,0,0);end.setHours(23,59,59,999);weeks.push({label:'W'+(8-w),count:getCompleted(branchId,start.getTime()).filter(o=>o.completedAt<=end.getTime()).length})}return weeks}
function getUserMonthData(branchId){const ms=getMonthStart();return state.users.map(u=>{const mc=getCompleted(branchId,ms).filter(o=>o.assignedTo===u.id).length,wc=getCompleted(branchId,getWeekStart()).filter(o=>o.assignedTo===u.id).length,active=state.orders.filter(o=>o.branch===branchId&&o.assignedTo===u.id&&o.currentStage<4),ac=getCompleted(branchId).filter(o=>o.assignedTo===u.id);let avg=0;if(ac.length)avg=+(ac.reduce((a,o)=>a+daysBetween(o.createdAt,o.completedAt),0)/ac.length).toFixed(1);const as=[0,0,0,0,0];active.forEach(o=>{as[o.currentStage]++});return{id:u.id,name:u.name,role:u.role,color:u.color,monthCount:mc,weekCount:wc,activeCount:active.length,totalCount:ac.length,avgCycle:avg,activeStages:as}})}
function getRecentActivity(branchId){const acts=[];state.orders.filter(o=>o.branch===branchId).forEach(o=>{const u=getUser(o.assignedTo);acts.push({person:u.name,color:u.color,desc:`Created ${o.name} (${o.id})`,time:o.createdAt,type:'info'});o.stageHistory.slice(1).forEach(h=>{acts.push({person:u.name,color:u.color,desc:h.s===4?`Completed ${o.name}`:`${o.name} → ${STAGES[h.s].name}`,time:h.t,type:h.s===4?'success':'warn'})})});return acts.sort((a,b)=>b.time-a.time).slice(0,8)}

  const weekComp=getCompleted(b,getWeekStart()).length,monthComp=getCompleted(b,getMonthStart()).length;

  const stageCounts=STAGES.map((_,i)=>bo.filter(o=>o.currentStage===i).length);
  const prod=getProductivity(b),top=prod[0];

  h+=`</div></div></div>`;

  // Top Performer + Weekly

  if(top&&top.completed>0){h+=`<div class="top-performer"><div style="display:flex;align-items:center;gap:.65rem;position:relative;z-index:1"><div class="user-card-avatar" style="background:${top.color};width:46px;height:46px;font-size:1rem">${initials(top.name)}</div><div><div style="font-size:1rem;font-weight:900">${top.name}</div><div style="font-size:.75rem;color:var(--textSec)">${top.role}</div></div><div style="margin-left:auto;text-align:right"><div style="font-size:2rem;font-weight:900;color:var(--primary);line-height:1">${top.completed}</div><div style="font-size:.58rem;color:var(--textMuted);text-transform:uppercase;letter-spacing:.05em">Coffins</div></div></div></div><div style="margin-top:.75rem">`;prod.filter(p=>p.completed>0).slice(1).forEach(p=>{const pct=Math.round((p.completed/top.completed)*100);h+=`<div class="hbar-item"><div class="hbar-label">${p.name.split(' ')[0]}</div><div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${p.color}"><span>${pct>15?p.completed:''}</span></div></div><div class="hbar-value">${p.completed}</div></div>`});h+=`</div>`}else h+=`<div class="empty-state"><i class="fa-solid fa-trophy"></i><p>No completed coffins yet</p></div>`;
  h+=`</div></div>`;

  h+=`<div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-chart-bar" style="font-size:13px"></i> Weekly Production</div></div><div class="card-body" style="padding:.6rem 1rem">`;

  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><span style="font-size:.78rem;color:var(--textSec)">${state.users.length} workers</span><button class="btn btn-primary" onclick="openModal('user')"><i class="fa-solid fa-user-plus" style="font-size:10px"></i> Add Worker</button></div><div class="users-grid">`;
  data.forEach(u=>{h+=`<div class="user-card"><div class="user-card-top"><div class="user-card-avatar" style="background:${u.color}">${initials(u.name)}</div><div><div class="user-card-name">${u.name}</div><div class="user-card-role">${u.role}</div></div></div><div class="user-card-stats"><div class="user-stat"><div class="user-stat-val">${u.totalCount}</div><div class="user-stat-label">All Time</div></div><div class="user-stat"><div class="user-stat-val" style="color:var(--primary)">${u.monthCount}</div><div class="user-stat-label">Month</div></div><div class="user-stat"><div class="user-stat-val" style="color:var(--success)">${u.weekCount}</div><div class="user-stat-label">Week</div></div><div class="user-stat"><div class="user-stat-val" style="color:var(--warning)">${u.activeCount}</div><div class="user-stat-label">Active</div></div></div>${u.avgCycle>0?`<div style="margin-top:.5rem;font-size:.68rem;color:var(--textSec)"><i class="fa-regular fa-clock" style="font-size:9px"></i> Avg cycle: <strong>${u.avgCycle}d</strong></div>`:''}${u.activeCount>0?`<div style="margin-top:.25rem;display:flex;gap:.15rem;flex-wrap:wrap">${STAGES.map((s,i)=>u.activeStages[i]?`<span class="stage-badge" style="background:${s.bg};color:${s.color};font-size:.55rem;padding:.075rem .25rem">${u.activeStages[i]} ${s.name}</span>`:'').join('')}</div>`:''}<div class="user-card-actions" style="margin-top:.5rem;justify-content:flex-end"><button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')"><i class="fa-solid fa-trash" style="font-size:9px"></i></button></div></div>`});
  h+=`</div>`;c.innerHTML=h;
}

// RENDER: MATERIALS
function renderMaterials(){
  const c=document.getElementById('view-materials'),tc=getCompleted(currentBranch).length;
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem"><span style="font-size:.78rem;color:var(--textSec)">${state.materials.length} materials</span><button class="btn btn-primary" onclick="openModal('material')"><i class="fa-solid fa-cube" style="font-size:10px"></i> Add Material</button></div>
  <div class="full-card"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Material</th><th>Stock</th><th>Level</th><th>Unit</th><th>Per Coffin</th><th>Total Used</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
  state.materials.forEach(m=>{const isLow=m.stock<=m.lowStockThreshold,isCrit=m.stock<=m.lowStockThreshold*.5,pct=Math.min(100,Math.max(0,(m.stock/(m.lowStockThreshold*4))*100)),totalUsed=(m.usedPerCoffin*tc).toFixed(1),barClr=isCrit?'var(--danger)':isLow?'var(--warning)':'var(--success)';
    h+=`<tr class="border-b" ${isLow?'style="background:var(--dangerBg)"':''}><td style="font-weight:600">${m.name}</td><td style="font-weight:800;${isLow?'color:var(--danger)':''}">${m.stock}</td><td><div class="material-stock"><div class="stock-bar-bg"><div class="stock-bar-fill" style="width:${pct}%;background:${barClr}"></div></div></div></td><td style="font-size:.72rem">${m.unit}</td><td>${m.usedPerCoffin}</td><td>${totalUsed} ${m.unit}</td><td>${isCrit?'<span class="meta meta-danger"><i class="fa-solid fa-circle-exclamation" style="font-size:8px"></i> Critical</span>':isLow?'<span class="meta meta-warn"><i class="fa-solid fa-triangle-exclamation" style="font-size:8px"></i> Low</span>':'<span class="meta meta-success"><i class="fa-solid fa-check" style="font-size:8px"></i> OK</span>'}</td><td><div style="display:flex;gap:.2rem"><button class="btn btn-sm" onclick="restockMaterial('${m.id}')" title="Restock"><i class="fa-solid fa-plus" style="font-size:9px"></i></button><button class="btn btn-sm btn-danger" onclick="deleteMaterial('${m.id}')"><i class="fa-solid fa-trash" style="font-size:9px"></i></button></div></td></tr>`});
  h+=`</tbody></table></div></div>`;c.innerHTML=h;
}

// RENDER: BRANCH REQUESTS
function renderBranches(){
  const c=document.getElementById('view-branches'),b=currentBranch;
  const myStore=getBranchOrders(b).filter(o=>o.currentStage===4);
  const myRequests=state.requests.filter(r=>r.fromBranch===b);
  const incomingRequests=state.requests.filter(r=>r.toBranch===b&&r.status!=='delivered'&&r.status!=='rejected');
  const pendingCount=myRequests.filter(r=>r.status==='pending').length;

  let h='';

  // Current branch stock
  h+=`<div class="card" style="margin-bottom:1rem"><div class="card-header"><div class="card-title"><i class="fa-solid fa-warehouse" style="font-size:13px;color:var(--success)"></i> ${getBranch(b).name} — Coffins in Store</div><div class="card-subtitle">${myStore.length} available</div></div><div class="card-body">`;
  if(!myStore.length)h+=`<div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No coffins in store at this branch</p></div>`;
  else{h+=`<div class="branch-stock-grid">`;myStore.forEach(o=>{h+=`<div class="branch-coffin-card"><div class="bcc-id">${o.id}</div><div class="bcc-name">${o.name}</div><div class="bcc-meta"><span class="p-tag" style="background:var(--primaryBg);color:var(--primary)">${o.size}</span><span class="p-tag" style="background:var(--purpleBg);color:var(--purple)">${o.color}</span></div><div style="font-size:.62rem;color:var(--textMuted)"><i class="fa-regular fa-clock" style="font-size:8px"></i> Completed ${formatDate(o.completedAt)}</div></div>`});h+=`</div>`}
  h+=`</div></div>`;

  // Other branches' stock
  h+=`<div class="full-card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-magnifying-glass" style="font-size:13px"></i> Check Other Branches</div><div class="card-subtitle">Browse available coffins and send requests</div></div><div class="card-body" style="padding:.75rem">`;
  const otherBranches=state.branches.filter(br=>br.id!==b);
  let hasOtherStock=false;
  otherBranches.forEach((br,bi)=>{
    const brStore=state.orders.filter(o=>o.branch===br.id&&o.currentStage===4);
    // Also filter out coffins that are already requested and pending/approved/transit
    const requestedIds=new Set(state.requests.filter(r=>r.coffinId&&r.status!=='rejected'&&r.status!=='delivered').map(r=>r.coffinId));
    const available=brStore.filter(o=>!requestedIds.has(o.id));
    if(!brStore.length)return;
    hasOtherStock=true;
    const bClr=BRANCH_COLORS[bi%BRANCH_COLORS.length];
    h+=`<div class="branch-section"><div class="branch-section-header" onclick="this.nextElementSibling.classList.toggle('collapsed')">
      <h3><i class="fa-solid fa-building" style="color:${bClr};font-size:12px"></i> ${br.name} <span style="font-weight:400;color:var(--textMuted);font-size:.72rem">${br.location}</span></h3>
      <div style="display:flex;align-items:center;gap:.5rem"><span style="font-size:.72rem;font-weight:700;color:var(--success)">${available.length} available</span><span style="font-size:.72rem;color:var(--textMuted)">of ${brStore.length} total</span><i class="fa-solid fa-chevron-down" style="font-size:10px;color:var(--textMuted)"></i></div>
    </div><div class="branch-section-body">`;
    if(!available.length)h+=`<div style="padding:.75rem;font-size:.75rem;color:var(--textMuted);text-align:center">All coffins requested or in transit</div>`;
    else{h+=`<div class="branch-stock-grid">`;available.forEach(o=>{
      h+=`<div class="branch-coffin-card"><div class="bcc-id">${o.id}</div><div class="bcc-name">${o.name}</div><div class="bcc-meta"><span class="p-tag" style="background:var(--primaryBg);color:var(--primary)">${o.size}</span><span class="p-tag" style="background:var(--purpleBg);color:var(--purple)">${o.color}</span></div><div class="bcc-branch"><i class="fa-solid fa-building" style="font-size:9px"></i> ${br.name}</div><button class="btn btn-sm btn-outline-primary" style="width:100%" onclick="openRequestModal('${o.id}','${br.id}')"><i class="fa-solid fa-hand-holding" style="font-size:9px"></i> Request</button></div>`});
    h+=`</div>`}
    h+=`</div></div>`;
  });
  if(!hasOtherStock)h+=`<div class="empty-state"><i class="fa-solid fa-building"></i><p>No other branches have coffins in store</p></div>`;
  h+=`</div></div>`;

  // My Requests
  h+=`<div class="chart-grid">`;
  h+=`<div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-paper-plane" style="font-size:13px"></i> My Requests (Sent)</div><div class="card-subtitle">${myRequests.length} total</div></div><div class="card-body" style="padding:.6rem 1rem">`;
  if(!myRequests.length)h+=`<div class="empty-state" style="padding:1.5rem"><i class="fa-solid fa-inbox"></i><p>No requests sent</p></div>`;
  else{myRequests.sort((a,b)=>b.createdAt-a.createdAt).forEach(r=>{
    const statusCls={pending:'req-pending',approved:'req-approved',transit:'req-transit',delivered:'req-delivered',rejected:'req-rejected'}[r.status]||'req-pending';
    const statusIcon={pending:'fa-clock',approved:'fa-check',transit:'fa-truck',delivered:'fa-circle-check',rejected:'fa-xmark'}[r.status]||'fa-clock';
    const statusLabel={pending:'Pending',approved:'Approved',transit:'In Transit',delivered:'Delivered',rejected:'Rejected'}[r.status]||'Pending';
    const urgCls=r.urgency==='critical'?'meta-danger':r.urgency==='urgent'?'meta-warn':'meta-info';
    h+=`<div style="padding:.6rem 0;border-bottom:1px solid var(--borderLight)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem"><div><div style="font-size:.82rem;font-weight:700">${r.coffinName} <span style="color:var(--textMuted);font-weight:400">${r.coffinId}</span></div><div style="font-size:.68rem;color:var(--textSec);margin-top:.1rem">${r.coffinSize} · ${r.coffinColor} · From: ${getBranch(r.toBranch).name}</div></div><span class="req-status ${statusCls}"><i class="fa-solid ${statusIcon}" style="font-size:9px"></i> ${statusLabel}</span></div>
      <div style="display:flex;align-items:center;gap:.375rem;margin-top:.25rem"><span class="meta ${urgCls}">${r.urgency}</span><span style="font-size:.62rem;color:var(--textMuted)">${timeAgo(r.createdAt)}</span></div>
      <div style="font-size:.68rem;color:var(--textSec);margin-top:.2rem;font-style:italic">"${r.reason}"</div>
    </div>`;
  })}
  h+=`</div></div>`;

  // Incoming Requests (requests sent TO this branch)
  h+=`<div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-inbox" style="font-size:13px"></i> Incoming Requests</div><div class="card-subtitle">${incomingRequests.length} awaiting action</div></div><div class="card-body" style="padding:.6rem 1rem">`;
  if(!incomingRequests.length)h+=`<div class="empty-state" style="padding:1.5rem"><i class="fa-solid fa-check-double"></i><p>No pending incoming requests</p></div>`;
  else{incomingRequests.sort((a,b)=>b.createdAt-a.createdAt).forEach(r=>{
    const statusCls={pending:'req-pending',approved:'req-approved',transit:'req-transit'}[r.status]||'req-pending';
    const statusLabel={pending:'Pending',approved:'Approved',transit:'In Transit'}[r.status]||'Pending';
    const urgCls=r.urgency==='critical'?'meta-danger':r.urgency==='urgent'?'meta-warn':'meta-info';
    h+=`<div style="padding:.6rem 0;border-bottom:1px solid var(--borderLight)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem"><div><div style="font-size:.82rem;font-weight:700">${r.coffinName} <span style="color:var(--textMuted);font-weight:400">${r.coffinId}</span></div><div style="font-size:.68rem;color:var(--textSec);margin-top:.1rem">${r.coffinSize} · ${r.coffinColor} · Requested by: <strong>${getBranch(r.fromBranch).name}</strong></div></div><span class="req-status ${statusCls}">${statusLabel}</span></div>
      <div style="display:flex;align-items:center;gap:.375rem;margin-top:.25rem"><span class="meta ${urgCls}">${r.urgency}</span><span style="font-size:.62rem;color:var(--textMuted)">${timeAgo(r.createdAt)}</span></div>
      <div style="font-size:.68rem;color:var(--textSec);margin-top:.2rem;font-style:italic">"${r.reason}"</div>
      <div style="display:flex;gap:.375rem;margin-top:.4rem">`;
    if(r.status==='pending')h+=`<button class="btn btn-sm btn-success" onclick="updateRequestStatus('${r.id}','approved')"><i class="fa-solid fa-check" style="font-size:9px"></i> Approve</button><button class="btn btn-sm btn-danger" onclick="updateRequestStatus('${r.id}','rejected')"><i class="fa-solid fa-xmark" style="font-size:9px"></i> Reject</button>`;
    if(r.status==='approved')h+=`<button class="btn btn-sm btn-primary" onclick="updateRequestStatus('${r.id}','transit')"><i class="fa-solid fa-truck" style="font-size:9px"></i> Mark In Transit</button>`;
    if(r.status==='transit')h+=`<button class="btn btn-sm btn-success" onclick="updateRequestStatus('${r.id}','delivered')"><i class="fa-solid fa-circle-check" style="font-size:9px"></i> Mark Delivered</button>`;
    h+=`</div></div>`;
  })}
  h+=`</div></div></div>`;

  // All branches overview
  h+=`<div class="full-card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-chart-bar" style="font-size:13px"></i> All Branches Overview</div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Branch</th><th>Location</th><th>In Store</th><th>In Progress</th><th>Total Made</th><th>This Month</th><th>Pending Requests</th></tr></thead><tbody>`;
  state.branches.forEach((br,i)=>{
    const brOrders=state.orders.filter(o=>o.branch===br.id);
    const brStore=brOrders.filter(o=>o.currentStage===4).length;
    const brActive=brOrders.filter(o=>o.currentStage<4).length;
    const brComp=brOrders.filter(o=>o.completedAt).length;
    const brMonth=brOrders.filter(o=>o.completedAt&&o.completedAt>=getMonthStart()).length;
    const brPending=state.requests.filter(r=>r.toBranch===br.id&&r.status==='pending').length;
    const bClr=BRANCH_COLORS[i%BRANCH_COLORS.length];
    h+=`<tr class="border-b" ${br.id===b?'style="background:var(--primaryBg)"':''}><td><div class="tbl-name"><div class="tbl-avatar" style="background:${bClr}"><i class="fa-solid fa-building" style="font-size:.55rem"></i></div><span style="font-weight:700">${br.id===b?br.name+' (You)':br.name}</span></div></td><td style="font-size:.72rem;color:var(--textSec)">${br.location}</td><td style="font-weight:800;color:${brStore?'var(--success)':'var(--textMuted)'}">${brStore}</td><td>${brActive}</td><td style="font-weight:700">${brComp}</td><td style="font-weight:700;color:var(--primary)">${brMonth}</td><td>${brPending?`<span class="meta meta-warn">${brPending} pending</span>`:'<span class="meta meta-success">0</span>'}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  c.innerHTML=h;
}

// ═══════════════════════════════════════════════════════════════
// RENDER: ANALYTICS
function renderAnalytics(){
  const c=document.getElementById('view-analytics'),b=currentBranch;
  const data=getUserMonthData(b),totalComp=getCompleted(b).length,monthComp=getCompleted(b,getMonthStart()).length,weekComp=getCompleted(b,getWeekStart()).length;
  let h=`<div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card" style="animation-delay:.05s"><div class="stat-label">Total Completed</div><div class="stat-value">${totalComp}</div></div>
    <div class="stat-card" style="animation-delay:.1s"><div class="stat-label">This Month</div><div class="stat-value">${monthComp}</div></div>
    <div class="stat-card" style="animation-delay:.15s"><div class="stat-label">This Week</div><div class="stat-value">${weekComp}</div></div>
    <div class="stat-card" style="animation-delay:.2s"><div class="stat-label">Active Workers</div><div class="stat-value">${data.filter(d=>d.activeCount>0).length}</div></div>
  </div>`;

  h+=`<div class="full-card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-chart-column" style="font-size:13px"></i> Coffins Per Person — This Month</div></div><div class="card-body">`;
  const maxM=Math.max(1,...data.map(d=>d.monthCount));
  data.forEach(d=>{const pct=Math.max(3,(d.monthCount/maxM)*100);h+=`<div class="hbar-item" style="margin-bottom:.7rem"><div class="hbar-label" style="width:100px;font-weight:600">${d.name}</div><div class="hbar-track" style="height:30px"><div class="hbar-fill" style="width:${pct}%;background:${d.color};height:100%;border-radius:6px;justify-content:flex-end;padding-right:.5rem"><span style="font-size:.72rem;font-weight:800">${d.monthCount>0?d.monthCount:''}</span></div></div><div class="hbar-value" style="width:50px;font-size:.85rem">${d.monthCount}</div></div>`});
  h+=`</div></div>`;

  // Worker deep dive
  h+=`<div class="card" style="margin-bottom:1rem"><div class="card-header"><div class="card-title"><i class="fa-solid fa-magnifying-glass-chart" style="font-size:13px"></i> Worker Deep Dive</div></div><div class="card-body"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.5rem">`;
  data.forEach(d=>{
    const uComp=getCompleted(b).filter(o=>o.assignedTo===d.id&&o.stageHistory.length>=5);
    const stTimes=STAGES.map((s,i)=>{if(i===0)return uComp.map(o=>daysBetween(o.createdAt,o.stageHistory[0].t)).filter(t=>t>0);return uComp.map(o=>{const curr=o.stageHistory.find(h=>h.s===i),prev=o.stageHistory.find(h=>h.s===i-1);return(curr&&prev)?daysBetween(prev.t,curr.t):0}).filter(t=>t>0)});
    const avgST=stTimes.map(times=>times.length?+(times.reduce((a,b)=>a+b,0)/times.length).toFixed(1):0);
    const uMax=Math.max(1,...avgST);
    h+=`<div style="background:var(--bg);border:1px solid var(--borderLight);border-radius:8px;padding:.65rem;transition:all .15s">
      <div style="display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem"><div class="p-avatar" style="background:${d.color};width:28px;height:28px;font-size:.6rem">${initials(d.name)}</div><div><div style="font-size:.78rem;font-weight:700">${d.name}</div><div style="font-size:.58rem;color:var(--textMuted)">${d.role}</div></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.2rem;font-size:.68rem">
        <div style="padding:.15rem 0"><span style="color:var(--textMuted)">Month:</span> <strong style="color:var(--primary)">${d.monthCount}</strong></div>
        <div style="padding:.15rem 0"><span style="color:var(--textMuted)">Week:</span> <strong style="color:var(--success)">${d.weekCount}</strong></div>
        <div style="padding:.15rem 0"><span style="color:var(--textMuted)">Total:</span> <strong>${d.totalCount}</strong></div>
        <div style="padding:.15rem 0"><span style="color:var(--textMuted)">Cycle:</span> <strong style="color:${d.avgCycle>0&&d.avgCycle<15?'var(--success)':'var(--warning)'}">${d.avgCycle>0?d.avgCycle+'d':'N/A'}</strong></div>
      </div>
      ${uComp.length>0?`<div style="margin-top:.375rem;padding-top:.375rem;border-top:1px solid var(--borderLight)"><div style="font-size:.55rem;font-weight:700;color:var(--textMuted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.15rem">Avg stage times</div>${avgST.map((t,i)=>{const p=Math.max(3,(t/uMax)*100);return`<div style="display:flex;align-items:center;gap:.2rem;margin-bottom:.1rem"><div style="width:48px;font-size:.52rem;color:var(--textMuted);text-align:right;flex-shrink:0">${STAGES[i].name}</div><div style="flex:1;height:4px;background:var(--borderLight);border-radius:10px;overflow:hidden"><div style="height:100%;width:${p}%;background:${STAGES[i].color};border-radius:10px"></div></div><div style="width:20px;font-size:.55rem;font-weight:700;text-align:right">${t}d</div></div>`}).join('')}</div>`:''}
    </div>`;
  });
  h+=`</div></div></div>`;

  // Monthly trend + completed table
  h+=`<div class="chart-grid">`;
  h+=`<div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-calendar-days" style="font-size:13px"></i> Monthly Trend</div></div><div class="card-body">`;
  const months=[];for(let m=5;m>=0;m--){const end=new Date();end.setMonth(end.getMonth()-m);end.setDate(1);end.setHours(0,0,0,0);const start=new Date(end);start.setMonth(start.getMonth()-1);const label=end.toLocaleDateString('en-GB',{month:'short'});const count=getCompleted(b,start.getTime()).filter(o=>o.completedAt<end.getTime()).length;months.push({label,count})}
  const maxMo=Math.max(1,...months.map(m=>m.count));
  h+=`<div style="display:flex;align-items:flex-end;gap:.6rem;height:140px;padding-top:.5rem">`;
  months.forEach((m,i)=>{const ht=Math.max(4,(m.count/maxMo)*100),isCur=i===months.length-1;h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:.25rem"><div style="font-size:.75rem;font-weight:800;color:${m.count?'var(--text)':'var(--textMuted)'}">${m.count||''}</div><div style="width:100%;max-width:48px;height:${ht}px;background:${isCur?'var(--primary)':'var(--primaryLight)'};border-radius:5px 5px 2px 2px;${isCur?'box-shadow:0 2px 6px rgba(30,64,175,.2)':''}"></div><div style="font-size:.68rem;color:${isCur?'var(--primary)':'var(--textMuted)'};font-weight:${isCur?'800':'500'}">${m.label}</div></div>`});
  h+=`</div></div></div>`;

  // Completed this month table
  h+=`<div class="card"><div class="card-header"><div class="card-title"><i class="fa-solid fa-list-check" style="font-size:13px"></i> Completed This Month</div><div class="card-subtitle">${monthComp} coffins</div></div><div style="overflow-x:auto;max-height:300px;overflow-y:auto"><table class="tbl"><thead style="position:sticky;top:0;z-index:1"><tr><th>ID</th><th>Coffin</th><th>Built By</th><th>Cycle</th><th>Date</th></tr></thead><tbody>`;
  const mOrders=getCompleted(b,getMonthStart()).sort((a,b)=>b.completedAt-a.completedAt);
  if(!mOrders.length)h+=`<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:var(--textMuted)">None yet</td></tr>`;
  mOrders.forEach(o=>{const u=getUser(o.assignedTo),cycle=daysBetween(o.createdAt,o.completedAt);h+=`<tr class="border-b"><td style="font-weight:800;color:var(--primary)">${o.id}</td><td style="font-weight:600;font-size:.75rem">${o.name}</td><td><div class="tbl-name"><div class="tbl-avatar" style="background:${u.color};width:22px;height:22px;font-size:.5rem">${initials(u.name)}</div><span style="font-size:.75rem">${u.name}</span></div></td><td><span class="meta ${cycle<=10?'meta-success':cycle<=15?'meta-info':'meta-warn'}">${cycle}d</span></td><td style="font-size:.68rem;color:var(--textSec)">${formatDate(o.completedAt)}</td></tr>`});
  h+=`</tbody></table></div></div></div>`;
  c.innerHTML=h;
}

// ═══════════════════════════════════════════════════════════════
function exportData(){
  const b=currentBranch;const data={branch:getBranch(b).name,exportedAt:new Date().toISOString(),orders:getBranchOrders(b).map(o=>({id:o.id,name:o.name,size:o.size,color:o.color,assignedTo:getUser(o.assignedTo).name,stage:getStageName(o.currentStage),status:o.currentStage===4?'Completed':'In Progress',createdAt:new Date(o.createdAt).toISOString(),completedAt:o.completedAt?new Date(o.completedAt).toISOString():null,cycleDays:o.completedAt?daysBetween(o.createdAt,o.completedAt):null})),requests:state.requests.filter(r=>r.fromBranch===b||r.toBranch===b).map(r=>({id:r.id,coffin:r.coffinName,from:getBranch(r.fromBranch).name,to:getBranch(r.toBranch).name,status:r.status,urgency:r.urgency,reason:r.reason,createdAt:new Date(r.createdAt).toISOString()}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`workshop-${b}-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Exported');
}

// ═══════════════════════════════════════════════════════════════
function render(){
  // Update branch selector
  const bs=document.getElementById('branchSelect');
  if(bs){bs.innerHTML=state.branches.map(b=>`<option value="${b.id}" ${b.id===currentBranch?'selected':''}>${b.name}</option>`).join('')}
  // Update request badge
  const pendingReqs=state.requests.filter(r=>r.fromBranch===currentBranch&&r.status==='pending').length;
  const badge=document.getElementById('req-badge');
  if(badge){if(pendingReqs){badge.style.display='inline';badge.textContent=pendingReqs}else badge.style.display='none'}
  const v=document.querySelector('.tab.active')?.dataset.view||'dashboard';
  if(v==='dashboard')renderDashboard();else if(v==='orders')renderOrders();else if(v==='users')renderUsers();else if(v==='materials')renderMaterials();else if(v==='branches')renderBranches();else if(v==='analytics')renderAnalytics();
}

state=loadState()||getDefaultState();saveState();render();
setInterval(()=>{if(document.querySelector('.tab.active')?.dataset.view==='dashboard')render()},60000);
</script>
