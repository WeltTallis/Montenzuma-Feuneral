    index index.html index.htm;

 
    # API Gateway Proxy (Portal routes only) with path rewrite
  
    location /api/ {
        proxy_pass http://api_gateway;
        
        # Rewrite /api/* to /api/v1/restpoint/* (only if /v1/restpoint not already present)
        rewrite ^/api/(?!v1/restpoint/)(.*)$ /api/v1/restpoint/$1 break;

        # Required proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering
        proxy_buffering off;
        proxy_request_buffering off;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    # Socket.IO Proxy

    location /socket.io/ {
        proxy_pass http://socketio_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_buffering off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Scanner Bridge grants - POST /bridge/grant + /bridge/verify-grant
  
    location /bridge/ {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

  
    # Uploads Proxy - Serve uploaded files (signatures, 
    location /uploads/ {
        proxy_pass http://uploads_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache uploaded files
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin *;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Scanner Bridge app download — served directly
  
   
    location ^~ /downloads/ {
        autoindex off;
        types { }
        default_type application/zip;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }


    # Static Assets
  
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }


    # Portal SPA - All routes serve index.html
    # The React app will show Portal Login by default

    # SEO — robots.txt and sitemap.xml served directly from build output

    location = /robots.txt {
        alias /usr/share/nginx/html/robots.txt;
        add_header Content-Type text/plain;
        access_log off;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/html/sitemap.xml;
        add_header Content-Type application/xml;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Security Headers

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

 
    # Health Check
  
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }


    # Deny Access
 
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
}