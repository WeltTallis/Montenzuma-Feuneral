# Port map:
#   3306  mysql
#   6379  redis
#   8081  adminer
#   8080  backend (host process via `air`)
#   5173  frontend (vite dev server, host process)

name: payroll-backend
services:
  mysql:
    image: mysql:8.0
    container_name: payroll-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: payroll_db
      MYSQL_USER: payroll_user
      MYSQL_PASSWORD: payroll_pass
      PAYROLL_LOCAL_BOOTSTRAP: "1"
      TZ: Africa/Nairobi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-local-db.sh:/docker-entrypoint-initdb.d/00-init-local-db.sh:ro
      - ./migrations:/payroll-migrations:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --innodb-log-file-size=64M
      --max-connections=200
      --wait-timeout=600
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: payroll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
      interval: 5s

  # Optional: Database management interface
  adminer:
    image: adminer:latest
    container_name: payroll-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha

volumes:
  mysql_data:
    name: payroll_mysql_data
  redis_data:
    name: payroll_redis_data
