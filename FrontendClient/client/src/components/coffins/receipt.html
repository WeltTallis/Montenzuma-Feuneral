<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Coffin Reservation Receipt</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #e8e8e8;
            padding: 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* ---------- FORM (left) ---------- */
        .form-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .form-box h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .form-box label {
            font-size: 12px;
            color: #555;
            display: block;
            margin: 8px 0 3px;
        }

        .form-box input,
        .form-box select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-box button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #d63384;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-box button:hover {
            background: #c2185b;
        }

        /* ---------- RECEIPT (right) ---------- */
        .receipt {
            width: 80mm;
            background: #fff;
            padding: 5mm;
            color: #000;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
            height: fit-content;
        }

        .receipt .c {
            text-align: center;
        }

        .receipt .shop {
            font-size: 17px;
            font-weight: bold;
        }

        .receipt .rule {
            border-top: 1px dashed #000;
            margin: 6px 0;
        }

        .receipt table {
            width: 100%;
            border-collapse: collapse;
        }

        .receipt td {
            padding: 1.5px 0;
        }

        .receipt .r {
            text-align: right;
        }

        .receipt .b {
            font-weight: bold;
        }

        .receipt .big {
            font-size: 14px;
            font-weight: bold;
        }

        .receipt svg {
            display: block;
            margin: 4px auto;
        }

        /* ---------- PRINT: receipt only ---------- */
        @media print {
            body {
                background: #fff;
                padding: 0;
            }

            .form-box {
                display: none;
            }

            .receipt {
                box-shadow: none;
            }

            @page {
                size: 80mm auto;
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <!-- ================= FORM ================= -->
    <div class="form-box">
        <h3>🪦 Coffin Reservation</h3>

        <label>Customer Name</label><input id="customer" oninput="update()" placeholder="John Smith">
        <label>Phone</label><input id="phone" oninput="update()" placeholder="+000 111 222">
        <label>Deceased Name</label><input id="deceased" oninput="update()" placeholder="Mary Smith">
        <label>Coffin Model</label>
        <select id="model" onchange="update()">
            <option value="">-- select --</option>
            <option>Oak Premier</option>
            <option>Mahogany Royal</option>
            <option>Teak Classic</option>
            <option>Simple Pine</option>
            <option>Other</option>
        </select>
        <label>Coffin Color</label>
        <select id="color" onchange="update()">
            <option value="">-- select --</option>
            <option>Oak Brown</option>
            <option>Black Gloss</option>
            <option>White Pearl</option>
            <option>Gold Trim</option>
            <option>Other</option>
        </select>
        <label>Booked By (Staff)</label><input id="staff" oninput="update()" placeholder="Sarah">
        <label>Price</label><input id="price" type="number" oninput="update()" placeholder="0.00">
        <label>Amount Paid (Deposit / Full)</label><input id="paid" type="number" oninput="update()" placeholder="0.00">

        <button onclick="window.print()">🖨️ PRINT RECEIPT</button>
    </div>

    <!-- ================= RECEIPT ================= -->
    <div class="receipt" id="receipt">
        <div class="c">
            <div class="shop">PEACE FUNERAL HOME</div>
            <div>Plot 5, Rest Road, Your City</div>
            <div>Tel: +000 111 222</div>
        </div>
        <div class="rule"></div>
        <div class="c big">COFFIN RESERVATION</div>
        <div class="rule"></div>
        <table>
            <tr>
                <td>Receipt No</td>
                <td class="r" id="r_rcpt">RCP0001</td>
            </tr>
            <tr>
                <td>Date</td>
                <td class="r" id="r_date"></td>
            </tr>
        </table>
        <div class="rule"></div>
        <table>
            <tr>
                <td>Customer</td>
                <td class="r" id="r_customer">-</td>
            </tr>
            <tr>
                <td>Phone</td>
                <td class="r" id="r_phone">-</td>
            </tr>
            <tr>
                <td>Deceased</td>
                <td class="r" id="r_deceased">-</td>
            </tr>
            <tr>
                <td>Coffin Model</td>
                <td class="r" id="r_model">-</td>
            </tr>
            <tr>
                <td>Coffin Color</td>
                <td class="r" id="r_color">-</td>
            </tr>
            <tr>
                <td>Booked By</td>
                <td class="r" id="r_staff">-</td>
            </tr>
        </table>
        <div class="rule"></div>
        <table>
            <tr>
                <td class="b">Price</td>
                <td class="r b" id="r_price">0.00</td>
            </tr>
            <tr>
                <td>Paid</td>
                <td class="r" id="r_paid">0.00</td>
            </tr>
            <tr>
                <td class="b">BALANCE</td>
                <td class="r b" id="r_bal">0.00</td>
            </tr>
            <tr>
                <td colspan="2" class="c b" id="r_status"></td>
            </tr>
        </table>
        <div class="rule"></div>
        <svg id="barcode"></svg>
        <div class="c" id="r_code"></div>
        <div class="c">Thank you and God bless.</div>
    </div>

    <script>
        // receipt number auto-generates, e.g. RCP2506151430
        document.getElementById('r_rcpt').textContent = 'RCP' + new Date().toISOString().replace(/\D/g, '').slice(2, 14);
        document.getElementById('r_date').textContent = new Date().toLocaleString();

        function money(n) { return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

        function update() {
            const v = id => document.getElementById(id).value.trim() || '-';
            const price = +document.getElementById('price').value || 0;
            const paid = +document.getElementById('paid').value || 0;
            const bal = Math.max(price - paid, 0);

            document.getElementById('r_customer').textContent = v('customer');
            document.getElementById('r_phone').textContent = v('phone');
            document.getElementById('r_deceased').textContent = v('deceased');
            document.getElementById('r_model').textContent = v('model');
            document.getElementById('r_color').textContent = v('color');
            document.getElementById('r_staff').textContent = v('staff');
            document.getElementById('r_price').textContent = money(price);
            document.getElementById('r_paid').textContent = money(paid);
            document.getElementById('r_bal').textContent = money(bal);
            document.getElementById('r_status').textContent =
                (price > 0 && bal <= 0) ? '** FULLY PAID **' : (paid > 0 ? '** DEPOSIT RECEIVED **' : '');

            const code = document.getElementById('r_rcpt').textContent;
            document.getElementById('r_code').textContent = code;

            // BARCODE
            JsBarcode('#barcode', code, { format: 'CODE128', height: 55, width: 2, fontSize: 14, margin: 0 });
        }

        update();
    </script>
</body>

</html>
