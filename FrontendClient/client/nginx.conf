
# WebSocket upgrade header map — required for Socket.IO's WebSocket transport.
# "upgrade" is sent for WS requests, "close" for plain HTTP (polling) requests.
# This file is included in the http context by the docker nginx image, so the
# map must live at the top here (NOT inside server {}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # ============================================================
    # Socket.IO — proxy to the socketio-service container.
    # Defense-in-depth: the host nginx normally routes /socket.io/
    # straight to host port 5013, but when that location is missing
    # or stale (config drift, missed reload) requests fell through
    # to this SPA and every Socket.IO handshake received index.html
    # instead of the Engine.IO handshake — the "websocket error".
    # The frontend container sits on restpoint_network together with
    # restpoint_socketio_service, so it can proxy by container DNS
    # name and the SPA container is self-sufficient even if the host
    # nginx /socket.io/ block is ever lost again.
    # ============================================================
    location /socket.io/ {
        proxy_pass http://restpoint_socketio_service:5000;
        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket connections are long-lived
        proxy_connect_timeout 60s;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

