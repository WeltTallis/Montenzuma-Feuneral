            BOOKINGS.forEach(b => { if (counts[b.status] !== undefined) counts[b.status]++; });
            const total = BOOKINGS.length;
            const statusData = STORD.map(s => ({ key: s, label: ST[s].label, value: counts[s], color: ST[s].color }));

            // Pie chart via SVG arcs
            const radius = 38; const stroke = 14; const cx = 50; const cy = 50;
            const circumference = 2 * Math.PI * radius;
            let offset = 0;
            const segments = statusData.filter(d => d.value > 0).map(d => {
                const fraction = total > 0 ? d.value / total : 0;
                const length = fraction * circumference;
                const dash = `${length} ${circumference - length}`;
                const seg = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${d.color}" stroke-width="${stroke}" stroke-dasharray="${dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
                offset += length;
                return seg;
            }).join('');
            const pieHtml = total > 0 ? `
    <svg viewBox="0 0 100 100" style="width:100px;height:100px;">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${C.brdl}" stroke-width="${stroke}" />
      ${segments}
    </svg>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;font-weight:800;color:${C.ink};">${total}</div>
  ` : `<div style="width:100px;height:100px;display:flex;align-items:center;justify-content:center;color:${C.ink4};font-size:11px;">No data</div>`;

            const legendHtml = statusData.map(d => {
                const pct = total > 0 ? Math.round((d.value / total) * 100) : 0;
                return `
      <div class="cb-an-leg">
        <span class="cb-an-leg-dot" style="background:${d.color}"></span>
        <span class="cb-an-leg-label">${d.label}</span>
        <span class="cb-an-leg-val">${d.value}</span>
        <span class="cb-an-leg-pct">${pct}%</span>
      </div>
    `;
            }).join('');

            // Top coffin types (bar chart)
            const typeCounts = {};
            BOOKINGS.forEach(b => { const k = b.coffinType || 'Other'; typeCounts[k] = (typeCounts[k] || 0) + 1; });
            const byType = Object.keys(typeCounts).map(k => ({ name: k, value: typeCounts[k] })).sort((a, b) => b.value - a.value).slice(0, 5);
            const maxType = Math.max(...byType.map(t => t.value), 1);
            const barColors = ['#0f766e', '#0891b2', '#16a34a', '#475569', '#dc2626'];
            const barHtml = byType.length > 0 ? byType.map((t, i) => `
    <div class="cb-an-bar-row">
      <div class="cb-an-bar-label" title="${t.name}">${t.name.length > 14 ? t.name.slice(0, 14) + '…' : t.name}</div>
      <div class="cb-an-bar-track"><div class="cb-an-bar-fill" style="width:${(t.value / maxType) * 100}%;background:${barColors[i % barColors.length]}"></div></div>
      <div class="cb-an-bar-val">${t.value}</div>
    </div>
  `).join('') : `<div style="padding:16px 0;text-align:center;color:${C.ink4};font-size:11px;">No data yet</div>`;

            // Revenue
            const visibleMonthDate = new Date(viewYear, viewMonth, 1);
            const monthBookings = BOOKINGS.filter(b => isSameMonth(parseDate(b.date), visibleMonthDate));
            const revenue = monthBookings.filter(b => b.status === 'completed').reduce((s, b) => s + b.price, 0);
            const completedCount = monthBookings.filter(b => b.status === 'completed').length;

            document.getElementById('analytics').innerHTML = `
    <div class="cb-an-title">${IC.grid} Analytics</div>

    <div class="cb-an-card">
      <div class="cb-an-title" style="margin-bottom:8px;">Status Breakdown</div>
      ${total > 0 ? `
        <div class="cb-an-pie-wrap">
          <div class="cb-an-pie">${pieHtml}</div>
          <div class="cb-an-legend" style="flex:1;">${legendHtml}</div>
        </div>
      ` : `<div style="padding:16px 0;text-align:center;color:${C.ink4};font-size:11px;">No data yet</div>`}
    </div>

    <div class="cb-an-card">
      <div class="cb-an-title" style="margin-bottom:8px;">Top Coffin Types</div>
      ${barHtml}
    </div>

    <div class="cb-an-card">
      <div class="cb-an-title" style="margin-bottom:6px;">Monthly Revenue</div>
      <div class="cb-an-rev">${money(revenue)}</div>
      <div class="cb-an-rev-sub">From ${completedCount} completed booking${completedCount === 1 ? '' : 's'}</div>
    </div>
  `;
        }

        /* ============================================================
           MAIN AREA — calendar grid (day/week) or list table (month)
           ============================================================ */
        function getVisibleBookings() {
            let result = BOOKINGS.map(b => ({ ...b, dateObj: parseDate(b.date) })).filter(b => b.dateObj);
            if (view === 'full') {
                // Full calendar always shows the whole month — ignore clickedDay for filtering
                const vm = new Date(viewYear, viewMonth, 1);
                result = result.filter(b => isSameMonth(b.dateObj, vm));
            } else if (clickedDay) {
                result = result.filter(b => isSameDay(b.dateObj, clickedDay));
            } else {
                if (view === 'day') result = result.filter(b => isSameDay(b.dateObj, sel));
                else if (view === 'week') {
                    const ws = startOfWeek(sel, 1); const we = addDays(ws, 6);
                    result = result.filter(b => b.dateObj >= ws && b.dateObj <= we);
                } else {
                    const vm = new Date(viewYear, viewMonth, 1);
                    result = result.filter(b => isSameMonth(b.dateObj, vm));
                }
            }
            if (activeFilters.length > 0) result = result.filter(b => activeFilters.indexOf(b.status) !== -1);
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                result = result.filter(b => (b.clientName || '').toLowerCase().includes(q) || (b.deceasedName || '').toLowerCase().includes(q) || (b.coffinType || '').toLowerCase().includes(q) || (b.phone || '').includes(q));
            }
            result.sort((a, b) => a.dateObj.getTime() - b.dateObj.getTime());
            return result;
        }

        function renderMain() {
            const main = document.getElementById('mainArea');
            const visible = getVisibleBookings();

            // Clicked-day filter banner
            const dayBanner = (clickedDay && view !== 'full') ? `
    <div class="cb-df">
      <span>${IC.cal} Showing: ${fmtMDY(clickedDay)} — ${visible.length} booking${visible.length !== 1 ? 's' : ''}</span>
      <button onclick="clearClickedDay()">Clear ${IC.x}</button>
    </div>
  ` : '';

            let content;
            if (view === 'day' || view === 'week') {
                content = renderCalendarGrid(visible);
            } else if (view === 'full') {
                content = renderFullCalendar(visible);
            } else {
                content = renderMonthList(visible);
            }
            main.innerHTML = dayBanner + content;
        }

        function clearClickedDay() {
            clickedDay = null;
            renderMain();
        }

        /* ---------- Day/Week calendar grid ---------- */
        function renderCalendarGrid(visible) {
            const isWeek = view === 'week';
            const days = isWeek
                ? Array.from({ length: 7 }, (_, i) => addDays(startOfWeek(sel, 1), i))
                : [sel];
            const cols = days.length;

            // Build per-day model
            const buckets = new Map();
            days.forEach(d => buckets.set(fmtISO(d), { d, untimed: [], rows: new Map() }));
            visible.forEach(b => {
                const k = fmtISO(b.dateObj);
                if (!buckets.has(k)) return;
                const bucket = buckets.get(k);
                const h = parseHour(b.time);
                if (h === null) { bucket.untimed.push(b); return; }
                const row = Math.max(SH, Math.min(EH - 1, Math.floor(h)));
                if (!bucket.rows.has(row)) bucket.rows.set(row, []);
                bucket.rows.get(row).push(b);
            });

            const untimedAll = days.flatMap(d => buckets.get(fmtISO(d)).untimed);
            const total = visible.length;

            const headCols = days.map(d => {
                const cls = `cb-grid-day-head ${isToday(d) ? 'today' : ''} ${isSameDay(d, sel) ? 'sel' : ''} ${!isSameMonth(d, new Date(viewYear, viewMonth, 1)) ? 'other' : ''}`;
                return `
      <div class="${cls}" onclick="onGridDayClick(new Date(${d.getFullYear()},${d.getMonth()},${d.getDate()}))" title="Jump to ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}">
        <span class="dow">${DOW_SHORT[d.getDay()]}</span>
        <span class="dom">${d.getDate()}</span>
      </div>
    `;
            }).join('');

            const colsStyle = `--cols:${cols}`;

            let body;
            if (total === 0) {
                body = `<div class="cb-grid-empty">No coffin reservations for ${isWeek ? 'this week' : fmtMDY(sel)}.</div>`;
            } else {
                let rows = '';
                if (untimedAll.length > 0) {
                    rows += `<div class="cb-time-cell" style="height:auto;padding:9px 7px 0 0;"></div>`;
                    rows += `<div class="cb-untimed-wrap"><span class="cb-untimed-label">No time</span>${untimedAll.map(renderChip).join('')}</div>`;
                }
                HOURS.forEach(h => {
                    rows += `<div class="cb-time-cell">${fmtHour(h)}</div>`;
                    days.forEach(d => {
                        const bucket = buckets.get(fmtISO(d));
                        const hits = bucket.rows.get(h) || [];
                        rows += `<div class="cb-day-cell">${hits.map(renderChip).join('')}</div>`;
                    });
                });
                body = rows;
            }

            return `
    <div class="cb-grid-frame">
      <div class="cb-grid-head" style="${colsStyle}">
        <div class="cb-grid-head-corner">${isWeek ? '' : 'Time'}</div>
        ${headCols}
      </div>
      <div class="cb-grid-body" style="${colsStyle}">${body}</div>
    </div>
  `;
        }

        function renderChip(b) {
            const st = getStatusStyle(b);
            return `
    <button class="cb-chip" style="--chip-c:${st.color}" onclick="openDetailPanel('${b.id}')" title="${b.clientName} · ${st.label}">
      ${b.time ? `<span class="t">${fmtTime12(b.time)}</span>` : ''}
      <span class="n">${b.clientName}</span>
      <span class="m">${b.coffinType}</span>
    </button>
  `;
        }

        function onGridDayClick(d) {
            sel = new Date(d); clickedDay = null;
            if (!isSameMonth(d, new Date(viewYear, viewMonth, 1))) goToMonth(d.getMonth(), d.getFullYear());
            renderMain();
        }

        /* ---------- Full month calendar grid ---------- */
        function renderFullCalendar(visible) {
            const monthDate = new Date(viewYear, viewMonth, 1);
            const start = startOfWeekSurrounding(monthDate, 1);
            const end = endOfWeekSurrounding(monthDate, 1);
            const days = eachDayOfInterval(start, end);

            // Group bookings by date
            const byDate = new Map();
            visible.forEach(b => {
                const k = fmtISO(b.dateObj);
                if (!byDate.has(k)) byDate.set(k, []);
                byDate.get(k).push(b);
            });

            const dowHeaders = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const headHtml = dowHeaders.map(d => `<div class="fc-head-cell">${d}</div>`).join('');

            const daysHtml = days.map(d => {
                const k = fmtISO(d);
                const dayBookings = (byDate.get(k) || []).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
                const isTd = isToday(d);
                const isOther = !isSameMonth(d, monthDate);
                const isSel = clickedDay && isSameDay(d, clickedDay);
                let cls = 'fc-day';
                if (isTd) cls += ' today';
                if (isOther) cls += ' other';
                if (isSel) cls += ' selected';

                const chipsHtml = dayBookings.slice(0, 4).map(b => {
                    const st = getStatusStyle(b);
                    const timeStr = b.time ? fmtTime12(b.time).replace(/:00 /, ' ') : '';
                    return `<button class="fc-chip" style="--chip-c:${st.color}" onclick="event.stopPropagation(); openDetailPanel('${b.id}')" title="${b.clientName} · ${st.label}${b.time ? ' · ' + fmtTime12(b.time) : ''}">${timeStr ? timeStr + ' ' : ''}${b.clientName}</button>`;
                }).join('');
                const moreHtml = dayBookings.length > 4 ? `<div class="fc-more">+${dayBookings.length - 4} more</div>` : '';

                return `<div class="${cls}" onclick="onFullCalDayClick(new Date(${d.getFullYear()},${d.getMonth()},${d.getDate()}))"><div class="fc-day-num">${d.getDate()}</div><div class="fc-day-chips">${chipsHtml}${moreHtml}</div></div>`;
            }).join('');

            return `
    <div class="fc-frame">
      <div class="fc-head">${headHtml}</div>
      <div class="fc-grid">${daysHtml}</div>
    </div>
  `;
        }

        function onFullCalDayClick(d) {
            if (clickedDay && isSameDay(d, clickedDay)) { clickedDay = null; }
            else {
                if (!isSameMonth(d, new Date(viewYear, viewMonth, 1))) goToMonth(d.getMonth(), d.getFullYear());
                clickedDay = new Date(d);
                sel = new Date(d);
            }
            renderMain();
        }

        /* ---------- Month list table ---------- */
        function renderMonthList(visible) {
            if (visible.length === 0) {
                return `
      <div class="cb-empty">
        <div class="cb-empty-ico">${IC.cal}</div>
        <span style="font-size:12px;">${clickedDay ? 'No bookings for ' + fmtMDY(clickedDay) : 'No bookings for this period'}</span>
      </div>
    `;
            }
            const rows = visible.map(b => {
                const st = getStatusStyle(b);
                const isActive = panelBk && panelBk.id === b.id;
                return `
      <div class="cb-r ${isActive ? 'active' : ''}" onclick="openDetailPanel('${b.id}')">
        <div class="cb-bar" style="background:${st.color}"></div>
        <div class="cb-cell">
          <div class="cb-nm">${b.clientName}</div>
          ${b.deceasedName ? `<div class="cb-sub">${IC.us}${b.deceasedName}</div>` : ''}
        </div>
        <div class="cb-cell">
          <div class="cb-cn">${b.coffinType}</div>
          <div class="cb-sub">${IC.ph}${b.phone || '—'}</div>
        </div>
        <div class="cb-cell">
          <div class="cb-mt">${fmtMD(b.dateObj)}</div>
          <div class="cb-sub">${IC.clock}${b.time ? fmtTime12(b.time) : '—'}</div>
        </div>
        <div class="cb-cell">
          <span class="cb-status-chip" style="background:${st.bg};">
            <span class="dot" style="background:${st.color}"></span>
            <span class="lbl" style="color:${st.color}">${st.label}</span>
          </span>
        </div>
        <div class="cb-cell" style="text-align:right;">
          <div class="cb-pr">${money(b.price)}</div>
          <div class="cb-paid" style="color:${(b.paidAmount || 0) >= b.price ? C.suc : (b.paidAmount || 0) > 0 ? '#d97706' : C.dng}">
            <span class="cb-paid-dot" style="background:${(b.paidAmount || 0) >= b.price ? C.suc : (b.paidAmount || 0) > 0 ? '#d97706' : C.dng}"></span>
            ${money(b.paidAmount || 0)} / ${money(b.price)}
          </div>
        </div>
      </div>
    `;
            }).join('');

            return `
    <div class="cb-lh">
      <div></div>
      <div>Client</div>
      <div>Coffin</div>
      <div>Schedule</div>
      <div>Status</div>
      <div>Amount</div>
    </div>
    <div style="flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;">${rows}</div>
  `;
        }

        /* ============================================================
           DETAIL PANEL (slide-in from right)
           ============================================================ */
        function openDetailPanel(bookingId) {
            const b = BOOKINGS.find(x => x.id === bookingId);
            if (!b) return;
            panelBk = b;
            const st = getStatusStyle(b);
            const dateObj = parseDate(b.date);

            const host = document.getElementById('detailPanelHost');
            host.innerHTML = `
    <div class="cb-ov" onclick="closeDetailPanel()"></div>
    <div class="cb-panel">
      <div class="cb-ph">
        <div class="cb-ph-status" style="color:${st.color};background:${st.bg};">
          <span class="cb-ph-pulse" style="background:${st.color}"></span>
          ${st.label}
        </div>
        <button class="cb-ph-close" onclick="closeDetailPanel()">${IC.x}</button>
      </div>
      <div class="cb-pb">
        <div class="cb-pb-client">${b.clientName}</div>
        <div class="cb-pb-code">${IC.dl} Booking #${b.id}</div>
        <div class="cb-pb-sec">
          <div class="cb-pb-sec-t">Details</div>
          <div class="cb-pb-grid">
            <div class="cb-pb-card"><div class="cb-pb-card-l">Phone</div><div class="cb-pb-card-v">${b.phone || '—'}</div></div>
            <div class="cb-pb-card"><div class="cb-pb-card-l">Status</div><div class="cb-pb-card-v" style="color:${st.color};font-weight:700;">${st.label}</div></div>
            <div class="cb-pb-card"><div class="cb-pb-card-l">Coffin</div><div class="cb-pb-card-v" style="font-size:12px;">${b.coffinType} · ${b.color}</div></div>
            <div class="cb-pb-card"><div class="cb-pb-card-l">Schedule</div><div class="cb-pb-card-v" style="font-size:12px;">${fmtMDY(dateObj)} ${b.time ? '· ' + fmtTime12(b.time) : ''}</div></div>
            <div class="cb-pb-card"><div class="cb-pb-card-l">Amount Due</div><div class="cb-pb-card-v hl">${money(b.price)}</div></div>
            <div class="cb-pb-card"><div class="cb-pb-card-l">Amount Paid</div><div class="cb-pb-card-v" style="color:${(b.paidAmount || 0) >= b.price ? C.suc : (b.paidAmount || 0) > 0 ? '#d97706' : C.dng};font-weight:700;">${money(b.paidAmount || 0)}</div></div>
            <div class="cb-pb-card wide"><div class="cb-pb-card-l">Balance Remaining</div><div class="cb-pb-card-v" style="color:${(b.price - (b.paidAmount || 0)) > 0 ? C.dng : C.suc};font-weight:700;">${money(b.price - (b.paidAmount || 0))}</div></div>
            ${b.deceasedName ? `<div class="cb-pb-card wide"><div class="cb-pb-card-l">Deceased</div><div class="cb-pb-card-v">${b.deceasedName}</div></div>` : ''}
            ${b.notes ? `<div class="cb-pb-card wide"><div class="cb-pb-card-l">Notes</div><div class="cb-pb-card-v" style="font-size:12px;color:${C.ink2};">${b.notes}</div></div>` : ''}
          </div>
        </div>
      </div>
      <div class="cb-pf">
        ${(b.paidAmount || 0) < b.price ? `
          <button class="cb-pbtn primary" onclick="markAsPaid('${b.id}')">${IC.ck} Mark Fully Paid</button>
        ` : `
          <button class="cb-pbtn paid" disabled>${IC.ck} Payment Received</button>
        `}
        <button class="cb-pbtn ghost" onclick="closeDetailPanel()">Close</button>
      </div>
    </div>
  `;

            // Re-render main to update active row
            renderMain();
        }

        function closeDetailPanel() {
            panelBk = null;
            document.getElementById('detailPanelHost').innerHTML = '';
            renderMain();
        }

        function markAsPaid(bookingId) {
            const b = BOOKINGS.find(x => x.id === bookingId);
            if (!b) return;
            b.paid = true;
            b.paidAmount = b.price;
            showToast('Marked as fully paid');
            openDetailPanel(bookingId); // refresh panel
            renderStatStrip(); renderMain();
        }

        /* ============================================================
           NAVIGATION
           ============================================================ */
        function navigate(dir) {
            clickedDay = null;
            if (view === 'day') {
                sel = addDays(sel, dir);
                goToMonth(sel.getMonth(), sel.getFullYear());
            } else if (view === 'week') {
                sel = dir === 1 ? addWeeks(sel, 1) : addWeeks(sel, -1);
                goToMonth(sel.getMonth(), sel.getFullYear());
            } else {
                // month + full both page the visible month
                goToMonth(viewMonth + dir, viewYear);
            }
        }

        function goToMonth(month, year) {
            let m = Math.trunc(Number(month));
            let y = Math.trunc(Number(year));
            if (!isFinite(m) || !isFinite(y)) return;
            y += Math.floor(m / 12);
            m = ((m % 12) + 12) % 12;
            y = Math.min(2200, Math.max(1970, y));
            viewMonth = m; viewYear = y;
            calMonth = new Date(y, m, 1);
            renderStatStrip(); renderFilters(); renderMain();
        }

        function goToday() {
            sel = new Date(TODAY); clickedDay = null;
            goToMonth(TODAY.getMonth(), TODAY.getFullYear());
        }

        /* ============================================================
           VIEW SWITCHER
           ============================================================ */
        function setView(v) {
            view = v; clickedDay = null;
            document.querySelectorAll('#viewTabs .cb-tb-v').forEach(t => t.classList.toggle('on', t.dataset.view === v));
            renderMain();
        }

        /* ============================================================
           NEW BOOKING MODAL
           ============================================================ */
        function openNewBookingModal() {
            const typeSelect = document.getElementById('bkType');
            typeSelect.innerHTML = Object.keys(COFFIN_CATALOG).map(t => `<option value="${t}">${t}</option>`).join('');
            updateBookingColorOptions();
            document.getElementById('bkClient').value = '';
            document.getElementById('bkDeceased').value = '';
            document.getElementById('bkContact').value = '';
            document.getElementById('bkNotes').value = '';
            document.getElementById('bkDate').value = fmtISO(sel);
            document.getElementById('bkTime').value = '10:00';
            document.getElementById('bkStatus').value = 'pending';
            document.getElementById('bkPrice').value = '45000';
            updateAvailability();
            document.getElementById('newBookingModal').classList.add('open');
        }

        function closeNewBookingModal() {
            document.getElementById('newBookingModal').classList.remove('open');
        }

        function updateBookingColorOptions() {
            const type = document.getElementById('bkType').value;
            const cat = COFFIN_CATALOG[type] || { colors: [] };
            document.getElementById('bkColor').innerHTML = cat.colors.map(c => `<option value="${c}">${c}</option>`).join('');
            updateAvailability();
        }

        function updateAvailability() {
            const type = document.getElementById('bkType').value;
            const color = document.getElementById('bkColor').value;
            const el = document.getElementById('availability');
            if (!type || !color) return;
            const stock = getInventoryFor(type, color);
            if (!stock) {
                el.innerHTML = `<span style="color:${C.dng};font-weight:700;">⚠ Variant not in inventory catalog</span>`;
                return;
            }
            const booked = getBookedCount(type, color);
            const available = Math.max(0, stock.qty - booked);
            if (available === 0) {
                el.innerHTML = `<span style="color:${C.dng};font-weight:700;">⚠ Fully booked — no availability for ${type} · ${color}</span>`;
            } else if (available <= 2) {
                el.innerHTML = `<span style="color:#b07d00;font-weight:700;">Only ${available} available (${booked} of ${stock.qty} booked)</span>`;
            } else {
                el.innerHTML = `<span style="color:${C.suc};font-weight:600;">✓ ${available} available · ${booked} booked · ${stock.qty} total stock</span>`;
            }
        }

        function submitNewBooking() {
            const client = document.getElementById('bkClient').value.trim();
            const deceased = document.getElementById('bkDeceased').value.trim();
            const contact = document.getElementById('bkContact').value.trim();
            const type = document.getElementById('bkType').value;
            const color = document.getElementById('bkColor').value;
            const date = document.getElementById('bkDate').value;
            const time = document.getElementById('bkTime').value;
            const status = document.getElementById('bkStatus').value;
            const price = parseInt(document.getElementById('bkPrice').value, 10) || 0;
            const notes = document.getElementById('bkNotes').value.trim();

            if (!client) { showToast('Client name is required', 'error'); return; }
            if (!date) { showToast('Date is required', 'error'); return; }

            // Check availability
            const stock = getInventoryFor(type, color);
            if (stock) {
                const booked = getBookedCount(type, color);
                const available = Math.max(0, stock.qty - booked);
                if (available === 0) {
                    showToast(`Cannot book — ${type} · ${color} is fully booked`, 'error');
                    return;
                }
            }

            const newId = 'BK-2024-' + String(BOOKINGS.length + 1).padStart(3, '0');
            BOOKINGS.push({ id: newId, clientName: client, deceasedName: deceased, phone: contact, coffinType: type, color, date, time, status, price, paid: false, notes });
            showToast(`Booking ${newId} created for ${client}`);
            closeNewBookingModal();
            renderStatStrip(); renderFilters(); renderMain();
        }

        /* ============================================================
           TOAST
           ============================================================ */
        let toastTimer = null;
        function showToast(msg, type = 'success') {
            const host = document.getElementById('toastHost');
            host.innerHTML = `<div class="cb-te">${IC.ck}<span>${msg}</span></div>`;
            const el = host.querySelector('.cb-te');
            if (type === 'error') {
                el.querySelector('svg').style.color = C.dng;
            }
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.add('out');
                setTimeout(() => { host.innerHTML = ''; }, 200);
            }, 2600);
        }

        /* ============================================================
           EVENT BINDINGS
           ============================================================ */
        document.getElementById('prevBtn').addEventListener('click', () => navigate(-1));
        document.getElementById('nextBtn').addEventListener('click', () => navigate(1));
        document.getElementById('todayBtn').addEventListener('click', goToday);
        document.querySelectorAll('#viewTabs .cb-tb-v').forEach(t => {
            t.addEventListener('click', () => setView(t.dataset.view));
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (panelBk) closeDetailPanel();
                else closeNewBookingModal();
            }
        });

        /* ============================================================
           LEGEND — status color guide
           ============================================================ */
        function renderLegend() {
            // Show only statuses that are actually used in BOOKINGS
            const usedStatuses = [...new Set(BOOKINGS.map(b => b.status))];
            const items = usedStatuses.map(s => ST[s]).filter(Boolean);
            const el = document.getElementById('statusLegend');
            if (!el) return;
            el.innerHTML = items.map((st, i) => `
    ${i > 0 ? '<div class="pay-legend-divider"></div>' : ''}
    <div class="pay-legend-item">
      <span class="pay-legend-dot" style="background:${st.bg};border:1px solid ${st.color}"></span>
      <span style="color:${st.color}">${st.label}</span>
    </div>
  `).join('');
        }

        /* ============================================================
           INIT
           ============================================================ */
        renderStatStrip();
        renderFilters();
        renderLegend();
        renderMain();
    </script>
</body>

</html>
