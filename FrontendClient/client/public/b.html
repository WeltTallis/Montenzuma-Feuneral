<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>CoffinBook — Reservation Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f9fafb;
            color: #111827;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- Tokens (mirror your React C/ST) ---------- */
        :root {
            --ink: #111827;
            --ink2: #374151;
            --ink3: #6b7280;
            --ink4: #9ca3af;
            --bg: #f9fafb;
            --card: #ffffff;
            --brd: #e5e7eb;
            --brdl: #f3f4f6;
            --acc: #0f766e;
            --accl: #14b8a6;
            --acclt: #f0fdfa;
            --suc: #16a34a;
            --sucl: #f0fdf4;
            --dng: #dc2626;
            --dngl: #fef2f2;
            --shs: 0 1px 2px rgba(0, 0, 0, .04);
            --shl: 0 10px 15px rgba(0, 0, 0, .08);
            --shxl: 0 20px 25px rgba(0, 0, 0, .1);
        }

        @keyframes cbPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .3;
                transform: scale(.7);
            }
        }

        @keyframes cbTransferPulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 1px rgba(220, 38, 38, .15);
            }

            50% {
                opacity: .45;
                transform: scale(.68);
                box-shadow: 0 0 0 4px rgba(220, 38, 38, .18);
            }
        }

        @keyframes cbTIn {
            from {
                transform: translateY(12px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes cbTOut {
            to {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        @keyframes cbPanelIn {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(0);
            }
        }

        @keyframes cbOvIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes cellIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- Top brand bar (separate from app toolbar) ---------- */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--brd);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-mark {
            width: 34px;
            height: 34px;
            background: var(--acc);
            color: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .topbar-title {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .topbar-title .sub {
            display: block;
            font-size: 10.5px;
            color: var(--ink4);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 1px;
        }

        .topbar-link {
            color: var(--ink3);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 7px;
            transition: all .12s;
            border: 1px solid var(--brd);
        }

        .topbar-link:hover {
            border-color: var(--acc);
            color: var(--acc);
            background: var(--acclt);
        }

        .btn-primary {
            background: var(--acc);
            color: #fff;
            border: none;
            border-radius: 7px;
            padding: 8px 14px;
            font-weight: 700;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background .15s;
            box-shadow: 0 2px 8px rgba(15, 118, 110, .25);
        }

        .btn-primary:hover {
            background: var(--accl);
        }

        .btn-primary svg {
            width: 13px;
            height: 13px;
        }

        /* ---------- App frame ---------- */
        .app {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 58px);
            overflow: hidden;
        }

        /* ---------- Toolbar ---------- */
        .cb-tb {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 24px;
            border-bottom: 1px solid var(--brd);
            background: var(--card);
            flex-shrink: 0;
            gap: 12px;
            min-height: 52px;
        }

        .cb-tb-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .cb-tb-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cb-divider {
            width: 1px;
            height: 24px;
            background: var(--brd);
            margin: 0 4px;
        }

        .cb-search {
            flex: 0 1 240px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border: 1px solid var(--brd);
            border-radius: 7px;
            padding: 0 14px;
            height: 30px;
        }

        .cb-search svg {
            width: 12px;
            height: 12px;
            color: var(--ink4);
            flex-shrink: 0;
        }

        .cb-search input {
            border: none;
            background: transparent;
            outline: none;
            flex: 1;
            font-size: 12px;
            color: var(--ink);
            font-family: inherit;
        }

        .cb-search input::placeholder {
            color: var(--ink4);
        }

        .cb-filter-chips {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: nowrap;
            overflow-x: auto;
        }

        .cb-filter-chips::-webkit-scrollbar {
            display: none;
        }

        .cb-fc {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all .12s;
            border: 1.5px solid var(--brd);
            background: var(--card);
            color: var(--ink3);
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .cb-fc:hover {
            border-color: var(--ink4);
            color: var(--ink2);
        }

        .cb-fc.on {
            border-color: var(--acc);
            background: var(--card);
            color: var(--acc);
        }

        .cb-fc-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cb-fc-ct {
            font-weight: 700;
            font-size: 9px;
            opacity: 0.6;
        }

        .cb-tb-btn {
            height: 30px;
            padding: 0 12px;
            border: 1px solid var(--brd);
            background: var(--card);
            color: var(--ink2);
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            transition: all .12s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .cb-tb-btn:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        .cb-tb-btn.sq {
            width: 30px;
            padding: 0;
            justify-content: center;
        }

        .cb-tb-views {
            display: flex;
            background: var(--bg);
            border: 1px solid var(--brd);
            border-radius: 7px;
            padding: 2px;
            gap: 1px;
        }

        .cb-tb-v {
            padding: 4px 12px;
            border: none;
            background: transparent;
            color: var(--ink3);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 5px;
            transition: all .15s;
            text-transform: capitalize;
        }

        .cb-tb-v:hover {
            color: var(--ink);
        }

        .cb-tb-v.on {
            background: var(--card);
            color: var(--ink);
            box-shadow: var(--shs);
            font-weight: 700;
        }

        /* ---------- Stat strip ---------- */
        .cb-sr {
            display: flex;
            align-items: stretch;
            flex-shrink: 0;
            overflow-x: auto;
            border-bottom: 1px solid var(--brd);
        }

        .cb-sr::-webkit-scrollbar {
            display: none;
        }

        .cb-sr-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 22px;
            white-space: nowrap;
            flex-shrink: 0;
            flex: 1;
            min-width: 0;
        }

        .cb-sr-ico {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cb-sr-ico svg {
            width: 15px;
            height: 15px;
        }

        .cb-sr-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .cb-sr-num {
            font-size: 20px;
            font-weight: 800;
            line-height: 1;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .cb-sr-label {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, .75);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
        }

        /* ---------- Main split ---------- */
        .cb-split {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .cb-side {
            width: 300px;
            background: var(--card);
            border-right: 1px solid var(--brd);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            min-height: 0;
            overflow-y: hidden;
        }

        .cb-side-scroll {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Mini calendar ---------- */
        .cb-mc {
            padding: 14px 20px 12px;
            border-bottom: 1px solid var(--brdl);
        }

        .cb-mc-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .cb-mc-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
        }

        .cb-mc-nav {
            display: flex;
            gap: 2px;
        }

        .cb-mc-nav button {
            width: 26px;
            height: 26px;
            border: 1px solid var(--brd);
            background: var(--card);
            color: var(--ink3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .12s;
        }

        .cb-mc-nav button:hover {
            border-color: var(--acc);
            color: var(--acc);
        }

        .cb-mc-nav button svg {
            width: 11px;
            height: 11px;
        }

        .cb-mc-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            text-align: center;
        }

        .cb-mc-dow {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 0;
        }

        .cb-mc-day {
            font-size: 11px;
            font-weight: 500;
            color: var(--ink2);
            width: 32px;
            height: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border-radius: 50%;
            cursor: pointer;
            transition: all .12s;
            position: relative;
        }

        .cb-mc-day:hover {
            background: var(--bg);
        }

        .cb-mc-day.other {
            opacity: 0.15;
            pointer-events: none;
        }

        .cb-mc-day.today {
            font-weight: 800;
            color: var(--acc);
            background: var(--acclt);
        }

        .cb-mc-day.selected {
            background: var(--acc);
            color: #fff;
            font-weight: 700;
        }

        .cb-cal-dots {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.5px;
        }

        .cb-cal-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ---------- Status filters ---------- */
        .cb-filters {
            padding: 10px 20px;
            border-bottom: 1px solid var(--brdl);
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .cb-fc {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all .12s;
            border: 1.5px solid var(--brd);
            background: var(--card);
            color: var(--ink3);
            user-select: none;
        }

        .cb-fc:hover {
            border-color: var(--ink4);
            color: var(--ink2);
        }

        .cb-fc.on {
            border-color: var(--acc);
            background: var(--card);
            color: var(--acc);
        }

        .cb-fc-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cb-fc-ct {
            font-weight: 700;
            font-size: 9px;
            opacity: 0.6;
        }

        /* ---------- Analytics ---------- */
        .cb-analytics {
            flex: 1;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .cb-an-title {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cb-an-title svg {
            width: 11px;
            height: 11px;
        }

        .cb-an-card {
            background: var(--card);
            border: 1px solid var(--brd);
            border-radius: 12px;
            padding: 14px;
        }

        .cb-an-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cb-an-leg {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cb-an-leg-dot {
            width: 8px;
            height: 8px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .cb-an-leg-label {
            font-size: 11px;
            color: var(--ink2);
            flex: 1;
        }

        .cb-an-leg-val {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }

        .cb-an-leg-pct {
            font-size: 9px;
            color: var(--ink4);
            width: 32px;
            text-align: right;
        }

        .cb-an-pie-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cb-an-pie {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            position: relative;
        }

        .cb-an-pie-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: 800;
            color: var(--ink);
        }

        .cb-an-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .cb-an-bar-label {
            font-size: 10px;
            color: var(--ink2);
            width: 90px;
            flex-shrink: 0;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cb-an-bar-track {
            flex: 1;
            height: 16px;
            background: var(--brdl);
            border-radius: 4px;
            overflow: hidden;
        }

        .cb-an-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width .4s;
        }

        .cb-an-bar-val {
            font-size: 10px;
            font-weight: 700;
            color: var(--ink);
            min-width: 18px;
            text-align: right;
        }

        .cb-an-rev {
            font-size: 22px;
            font-weight: 800;
            color: var(--ink);
            letter-spacing: -0.5px;
        }

        .cb-an-rev-sub {
            font-size: 10px;
            color: var(--ink4);
            font-weight: 500;
            margin-top: 2px;
        }

        /* ---------- Main list ---------- */
        .cb-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            background: var(--card);
            position: relative;
            overflow: hidden;
        }

        .cb-df {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 24px;
            background: var(--acclt);
            border-bottom: 1px solid var(--brd);
        }

        .cb-df span {
            font-size: 11px;
            color: var(--acc);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cb-df button {
            background: none;
            border: none;
            color: var(--ink3);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            transition: all .12s;
            font-family: inherit;
        }

        .cb-df button:hover {
            color: var(--dng);
        }

        .cb-df button svg {
            width: 9px;
            height: 9px;
        }

        /* Month list table */
        .cb-lh {
            flex-shrink: 0;
            display: grid;
            grid-template-columns: 3px 1.2fr 0.9fr 0.85fr 0.75fr 0.8fr;
            align-items: center;
            padding: 9px 20px 9px 0;
            border-bottom: 1px solid var(--brd);
            background: var(--bg);
        }

        .cb-lh>div {
            padding-left: 10px;
            font-size: 9px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .cb-lh>div:last-child {
            text-align: right;
        }

        .cb-r {
            display: grid;
            grid-template-columns: 3px 1.2fr 0.9fr 0.85fr 0.75fr 0.8fr;
            align-items: center;
            gap: 0;
            padding: 13px 20px 13px 0;
            cursor: pointer;
            transition: all .1s;
            border-bottom: 1px solid var(--brdl);
            min-height: 56px;
            animation: cellIn .15s ease both;
        }

        .cb-r:hover {
            background: var(--bg);
        }

        .cb-r.active {
            box-shadow: inset 3px 0 0 var(--acc);
        }

        .cb-bar {
            width: 3px;
            min-height: 22px;
            border-radius: 2px;
            align-self: stretch;
        }

        .cb-cell {
            padding: 0 10px;
            overflow: hidden;
            min-width: 0;
        }

        .cb-nm {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cb-sub {
            font-size: 10px;
            color: var(--ink4);
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .cb-sub svg {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
        }

        .cb-cn {
            font-size: 12px;
            color: var(--ink2);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cb-mt {
            font-size: 12px;
            color: var(--ink2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cb-pr {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            text-align: right;
            white-space: nowrap;
        }

        .cb-paid {
            font-size: 9px;
            font-weight: 600;
            margin-top: 2px;
            text-align: right;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .cb-paid-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cb-status-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .cb-status-chip .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cb-status-chip .lbl {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* ---------- Calendar grid (day/week) ---------- */
        .cb-grid-frame {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--card);
        }

        .cb-grid-head {
            display: grid;
            align-items: center;
            border-bottom: 1px solid var(--brd);
            padding: 10px 14px;
            gap: 6px;
            grid-template-columns: 58px repeat(var(--cols, 1), minmax(0, 1fr));
        }

        .cb-grid-head-corner {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--ink4);
        }

        .cb-grid-day-head {
            border: 1px solid var(--brd);
            background: var(--card);
            border-radius: 8px;
            padding: 6px 4px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            transition: all .12s;
        }

        .cb-grid-day-head:hover {
            border-color: var(--acc);
        }

        .cb-grid-day-head .dow {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--ink4);
        }

        .cb-grid-day-head .dom {
            font-size: 15px;
            font-weight: 800;
            color: var(--ink2);
            line-height: 1.1;
        }

        .cb-grid-day-head.today {
            border-color: var(--acc);
            background: var(--acclt);
        }

        .cb-grid-day-head.today .dom {
            color: var(--acc);
        }

        .cb-grid-day-head.other .dom {
            color: var(--ink4);
            opacity: 0.55;
        }

        .cb-grid-day-head.sel {
            border-color: var(--acc);
            box-shadow: 0 0 0 2px var(--acclt);
        }

        .cb-grid-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: grid;
            grid-template-columns: 58px repeat(var(--cols, 1), minmax(0, 1fr));
        }

        .cb-time-cell {
            border-right: 1px solid var(--brd);
            border-bottom: 1px solid var(--brdl);
            background: var(--bg);
            font-size: 10px;
            font-weight: 600;
            color: var(--ink4);
            text-align: right;
            padding: 3px 7px 0 0;
            height: 52px;
        }

        .cb-day-cell {
            border-right: 1px solid var(--brdl);
            border-bottom: 1px solid var(--brdl);
            height: 52px;
            position: relative;
            padding: 2px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .cb-chip {
            border: none;
            background: var(--chip-c, var(--acc));
            color: #fff;
            border-radius: 7px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 12px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            transition: transform .12s, box-shadow .12s;
            min-height: 40px;
        }

        .cb-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        }

        .cb-chip .t {
            font-size: 10px;
            font-weight: 700;
            opacity: 0.8;
        }

        .cb-chip .n {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cb-chip .m {
            font-size: 10px;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cb-untimed-wrap {
            grid-column: 2 / -1;
            border-bottom: 1px solid var(--brd);
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--bg);
        }

        .cb-untimed-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            color: var(--ink4);
            align-self: center;
            margin-right: 2px;
        }

        .cb-grid-empty {
            grid-column: 2 / -1;
            padding: 40px 16px;
            text-align: center;
            color: var(--ink4);
            font-size: 12px;
            font-weight: 600;
        }

        /* ---------- Detail panel ---------- */
        .cb-ov {
            position: fixed;
            inset: 0;
            background: rgba(17, 24, 39, .4);
            z-index: 100;
            backdrop-filter: blur(4px);
            animation: cbOvIn .15s ease;
        }

        .cb-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 101;
            width: 480px;
            max-width: 92vw;
            background: var(--card);
            border-left: 1px solid var(--brd);
            box-shadow: var(--shxl);
            display: flex;
            flex-direction: column;
            animation: cbPanelIn .25s cubic-bezier(.32, .72, 0, 1);
            overflow: hidden;
        }

        .cb-ph {
            padding: 20px 24px;
            border-bottom: 1px solid var(--brd);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .cb-ph-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .cb-ph-pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: cbPulse 2s ease-in-out infinite;
        }

        .cb-ph-close {
            width: 32px;
            height: 32px;
            border: 1px solid var(--brd);
            background: var(--card);
            color: var(--ink3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .12s;
        }

        .cb-ph-close:hover {
            border-color: var(--dng);
            color: var(--dng);
            background: var(--dngl);
        }

        .cb-pb {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .cb-pb-client {
            font-size: 20px;
            font-weight: 800;
            color: var(--ink);
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .cb-pb-code {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink3);
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .cb-pb-sec {
            margin-bottom: 24px;
        }

        .cb-pb-sec-t {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--brdl);
        }

        .cb-pb-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .cb-pb-card {
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--brdl);
            border-radius: 10px;
        }

        .cb-pb-card.wide {
            grid-column: 1 / -1;
        }

        .cb-pb-card-l {
            font-size: 9px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }

        .cb-pb-card-v {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
        }

        .cb-pb-card-v.hl {
            font-size: 18px;
            font-weight: 800;
        }

        .cb-pf {
            padding: 14px 24px;
            border-top: 1px solid var(--brd);
            background: var(--bg);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .cb-pbtn {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all .12s;
            text-align: center;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
        }

        .cb-pbtn.primary {
            background: var(--acc);
            color: #fff;
        }

        .cb-pbtn.primary:hover {
            background: var(--accl);
        }

        .cb-pbtn.paid {
            background: var(--suc);
            color: #fff;
        }

        .cb-pbtn.paid:disabled {
            background: var(--ink4);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .cb-pbtn.ghost {
            background: var(--card);
            color: var(--ink3);
            border: 1px solid var(--brd);
        }

        .cb-pbtn.ghost:hover {
            color: var(--ink);
            border-color: var(--ink4);
        }

        .cb-pbtn svg {
            width: 12px;
            height: 12px;
        }

        /* ---------- Full month calendar grid ---------- */
        .fc-frame {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--card);
        }

        .fc-head {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
        }

        .fc-head-cell {
            padding: 8px 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            text-align: center;
            border-right: 1px solid var(--brdl);
        }

        .fc-head-cell:last-child {
            border-right: none;
        }

        .fc-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(170px, 1fr);
            min-height: 0;
            overflow-y: auto;
        }

        .fc-day {
            border-right: 1px solid var(--brdl);
            border-bottom: 1px solid var(--brdl);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: background .12s;
            min-height: 160px;
        }

        .fc-day:hover {
            background: var(--bg);
        }

        .fc-day.other {
            background: var(--bg);
        }

        .fc-day.today {
            background: var(--acclt);
        }

        .fc-day.selected {
            box-shadow: inset 0 0 0 2px var(--acc);
        }

        .fc-day-num {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink2);
            text-align: right;
            padding: 2px 6px;
            flex-shrink: 0;
        }

        .fc-day.today .fc-day-num {
            color: var(--acc);
            font-weight: 800;
        }

        .fc-day.other .fc-day-num {
            color: var(--ink4);
            opacity: 0.4;
        }

        .fc-day.selected .fc-day-num {
            color: var(--acc);
        }

        .fc-day-chips {
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow: hidden;
        }

        .fc-chip {
            border: none;
            background: var(--chip-c, var(--acc));
            color: #fff;
            border-radius: 7px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: transform .12s, box-shadow .12s;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fc-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
        }

        .fc-more {
            font-size: 11px;
            color: var(--ink4);
            font-weight: 600;
            padding: 3px 6px;
            text-align: center;
        }

        /* Payment legend strip */
        .pay-legend {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 24px;
            background: var(--card);
            border-bottom: 1px solid var(--brd);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .pay-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink3);
        }

        .pay-legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .pay-legend-divider {
            width: 1px;
            height: 16px;
            background: var(--brd);
        }

        /* ---------- New Booking modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
            animation: cbOvIn .18s ease;
        }

        .modal {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: var(--shxl);
            animation: cbPanelIn .22s ease-out;
        }

        .modal-head {
            padding: 18px 22px;
            border-bottom: 1px solid var(--brd);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .mh-id {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .mh-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.01em;
            margin-top: 2px;
            color: var(--ink);
        }

        .modal-close {
            background: var(--bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 20px;
            color: var(--ink3);
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .modal-close:hover {
            background: var(--brdl);
        }

        .modal-body {
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .modal-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--ink4);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field input,
        .field select,
        .field textarea {
            padding: 10px 12px;
            border: 1px solid var(--brd);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: var(--ink);
            background: #fff;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--acc);
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-footer {
            padding: 14px 22px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid var(--brd);
        }

        .btn-cancel {
            background: var(--bg);
            color: var(--ink3);
            border: 1px solid var(--brd);
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-cancel:hover {
            background: var(--brdl);
        }

        .btn-save {
            background: var(--acc);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-save:hover {
            background: var(--accl);
        }

        .availability-box {
            margin-top: 8px;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--brdl);
            border-radius: 8px;
            font-size: 12px;
            color: var(--ink3);
        }

        /* ---------- Toast ---------- */
        .cb-te {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 11px 18px;
            background: var(--ink);
            color: #fff;
            border-radius: 10px;
            box-shadow: var(--shxl);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 9px;
            z-index: 2000;
            animation: cbTIn .2s ease;
        }

        .cb-te.out {
            animation: cbTOut .15s ease forwards;
        }

        .cb-te svg {
            width: 13px;
            height: 13px;
            color: var(--suc);
        }

        /* ---------- Empty ---------- */
        .cb-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--ink4);
            gap: 8px;
            padding: 40px 0;
        }

        .cb-empty-ico {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink4);
        }

        .cb-empty-ico svg {
            width: 22px;
            height: 22px;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 1100px) {
            .cb-side {
                width: 260px;
            }

            .cb-sr-item {
                padding: 10px 14px;
            }
        }

        @media (max-width: 860px) {
            .cb-side {
                display: none;
            }

            .cb-tb {
                padding: 8px 16px;
                flex-wrap: wrap;
            }

            .cb-panel {
                width: 100%;
                max-width: 100%;
            }

            .cb-sr-item {
                padding: 10px 14px;
            }

            .cb-sr-ico {
                width: 30px;
                height: 30px;
            }

            .cb-sr-num {
                font-size: 16px;
            }

            .cb-lh,
            .cb-r {
                grid-template-columns: 3px 1fr 1fr 0.8fr 0.7fr 0.7fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- Top brand bar -->
    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-mark">CB</div>
            <div class="topbar-title">
                CoffinBook
                <span class="sub">Reservation Dashboard</span>
            </div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
            <a class="topbar-link" href="inventory.html"
                onclick="event.preventDefault(); window.location.href='inventory.html'; return false;">→ Inventory</a>
            <button class="btn-primary" onclick="openNewBookingModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                New Booking
            </button>
        </div>
    </header>

    <div class="app">
        <!-- Toolbar -->
        <div class="cb-tb">
            <div class="cb-tb-left">
                <div class="cb-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search bookings..." oninput="renderMain()" />
                </div>
                <div class="cb-divider"></div>
                <div class="cb-filter-chips" id="statusFilters"></div>
            </div>
            <div class="cb-tb-right">
                <button class="cb-tb-btn sq" id="prevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6" />
                    </svg></button>
                <button class="cb-tb-btn sq" id="nextBtn" title="Next"><svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6" />
                    </svg></button>
                <button class="cb-tb-btn" id="todayBtn">Today</button>
                <div class="cb-divider"></div>
                <div class="cb-tb-views" id="viewTabs">
                    <button class="cb-tb-v" data-view="day">Day</button>
                    <button class="cb-tb-v" data-view="week">Week</button>
                    <button class="cb-tb-v" data-view="month">Month</button>
                    <button class="cb-tb-v on" data-view="full">Full</button>
                </div>
            </div>
        </div>

        <!-- Stat strip -->
        <div class="cb-sr" id="statStrip"></div>

        <!-- Payment legend -->
        <div class="pay-legend" id="statusLegend"></div>

        <!-- Full-width main — no sidebar -->
        <main class="cb-main" id="mainArea"></main>
    </div>

    <!-- New Booking Modal -->
    <div class="modal-overlay" id="newBookingModal" onclick="if(event.target===this)closeNewBookingModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-head">
                <div>
                    <div class="mh-id">New coffin booking</div>
                    <div class="mh-name">Book a coffin</div>
                </div>
                <button class="modal-close" onclick="closeNewBookingModal()" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <div class="modal-section-title">Client details</div>
                    <div class="field-grid">
                        <div class="field" style="grid-column:1/-1">
                            <label>Client name</label>
                            <input type="text" id="bkClient" placeholder="e.g., Whitfield Family" />
                        </div>
                        <div class="field">
                            <label>Deceased name</label>
                            <input type="text" id="bkDeceased" placeholder="Optional" />
                        </div>
                        <div class="field">
                            <label>Contact</label>
                            <input type="text" id="bkContact" placeholder="Phone or email" />

        ];

        /* Payment status: fully paid / deposited (partial) / reserved (unpaid) */
        const PAY_ST = {
            paid: { label: 'Fully Paid', color: '#16a34a', bg: '#16a34a14' },
            deposited: { label: 'Deposited', color: '#d97706', bg: '#d9770614' },

        };
        function getPaymentStatus(b) {
            const amt = b.paidAmount || 0;
            if (amt >= b.price) return PAY_ST.paid;
            if (amt > 0) return PAY_ST.deposited;
            return PAY_ST.reserved;
        }

        /* ============================================================
           STATE
           ============================================================ */
        let view = 'full';
        let sel = new Date(2020, 3, 10);  // April 10, 2020
        let viewMonth = 3;  // April (0-based)
        let viewYear = 2020;
        let calMonth = new Date(2020, 3, 1);
        let clickedDay = null;
        let activeFilters = [];
        let searchQuery = '';
        let panelBk = null;
        const TODAY = new Date(2020, 3, 10);

        /* ============================================================
           DATE HELPERS
           ============================================================ */
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const DOW_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const DOW_2 = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];

        function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
        function isSameMonth(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); }
        function isToday(d) { return isSameDay(d, TODAY); }
        function startOfWeek(d, weekStartsOn = 1) { const r = new Date(d); const day = (d.getDay() - weekStartsOn + 7) % 7; r.setDate(r.getDate() - day); r.setHours(0, 0, 0, 0); return r; }
        function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
        function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
        function startOfWeekSurrounding(d, weekStartsOn = 1) { return startOfWeek(startOfMonth(d), weekStartsOn); }
        function endOfWeekSurrounding(d, weekStartsOn = 1) {
            const e = endOfMonth(d);
            const r = new Date(e);
            const day = (r.getDay() - weekStartsOn + 7) % 7;
            r.setDate(r.getDate() + (6 - day));
            r.setHours(23, 59, 59, 999);
            return r;
        }
        function eachDayOfInterval(start, end) {
            const out = []; const cur = new Date(start);
            while (cur <= end) { out.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
            return out;
        }
        function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
        function addWeeks(d, n) { return addDays(d, n * 7); }
        function fmtISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function fmtMDY(d) { return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
        function fmtMD(d) { return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()}`; }
        function fmtTime12(t) {
            if (!t) return '';
            const m = String(t).match(/(\d{1,2}):(\d{2})/);
            if (!m) return '';
            const h = parseInt(m[1], 10); const min = m[2];
            const ap = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 === 0 ? 12 : h % 12;
            return `${h12}:${min} ${ap}`;
        }
        function parseHour(t) {
            if (!t) return null;
            const m = String(t).match(/(\d{1,2}):(\d{2})/);
            if (!m) return null;
            const h = parseInt(m[1], 10); const min = parseInt(m[2], 10);
            if (h > 23 || min > 59) return null;
            return h + min / 60;
        }
        function fmtHour(h) {
            const hh = Math.floor(h); const mm = Math.round((h - hh) * 60);
            const ap = hh >= 12 ? 'PM' : 'AM';
            const h12 = hh % 12 === 0 ? 12 : hh % 12;
            return `${h12}:${String(mm).padStart(2, '0')} ${ap}`;
        }
        function usd(n) { return 'KES ' + Number(n || 0).toLocaleString(); }
        function money(n) { return usd(n); }

        /* Calendar hours: 6 AM to 10 PM exclusive */
        const SH = 6; const EH = 22;
        const HOURS = []; for (let h = SH; h < EH; h++) HOURS.push(h);

        /* ============================================================

            al: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',

        /* ============================================================

            return BOOKINGS.filter(b => b.coffinType === type && b.color === color && (b.status === 'pending' || b.status === 'confirmed')).length;

        /* ============================================================
           STATS — for the colored stat strip
           ============================================================ */
        function renderStatStrip() {
            const visibleMonthDate = new Date(viewYear, viewMonth, 1);
            const monthBookings = BOOKINGS.filter(b => isSameMonth(parseDate(b.date), visibleMonthDate));
            const pending = monthBookings.filter(b => b.status === 'pending').length;
            const revenue = monthBookings.filter(b => b.status === 'completed').reduce((s, b) => s + b.price, 0);
            const todayCount = BOOKINGS.filter(b => isSameDay(parseDate(b.date), TODAY)).length;

            const items = [
                { l: 'This Month', v: monthBookings.length, ic: IC.cal, bg: '#0284c7' },
                { l: 'Pending', v: pending, ic: IC.al, bg: '#dc2626' },
                { l: 'Revenue', v: money(revenue), ic: IC.dl, bg: '#16a34a' },
                { l: 'Today', v: todayCount, ic: IC.tr, bg: '#0f766e' },
            ];
            document.getElementById('statStrip').innerHTML = items.map(si => `
    <div class="cb-sr-item" style="background:${si.bg}">
      <div class="cb-sr-ico">${si.ic}</div>
      <div class="cb-sr-info">
        <div class="cb-sr-num">${si.v}</div>
        <div class="cb-sr-label">${si.l}</div>
      </div>
    </div>
  `).join('');
        }

        function parseDate(s) {
            if (!s) return null;
            const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
            const d = new Date(s); return isNaN(d.getTime()) ? null : d;
        }

        /* ============================================================
           MINI CALENDAR
           ============================================================ */
        function renderMiniCal() {
            document.getElementById('mcTitle').textContent = `${MONTHS[calMonth.getMonth()]} ${calMonth.getFullYear()}`;
            const start = startOfWeekSurrounding(calMonth, 1);
            const end = endOfWeekSurrounding(calMonth, 1);
            const days = eachDayOfInterval(start, end);

            // Build per-day dots from BOOKINGS
            const perDayDots = {};
            BOOKINGS.forEach(b => {
                const d = parseDate(b.date); if (!d) return;
                const k = fmtISO(d);
                if (!perDayDots[k]) perDayDots[k] = [];
                const dotColor = (ST[b.status] || ST.pending).color;
                const existing = perDayDots[k].find(dot => dot.color === dotColor);
                if (existing) { } else perDayDots[k].push({ color: dotColor });
            });

            const dowHtml = DOW_2.map(d => `<div class="cb-mc-dow">${d}</div>`).join('');
            const daysHtml = days.map(d => {
                const k = fmtISO(d);
                const dots = perDayDots[k] || [];
                const hasEv = dots.length > 0;
                const isSel = clickedDay && isSameDay(d, clickedDay);
                const isTd = isToday(d);
                const isCur = isSameMonth(d, calMonth);
                let cls = 'cb-mc-day';
                if (isSel) cls += ' selected';
                else if (isTd) cls += ' today';
                if (!isCur) cls += ' other';
                return `
      <div class="${cls}" onclick="onMiniCalDayClick(new Date(${d.getFullYear()},${d.getMonth()},${d.getDate()}))">
        ${d.getDate()}
        ${hasEv ? `<span class="cb-cal-dots">${dots.slice(0, 3).map(dot => `<span class="cb-cal-dot" style="background:${isSel ? 'rgba(255,255,255,.9)' : dot.color}"></span>`).join('')}</span>` : ''}
      </div>
    `;
            }).join('');
            document.getElementById('mcGrid').innerHTML = dowHtml + daysHtml;
        }

        function onMiniCalDayClick(day) {
            if (clickedDay && isSameDay(day, clickedDay)) { clickedDay = null; }
            else {
                if (!isSameMonth(day, new Date(viewYear, viewMonth, 1))) goToMonth(day.getMonth(), day.getFullYear());
                clickedDay = new Date(day);
                sel = new Date(day);
            }
            renderMain();
        }

        function miniCalNav(dir) {
            const newDate = new Date(calMonth);
            newDate.setMonth(newDate.getMonth() + dir);
            goToMonth(newDate.getMonth(), newDate.getFullYear());

        /* ============================================================
           FILTERS
           ============================================================ */
        function renderFilters() {
            const counts = { confirmed: 0, pending: 0, completed: 0, cancelled: 0 };
            BOOKINGS.forEach(b => { if (counts[b.status] !== undefined) counts[b.status]++; });
            document.getElementById('statusFilters').innerHTML = STORD.map(s => {
                const isActive = activeFilters.indexOf(s) !== -1;
                return `
      <div class="cb-fc ${isActive ? 'on' : ''}" onclick="toggleFilter('${s}')">
        <span class="cb-fc-dot" style="background:${ST[s].color}"></span>
        ${ST[s].label}
        <span class="cb-fc-ct">${counts[s]}</span>
      </div>
    `;
            }).join('');
        }

        function toggleFilter(status) {
            if (activeFilters.indexOf(status) !== -1) activeFilters = activeFilters.filter(s => s !== status);
            else activeFilters = activeFilters.concat([status]);
            clickedDay = null;
            renderFilters(); renderMain();
