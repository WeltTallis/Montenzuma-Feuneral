  <!-- Prevents White Flash: Instantly applies brand background -->
  <style>
    html {
      background-color: #F9FAFB;
    }

    body {
      background: #F9FAFB;
      margin: 0;
    }

    /* ─ Boot loader: shows instantly before React mounts  */
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      background: #F9FAFB;
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
    }

    #boot-loader .spinner {
      width: 52px;
      height: 52px;
      position: relative;
    }

    #boot-loader .spinner::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-bottom-color: rgba(14, 51, 69, 0.15);
      animation: bootspin-reverse 2.4s linear infinite;
    }

    #boot-loader .spinner::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(14, 51, 69, 0.08);
      border-top-color: #0e3345;
      animation: bootspin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes bootspin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes bootspin-reverse {
      to {
        transform: rotate(-360deg);
      }
    }

    #boot-loader .info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #boot-loader .text {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #0e3345;
      opacity: 0.5;
    }

    #boot-loader .pct {
      font-size: 11px;
      font-weight: 500;
      color: #0e3345;
      opacity: 0.35;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    #boot-loader .bar {
      width: 120px;
      height: 2px;
      background: rgba(14, 51, 69, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    #boot-loader .bar-fill {
      width: 0%;
      height: 100%;
      background: #0e3345;
      border-radius: 2px;
      transition: width 0.25s ease;
    }

  <script>

      function rpSaveConsent(analytics, application) {
        var consent = {
          necessary: true,
          security: true,
          analytics: Boolean(analytics),
          application: Boolean(application),
          updatedAt: new Date().toISOString()
        };
        try { localStorage.setItem(RP_CONSENT_KEY, JSON.stringify(consent)); }
        catch (e) { /* storage unavailable — consent stays in memory */ }
      }

      /*  Banner visibility  */

      function rpShowBanner() {
        var banner = rpBanner();
        if (banner) banner.style.display = 'flex';
      }

      function rpCloseBanner() {
        var banner = rpBanner();
        if (banner) banner.style.display = 'none';
      }

      /* ─ Google Analytics (consent-aware) ── */

      function rpEnableAnalytics() {
        window.rpAnalyticsAllowed = true;
        // GA is pre-loaded from <head> for now, so just reuse it.
