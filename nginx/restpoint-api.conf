
map $http_cf_connecting_ip $rp_client_ip {
    default  $http_cf_connecting_ip;
    ""       $http_x_real_ip;
}
map $rp_client_ip $rp_client_ip_final {
    default  $rp_client_ip;
    ""       $remote_addr;
}
map $request_method $bad_method {
    default 1;
    ~*^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ 0;
}

log_format api '$rp_client_ip_final - $remote_user [$time_local] '
               '"$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent" '
               'rt=$request_time urt=$upstream_response_time '
               'uct=$upstream_connect_time uht=$upstream_header_time';

# 30 req/s sustained with a burst of 50 — comfortably above a real page load

limit_req_zone  $rp_client_ip_final zone=rp_api:20m  rate=30r/s;
limit_req_zone  $rp_client_ip_final zone=rp_auth:20m rate=1r/s;
limit_conn_zone $rp_client_ip_final zone=rp_conn:20m;
limit_req_status  429;
limit_conn_status 429;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_types application/json application/javascript text/css text/plain;
gzip_proxied any;

# The gateway, as seen from the host. 
upstream restpoint_gateway {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name restpoint.co.ke www.restpoint.co.ke app.restpoint.co.ke portal.restpoint.co.ke paymontenzuma.restpoint.co.ke;

    server_tokens off;
    access_log /var/log/nginx/restpoint.log api;

    error_page 400 = @bad_request;
    error_page 405 = @method_not_allowed;
    error_page 429 = @rate_limited;

    # ── Global ceilings ────
    client_max_body_size        50m;
    client_body_buffer_size     256k;
    client_header_timeout       15s;
    client_body_timeout         60s;
    send_timeout                30s;
    large_client_header_buffers 4 16k;
    reset_timedout_connection   on;

    # Dotfile / VCS probes. `location /` already 404s these on this host, but an
    # explicit block is cheaper and survives someone adding a new location later.
    # (.well-known is kept for ACME.)
    location ~ /\.(?!well-known) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # API responses are JSON; nosniff stops a browser re-interpreting one as
    # HTML, and the frame/policy headers close off embedding and referrer leaks.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy    "frame-ancestors 'none'; base-uri 'none'" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # TRACE/TRACK/CONNECT enable cross-site tracing and tunnel smuggling.
    if ($bad_method) {
        return 405;
    }


    if ($uri       ~* "(^|/)\.\.(/|$)") { return 400; }
    if ($request_uri ~* '(\.\./|%2e%2e|%00|%0d%0a|<\?php)') { return 400; }

    #  WebSocket (socket.io)
    location /socket.io/ {
        limit_req zone=rp_api burst=50 nodelay;
        proxy_pass http://restpoint_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $rp_client_ip_final;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location @bad_request {
        default_type application/json;
        return 400 '{"error":"bad_request","message":"Invalid request."}';
    }

    location @method_not_allowed {
        default_type application/json;
        return 405 '{"error":"method_not_allowed","message":"This HTTP method is not supported."}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Try again in a moment."}';
    }

    #  The API
    location /api/ {
        limit_req  zone=rp_api burst=50 nodelay;
        limit_conn rp_conn 20;
        # /api/v1/restpoint and does its own service routing from there.
        proxy_pass http://restpoint_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        # Send the REAL visitor, not Cloudflare's edge, so the gateway's own
        # express-rate-limit keys each person separately — it reads
        # cf-connecting-ip, then x-real-ip, then req.ip.
        proxy_set_header X-Real-IP         $rp_client_ip_final;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Auth requests use both the general API limit and the stricter auth limit.
        # Proxy settings are inherited from this parent location.
        location ~* ^/api/v1/restpoint/(auth/(login|register|logout|refresh|verify|otp|password)|login|register|logout|refresh|forgot-password|reset-password|otp)(/|$) {
            limit_req zone=rp_api burst=50 nodelay;
            limit_req zone=rp_auth burst=3;
            proxy_pass http://restpoint_gateway;
        }
    }

    # Neither API nor socket.io: this block only fronts the API, so the SPA is
    # served by the frontend container and anything else is a 404 here.
    location / {
        return 404;
    }
}

