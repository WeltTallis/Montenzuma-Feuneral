
map $http_cf_connecting_ip $rp_client_ip {
    default  $http_cf_connecting_ip;
    ""       $http_x_real_ip;
}
map $rp_client_ip $rp_client_ip_final {
    default  $rp_client_ip;
    ""       $remote_addr;
}

# 30 req/s sustained with a burst of 50 — comfortably above a real page load
# (which fires a dozen calls in parallel) while still capping a scraper.
limit_req_zone  $rp_client_ip_final zone=rp_api:20m  rate=30r/s;
limit_req_zone  $rp_client_ip_final zone=rp_auth:20m rate=1r/s;
limit_conn_zone $rp_client_ip_final zone=rp_conn:20m;
limit_req_status  429;
limit_conn_status 429;

# The gateway, as seen from the host. Change the address if this file is used
# from INSIDE the compose network (then it is restpoint_api_gateway:5000).
upstream restpoint_gateway {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen      80 default_server;
    server_name _;

    server_tokens off;

    # ── Global ceilings ────────────────────────────────────────────────
    # 50m matches the gateway's express.json({ limit: '50mb' }) so uploads are
    # not rejected here before the body parser ever sees them.
    client_max_body_size        50m;
    client_body_buffer_size     256k;
    client_header_timeout       15s;
    client_body_timeout         30s;
    send_timeout                30s;
    large_client_header_buffers 4 16k;
    reset_timedout_connection   on;

    # Dotfile / VCS probes. `location /` already 404s these on this host, but an
    # explicit block is cheaper and survives someone adding a new location later.
    # (.well-known is kept for ACME.)
    location ~ /\.(?!well-known) {
        return 404;
        access_log off;
        log_not_found off;
    }

    # API responses are JSON; nosniff stops a browser re-interpreting one as
    # HTML, and the frame/policy headers close off embedding and referrer leaks.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # TRACE/TRACK/CONNECT enable cross-site tracing and tunnel smuggling.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # ── Never-forwardable request shapes ───────────────────────────────
    # Null bytes and traversal. $uri is the normalised decoded PATH (no query),
    # so a legitimate ?redirect=../x is untouched; %2e%2e is checked raw.
    if ($request_uri ~* "%00")           { return 400; }
    if ($uri       ~* "%00")           { return 400; }
    if ($uri       ~* "(^|/)\.\.(/|$)") { return 400; }
    if ($request_uri ~* "%2e%2e")          { return 400; }

    # Injection signatures, matched on the RAW uri (path + query) because that
    # is where payloads ride. Multi-token, high-confidence patterns only — a
    # bare "select", "update" or "script" is deliberately NOT listed, because
    # the app has legitimate ?search= / ?status= parameters and blocking those
    # words would break the UI. Single quotes so nginx does not try to expand
    # anything as a variable.
    if ($request_uri ~* '(union[\s+/]+select|information_schema|drop[\s+/]+table|insert[\s+/]+into|delete[\s+/]+from|update[\s+/]+[a-z_]+[\s+/]+set|xp_cmdshell|or[\s+/]+1[\s]*=[\s]*1)') { return 400; }
    if ($request_uri ~* '(<[\s]*/?[\s]*script|<[\s/]*(img|iframe|svg|object|embed)[\s]|on(error|load|mouseover|click)\s*=|javascript[\s]*:|document[\s.]*cookie|base64_decode)') { return 400; }
    if ($request_uri ~* '(\$\(|\|\s*(cat|whoami|id|uname|wget|curl|nc|bash|sh)\b|;\s*(cat|rm|curl|wget|chmod)\b|/etc/passwd|/etc/shadow|/proc/self|/bin/(ba)?sh)') { return 400; }
    if ($request_uri ~* '(\.\./|%2e%2e|%00|%0d%0a|<\?php)') { return 400; }


    # ── WebSocket (socket.io) ──────────────────────────────────────────
    location /socket.io/ {
        limit_req zone=rp_api burst=50 nodelay;
        proxy_pass http://restpoint_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $rp_client_ip_final;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # ── The API ────────────────────────────────────────────────────────
    location /api/ {
        # Credential endpoints get the strict bucket, matched on the segment
        # after /api/v1/restpoint/ so /api/v1/restpoint/auth/login is caught.
        # `me` is deliberately NOT here: it is a read-only "who am I" call that
        # any route guard may issue on navigation — putting it in a 1r/s bucket
        # would throttle ordinary browsing, and it is not brute-forceable.
        if ($uri ~* "^/api/v1/restpoint/(auth/(login|register|logout|refresh|verify|otp|password)|login|register|logout|refresh|forgot-password|reset-password|otp)(/|$)") {
            limit_req zone=rp_auth burst=5 nodelay;
            limit_req_status 429;
        }

        limit_req  zone=rp_api burst=50 nodelay;
        limit_conn rp_conn 50;

        # Path is passed through untouched: the gateway mounts its router at
        # /api/v1/restpoint and does its own service routing from there.
        proxy_pass http://restpoint_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Send the REAL visitor, not Cloudflare's edge, so the gateway's own
        # express-rate-limit keys each person separately — it reads
        # cf-connecting-ip, then x-real-ip, then req.ip.
        proxy_set_header X-Real-IP         $rp_client_ip_final;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Neither API nor socket.io: this block only fronts the API, so the SPA is
    # served by the frontend container and anything else is a 404 here.
    location / {
        return 404;
    }
}

