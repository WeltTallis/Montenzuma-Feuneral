name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint --workspaces --if-present

      - name: Run typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Build project
        run: npm run build --workspaces --if-present

      - name: Check cross-directory relative require paths
        run: npm run check:paths

      - name: Run tests
        run: npm run test --workspaces --if-present

      - name: Verify container paths
        run: npm run check:connection:container

  # Publish build artifact for downstream jobs
  publish-artifact:
    if: success()
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: restpoint-build
          path: |
            packages/*
            services/*
            shared/*
          retention-days: 7