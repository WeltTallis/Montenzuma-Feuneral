  # FRONTEND

  frontend:
    build:
      context: ./FrontendClient
      dockerfile: Dockerfile
    image: restpoint-frontend:latest
    container_name: restpoint_frontend
    restart: always
    ports:
      - '8080:80'
    networks:
      - restpoint_network
    volumes:
  
      - /opt/storage/uploads:/opt/storage/uploads:ro
    healthcheck:
    
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

