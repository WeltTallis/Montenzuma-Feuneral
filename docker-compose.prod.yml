# PRODUCTION Docker Compose - Single Network Configuration
# All internal services run on port 5000
# All services have health checks and proper dependencies

services:
  # =============================================================================
  # INFRASTRUCTURE SERVICES
  # =============================================================================

  mariadb:
    image: mariadb:10.11
    container_name: restpoint_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      # Kept ONLY for the healthcheck below. The image entrypoint unsets
      # MARIADB_ROOT_PASSWORD before exec'ing the server (so it is not readable
      # at runtime), which is why a separate variable is needed.
      MARIADB_HEALTH_PW: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/custom-mysqld.cnf:/etc/mysql/conf.d/custom-mysqld.cnf:ro
      - ./docker/mariadb/exporter-user.sql:/docker-entrypoint-initdb.d/01-exporter-user.sql:ro
    networks:
      - restpoint_network
      - deceased_internal
    healthcheck:
      # WHY THIS NO LONGER USES `healthcheck.sh`
      # --------------------------------------
      # mariadb:10.11 (10.11.19+) has healthcheck.sh read credentials from
      # /var/lib/mysql/.my-healthcheck.cnf, a file the entrypoint generates ONLY on
      # first volume init. `_check_if_upgrade_is_needed` deliberately skips the
      # repair when that file already exists, so a volume where the file survived
      # but the `healthcheck` SQL account did not is stuck permanently:
      #     ERROR 1045 (28000): Access denied for user 'healthcheck'@'localhost'
      #     healthcheck innodb_initialized failed
      # Note the server itself was completely fine â€” only the PROBE could not
      # authenticate â€” yet `condition: service_healthy` on api-gateway then blocked
      # the entire stack, including the UI.
      #
      # This probe therefore talks to the server DIRECTLY as root, so it depends on
      # nothing but the root password and the socket:
      #   * no .my-healthcheck.cnf      -> cannot go stale
      #   * no `healthcheck` SQL user   -> nothing to create or re-grant
      #   * `SELECT 1 ... information_schema.ENGINES` is the same assertion the
      #     image's own `innodb_initialized` test makes, so crash-recovery
      #     completion is still verified (a bare `SELECT 1` would pass too early).
      # `$$` escapes to `$` so the value is expanded inside the container, not by
      # Compose.
      test:
        - 'CMD-SHELL'
        - >-
          mariadb --protocol=socket -uroot -p"$$MARIADB_HEALTH_PW" -N -B
          -e "SELECT 1 FROM information_schema.ENGINES
          WHERE engine='innodb' AND support IN ('YES','DEFAULT','ENABLED')"
          | grep -qx 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: restpoint_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - restpoint_network
      - deceased_internal
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis123}', 'ping' ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: restpoint_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - restpoint_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  # API GATEWAY

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: restpoint-api-gateway:latest
    container_name: restpoint_api_gateway
    restart: always
    init: true
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:${API_GATEWAY_EXTERNAL_PORT:-5000}:5000'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      GATEWAY_PROXY_TIMEOUT_MS: ${GATEWAY_PROXY_TIMEOUT_MS:-900000}
      # Service URLs
      AUTH_SERVICE_URL: http://restpoint_auth_service:5000
      TENANT_SERVICE_URL: http://restpoint_tenant_service:5000
      DECEASED_SERVICE_URL: http://restpoint_deceased_service:5000
      INVOICES_SERVICE_URL: http://restpoint_invoice_service:5000
      COFFIN_SERVICE_URL: http://restpoint_coffin_service:5000
      # Notification REST (bell list / mark-read / delete) is implemented by the
      # socketio-service â€” there is no notification-service container in this repo.
      NOTIFICATION_SERVICE_URL: http://restpoint_socketio_service:5000
      DOCUMENTS_SERVICE_URL: http://restpoint_documents_service:5000
      ANALYTICS_SERVICE_URL: http://restpoint_analytics_service:5000
      INSURANCE_SERVICE_URL: http://restpoint_insurance_service:5050
      MPESA_SERVICE_URL: http://restpoint_mpesa_service:4040
      BODYCHECKOUT_SERVICE_URL: http://restpoint_bodycheckout_service:5000
      CALENDAR_SERVICE_URL: http://restpoint_calender_service:5000
      CHEMICALS_SERVICE_URL: http://restpoint_chemical_service:5000
      HEARSE_SERVICE_URL: http://restpoint_hearse_service:5000
      SOCKETIO_SERVICE_URL: http://restpoint_socketio_service:5000
      EXTRA_SERVICES_URL: http://restpoint_extra_services:5000
      WORKSHOP_SERVICE_URL: http://restpoint_workshop_service:6969
      SUPPORT_SERVICE_URL: http://restpoint_support_service:5000
      LEAVE_SERVICE_URL: http://restpoint_hr_service:5000
      FLORIST_SERVICE_URL: http://restpoint_florist_service:5000
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@restpoint_redis:6379
    # Gateway starts independently of databases and queues. It can return a
    # clear 503 for a failed upstream while remaining available for other APIs.
    networks:
      - restpoint_network
      - deceased_internal
    healthcheck:
      test: [ 'CMD', '/usr/local/bin/gateway-healthcheck' ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  # APPLICATION SERVICES

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: restpoint-auth-service:latest
    container_name: restpoint_auth_service
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: auth-service
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      JWT_EXPIRY: 24h
      REFRESH_TOKEN_EXPIRY: 7d
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - restpoint_network
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    image: restpoint-tenant-service:latest
    container_name: restpoint_tenant_service
    restart: always
    ports:
      - '127.0.0.1:${TENANT_SERVICE_EXTERNAL_PORT:-5002}:5000'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: tenant-service
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      RABBITMQ_HOST: restpoint_rabbitmq
      RABBITMQ_PORT: 5672
      # Admin credentials used at runtime to AUTO-PROVISION tenant databases
      # (CREATE DATABASE + GRANT). Falls back to DB_USER when not set.
      DB_ADMIN_USER: ${DB_ADMIN_USER:-root}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:-${DB_ROOT_PASSWORD}}
      # Onboarding progress events are POSTed to this URL by Tenant.model.ts
      SOCKET_SERVICE_URL: http://restpoint_socketio_service:5000
      GLOBAL_UPLOADS_DIR: /opt/storage/uploads
    volumes:
      - tenant_service_data:/usr/src/app/data
      # The ONE shared uploads folder â€” HOST DIRECTORY /opt/storage (bind mount,
      # host path == container path). Every service writes signatures/logos/
      # documents here and this service serves it to browsers at /uploads/...
      # NOTE: the host dir must be writable by container uid 1001 â€” run
      # scripts/setup-production-storage.sh (chown -R 1001:1001 /opt/storage).
      - /opt/storage:/opt/storage
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - restpoint_network
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sms-service:
    build:
      context: services/sms-service
      dockerfile: Dockerfile
    image: restpoint-sms-service:latest
    container_name: restpoint_sms_service
    restart: always
    env_file:
      - .env.production
    environment:
      PORT: 8080
    networks:
      - restpoint_network
      - deceased_internal
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  deceased-service:
    build:
      context: .
      dockerfile: services/deceased-service/Dockerfile
    image: restpoint-deceased-service:latest
    container_name: restpoint_deceased_service
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: deceased-service
      GLOBAL_UPLOADS_DIR: /opt/storage/uploads
      SMS_SERVICE_URL: http://restpoint_sms_service:8080
      SOCKETIO_SERVICE_URL: http://restpoint_socketio_service:5000
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      DB_USER: restpoint_user
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - deceased_service_data:/usr/src/app/data
      # Write signatures/reports into the SAME shared host folder
      # (/opt/storage) the tenant-service serves at /uploads/...
      # (single source of truth). Bind mount: host == container path.
      - /opt/storage:/opt/storage
      # Legacy mount kept for old code paths that still write to
      # /usr/src/app/uploads â€” now redirected INTO the shared storage.
      - /opt/storage/uploads/_legacy/deceased:/usr/src/app/uploads
    networks:
      - deceased_internal
      - deceased_egress
    healthcheck:
      test: [ 'CMD', 'node', 'services/deceased-service/healthcheck.js' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  invoice-service:
    build:
      context: .
      dockerfile: services/invoice-service/Dockerfile
    image: restpoint-invoice-service:latest
    container_name: restpoint_invoice_service
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: invoice-service
      GLOBAL_UPLOADS_DIR: /opt/storage/uploads
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - invoice_service_data:/usr/src/app/data
      # Generated invoice PDFs now live on the host under /opt/storage too
      - /opt/storage/invoices/invoice-service:/usr/src/app/generated
      # Shared uploads (reads tenant signature/logo images from
      # /opt/storage/uploads/<tenant>/signatures when stamping PDFs)
      - /opt/storage:/opt/storage
    networks:
      - restpoint_network
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  coffin-service:
    build:
      context: .
      dockerfile: services/coffin-service/Dockerfile
    image: restpoint-coffin-service:latest
    container_name: restpoint_coffin_service
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: coffin-service
      GLOBAL_UPLOADS_DIR: /opt/storage/uploads
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      OPERATIONS_DATABASE: restpoint_operations
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Coffin inventory lists are large (image URLs per row + booking notes), so
      # the service registers a bigger Redis budget than the 10MB shared default.
      # Without this, checkAndBalance() evicted the cached list moments after it
      # was written and every request fell through to MySQL.
      COFFIN_REDIS_MAX_MEMORY_MB: 20
      COFFIN_REDIS_SOFT_LIMIT_MB: 16
    volumes:
      - coffin_service_data:/usr/src/app/data
      # Coffin-service imports @montezuma/shared-services, whose barrel
      # immediately inits FileStorageService â†’ mkdir /opt/storage/uploads.
      # Without this mount the non-root container crashes with EACCES.
      # Bind mount to the HOST /opt/storage directory (uid 1001 writable).
      - /opt/storage:/opt/storage
    networks:
      - restpoint_network
    # Redis must be up BEFORE the coffin service accepts traffic. Without this the
    # first requests run uncached: getRedisClient() backs off after a failed
    # attempt, so early calls silently hit the database instead of the cache.
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  documents-service:
    build:
      context: .
      dockerfile: services/documents-service/Dockerfile
    image: restpoint-documents-service:latest
    container_name: restpoint_documents_service
    restart: always
    # Private to the Compose network; publishing this port would bypass gateway auth.
    expose:
      - '5000'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: documents-service
      GLOBAL_UPLOADS_DIR: /opt/storage/uploads
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - documents_service_data:/usr/src/app/data
      # Documents service serves /uploads AND writes to it â€” use the shared
      # HOST directory /opt/storage (host path == container path)
      - /opt/storage:/opt/storage
      # Legacy mount redirected INTO the shared storage as well
      - /opt/storage/uploads/_legacy/documents:/usr/src/app/uploads
    networks:
      - restpoint_network
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    image: restpoint-analytics-service:latest
    container_name: restpoint_analytics_service
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: analytics-service
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - analytics_service_data:/usr/src/app/data
    networks:
      - restpoint_network
    healthcheck:
      test: [ 'CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Amani Cover insurance: policies, group members and claims.
  # Own database (INSURANCE_DATABASE) because these rows carry national ID
  # numbers - see services/insurance-service/knexfile.js.
  mpesa-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${MPESA_DB_NAME:-mpesa}
      # The existing production database volume was initialized with the
      # `mpesa` role. Keep the app and the database bootstrap defaults aligned.
      POSTGRES_USER: ${MPESA_DB_USER:-mpesa}
      # Reuse the configured DB_PASSWORD only when the dedicated M-Pesa secret
      # is absent. Both containers resolve this exact same value.
      POSTGRES_PASSWORD: ${MPESA_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD or MPESA_DB_PASSWORD in .env.production}}
    volumes:
      - mpesa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${MPESA_DB_USER:-mpesa} -d ${MPESA_DB_NAME:-mpesa}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restpoint_network

  mpesa-service:
    build:
      context: ./services/mpesa-service
      dockerfile: Dockerfile
    image: restpoint-mpesa-service:latest
    container_name: restpoint_mpesa_service
    restart: always
    env_file:
      - .env.production
    environment:
      APP_PORT: ':4040'
      APP_ENV: production
      GIN_MODE: release
      DB_HOST: mpesa-postgres
      DB_PORT: 5432
      DB_USER: ${MPESA_DB_USER:-mpesa}
      DB_PASSWORD: ${MPESA_DB_PASSWORD:-${DB_PASSWORD:?Set DB_PASSWORD or MPESA_DB_PASSWORD in .env.production}}
      DB_NAME: ${MPESA_DB_NAME:-mpesa}
      DB_SSL_MODE: ${MPESA_DB_SSL_MODE:-disable}
      MPESA_URL: ${MPESA_URL:-https://api.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
      MPESA_OAUTH_URL: ${MPESA_OAUTH_URL:-https://api.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
      MPESA_TILL_NUMBER: ${MPESA_TILL_NUMBER:-}
      CALL_BACK_URL: https://restpoint.co.ke/api/v1/restpoint/mpesa/stkcallback
      INSURANCE_CALLBACK_URL: http://restpoint_insurance_service:5050/insurance/payments/callback
      INSURANCE_CALLBACK_SECRET: ${INSURANCE_CALLBACK_SECRET:-insurance-mpesa-callback-local}
      DECEASED_PAYMENT_CALLBACK_URL: http://restpoint_invoice_service:5000/api/v1/restpoint/invoices/payment-callback
      DECEASED_PAYMENT_CALLBACK_SECRET: ${JWT_SECRET}
    depends_on:
      mpesa-postgres:
        condition: service_healthy
    networks:
      - restpoint_network

  insurance-postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${INSURANCE_PG_DATABASE:-insurance}
      POSTGRES_USER: ${INSURANCE_PG_USER:-insurance}
      POSTGRES_PASSWORD: ${INSURANCE_PG_PASSWORD:-40045355insurace}
    volumes:
      - insurance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${INSURANCE_PG_USER:-insurance} -d ${INSURANCE_PG_DATABASE:-insurance}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restpoint_network

  insurance-service:
    build:
      context: ./services/insurance-service
      dockerfile: Dockerfile
    image: restpoint-insurance-service:latest
    container_name: restpoint_insurance_service
    restart: always
    env_file:
      - .env.production
    environment:
      PORT: 5050
      PGHOST: insurance-postgres
      PGPORT: 5432
      PGDATABASE: ${INSURANCE_PG_DATABASE:-insurance}
      PGUSER: ${INSURANCE_PG_USER:-insurance}
      PGPASSWORD: ${INSURANCE_PG_PASSWORD:-40045355insurace}
      MPESA_SERVICE_URL: http://restpoint_mpesa_service:4040
      REDIS_ADDR: restpoint_redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      MPESA_CALLBACK_SECRET: ${INSURANCE_CALLBACK_SECRET:-insurance-mpesa-callback-local}
      GLOBAL_UPLOADS_DIR: /opt/storage/uploads
    depends_on:
      insurance-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/storage:/opt/storage
    networks:
      - restpoint_network
    healthcheck:
      # busybox wget has NO --no-verbose / --tries / --spider flags; those are
      # GNU-only and made the analytics healthcheck above fail forever.
      # `wget -q -O /dev/null <url>` is the form busybox actually supports and
      # performs a real GET, so this only passes on a 200.
      test: [ 'CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:5050/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # NOTE: No notification-service container â€” and none is needed. The
  # notification REST endpoints used by the UI bell (list / mark-read / delete)
  # are implemented by the socketio-service below, and the gateway's
  # NOTIFICATION_SERVICE_URL points at that container. Do NOT re-add a
  # services/notification-service build block: there is no source folder, so
  # every `docker compose up --build` would fail with
  #   resolve: lstat .../services/notification-service: no such file or directory

  # Mini Store â€” persistent inventory + stock module. Backed by the operations
  # DB (mini_store_items / mini_store_transactions), so items survive refreshes.
  store-service:
    build:
      context: .
      dockerfile: services/store-service/Dockerfile
    image: restpoint-store-service:latest
    container_name: restpoint_store_service
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # STORE_SERVICE_PORT in .env.production is 7071; force the CONTAINER
      # internal port to 5000 so it matches the gateway URL
      # (http://restpoint_store_service:5000) and the port mapping above.
      STORE_SERVICE_PORT: 5000
      PORT: 5000
      SERVICE_NAME: store-service
      DB_HOST: restpoint_mariadb
      DB_PORT: 3306
      OPERATIONS_DATABASE: restpoint_operations
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - restpoint_network
    healthcheck:
      test: [ 'CMD', 'node', '-e', "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  socketio-service:
    build:
      context: .
      dockerfile: services/socketio-service/Dockerfile
    image: restpoint-socketio-service:latest
    container_name: restpoint_socketio_service
    restart: always
    ports:
      - '127.0.0.1:${SOCKETIO_SERVICE_EXTERNAL_PORT:-5013}:5000'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: socketio-service
      REDIS_HOST: restpoint_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    volumes:
      - socketio_service_data:/usr/src/app/data
    networks:
      - restpoint_network
      - deceased_internal
    healthcheck:
