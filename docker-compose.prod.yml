  # =============================================================================
  # FRONTEND
  # =============================================================================

  frontend:
    build:
      context: ./FrontendClient
      dockerfile: Dockerfile
    image: restpoint-frontend:latest
    container_name: restpoint_frontend
    restart: always
    ports:
      # The UI is PINNED to host port 8080 â€” deliberately NOT configurable.
      # It was previously '${FRONTEND_EXTERNAL_PORT:-8080}:80', and
      # .env.production set FRONTEND_EXTERNAL_PORT=8082, so production served the
      # UI on 8082 while nginx-host.conf reverse-proxies the SPA to
      # http://127.0.0.1:8080. Pinning to 8080 keeps both in sync.
      - '127.0.0.1:8080:80'
    # NO depends_on HERE â€” DELIBERATELY.
    #
    # An earlier version gated the UI on the gateway:
    #     depends_on: { api-gateway: { condition: service_healthy } }
    # and changing it to `service_started` was NOT enough either, because
    # api-gateway itself has `depends_on: { mariadb: { condition: service_healthy } }`.
    # Any depends_on on the gateway is therefore TRANSITIVELY a depends_on MariaDB,
    # so an unhealthy database blocked the UI through both conditions:
    #     mariadb unhealthy -> api-gateway never starts
    #                        -> frontend waits forever ("Container ... Waiting")
    # The UI is a static nginx bundle that serves index.html and its hashed assets
    # from its own container; it does not need the gateway to answer `GET /`.
    # Its own Dockerfile already handles an absent gateway correctly â€” the
    # `/monitoring` and `/socket.io` proxy_pass targets go through the
    # `resolver 127.0.0.11` + variable form precisely so nginx does not refuse to
    # start when the gateway is not resolvable yet, and it resolves the name
    # lazily per request. So there is no ordering requirement to express here, and
    # omitting the block is what makes the UI genuinely independent.
    #
    # Consequence: the SPA is reachable during a backend outage and its own
    # API calls fail visibly, which is the correct behaviour â€” far better than
    # the browser getting connection-refused for the entire application.
    networks:
      - restpoint_network
    volumes:
      # READ-ONLY view of the ONE shared uploads folder, so the container's
      # own nginx can serve /uploads/... directly from disk (see the
      # `location ^~ /uploads/` block in FrontendClient/Dockerfile).
      #
      # Without this the SPA has no /uploads/ route at all: every request
      # falls through `try_files ... /index.html` and the browser renders
      # index.html as a broken image / unparseable PDF. Files were only
      # visible because the HOST nginx proxied /uploads/ -> tenant-service;
      # any request that reached this container directly got HTML.
      #
      # `:ro` â€” this container only ever READS uploads. Every service that
      # WRITES them mounts /opt/storage read-write instead; keeping the
      # frontend read-only means a compromised web tier cannot delete or
      # overwrite tenant documents.
      #
      # Permissions: files are written by the backend containers as uid 1001
      # while nginx's workers run as `nginx`, so the tree must be readable â€”
      # `chmod -R a+rX /opt/storage/uploads` (setup-production-storage.sh).
      # Files that are present but unreadable still resolve through the
      # tenant-service fallback in the nginx config.
      - /opt/storage/uploads:/opt/storage/uploads:ro
    healthcheck:
      # busybox wget, not GNU wget. `nginx:alpine` ships no `wget` package, so
      # `wget` is busybox's, which supports neither `--no-verbose` nor `--tries`
      # and exited non-zero on every probe â€” marking a perfectly healthy SPA
      # `unhealthy`. `-q -O /dev/null` are supported and exit 0 only on a 200.
      test: [ 'CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost/' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# NETWORK DEFINITION - ONLY ONE NETWORK

networks:
  restpoint_network:
    driver: bridge
    name: restpoint_network
    attachable: true
  deceased_internal:
    driver: bridge
    name: restpoint_deceased_internal
    internal: true
  deceased_egress:
    driver: bridge
    name: restpoint_deceased_egress
    attachable: true

# VOLUMES
volumes:
  mpesa_postgres_data:
    driver: local
  insurance_postgres_data:
    driver: local
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  auth_service_data:
    driver: local
  tenant_service_data:
    driver: local
  deceased_service_data:
    driver: local
  invoice_service_data:
    driver: local
  coffin_service_data:
    driver: local
  documents_service_data:
    driver: local
  # NOTE: uploads are NOT a docker named volume anymore â€” every service
  # bind-mounts the HOST directory /opt/storage (host path == container
  # path), so all tenant uploads (signatures, logos, documents, hearse
  # images, scans, invoices) physically live in /opt/storage on the server.
  # Run scripts/setup-production-storage.sh once before `docker compose up`
  # to create the dirs, migrate old volume data and set uid-1001 ownership.
  # Database dumps / upload archives go to /opt/backups (see `make backup`).
  analytics_service_data:
    driver: local
  notification_service_data:
    driver: local
  socketio_service_data:
    driver: local
  bodycheckout_service_data:
    driver: local
  extra_services_data:
    driver: local
  support_service_data:
    driver: local
  chemical_service_data:
    driver: local
  hearse_service_data:
    driver: local
  workshop_service_data:
    driver: local
