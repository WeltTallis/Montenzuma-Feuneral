<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memorial Management — Comprehensive Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #F8FAFC;
      --sf: #FFFFFF;
      --sfH: #F1F5F9;
      --bd: #E2E8F0;
      --bdL: #F1F5F9;
      --tx: #0F172A;
      --txB: #334155;
      --txS: #64748B;
      --txM: #94A3B8;
      --txF: #CBD5E1;
      --pri: #2563EB;
      --priBg: #EFF6FF;
      --suc: #059669;
      --sucBg: #ECFDF5;
      --wrn: #D97706;
      --wrnBg: #FFFBEB;
      --dng: #DC2626;
      --dngBg: #FEF2F2;
      --pur: #7C3AED;
      --purBg: #F5F3FF;
      --cyn: #0891B2;
      --cynBg: #ECFEFF;
      --org: #EA580C;
      --orgBg: #FFF7ED;
      --pnk: #DB2777;
      --pnkBg: #FDF2F8;
      --tea: #0D9488;
      --teaBg: #F0FDFA;
      --ds-red: #DC2626;
      --ds-blue: #3b82f6
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--tx);
      min-height: 100vh;
      line-height: 1.5
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px
    }

    ::-webkit-scrollbar-track {
      background: transparent
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bd);
      border-radius: 2px
    }

    .hd {
      background: #0f172a;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .2)
    }

    .hd-l {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .hd-ico {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--pri), var(--pur));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px
    }

    .hd h1 {
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -.02em
    }

    .hd p {
      color: #94a3b8;
      font-size: .72rem;
      margin-top: 1px
    }

    .hd-r {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .hd-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .06);
      color: #e2e8f0;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all .15s
    }

    .hd-btn:hover {
      background: rgba(255, 255, 255, .12)
    }

    .hd-btn i {
      font-size: 11px
    }

    .hd-av {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--pri), var(--pur));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    .ct {
      padding: 20px 24px 40px;
      max-width: 1440px;
      margin: 0 auto
    }

    .ds-card {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
      margin-bottom: 16px;
      overflow: hidden
    }

    .ds-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--bd)
    }

    .ds-nav h2 {
      font-size: .85rem;
      font-weight: 700
    }

    .ds-nb {
      display: flex;
      gap: 5px
    }

    .nb {
      height: 28px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--bd);
      background: var(--sf);
      color: var(--txS);
      cursor: pointer;
      font-size: .68rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all .12s
    }

    .nb:hover {
      border-color: var(--ds-red);
      color: var(--ds-red)
    }

    .nb i {
      font-size: 9px
    }

    .ds-scr {
      display: flex;
      overflow-x: auto;
      padding: 8px 12px 12px;
      gap: 5px;
      scroll-behavior: smooth
    }

    .ds-scr::-webkit-scrollbar {
      height: 0
    }

    .dc {
      flex-shrink: 0;
      width: 68px;
      padding: 7px 4px 5px;
      border-radius: 9px;
      border: 1.5px solid transparent;
      text-align: center;
      cursor: pointer;
      transition: all .12s;
      background: var(--bg);
      position: relative
    }

    .dc:hover {
      border-color: var(--bd);
      transform: translateY(-1px)
    }

    .dc.today {
      border-color: var(--ds-blue);
      background: rgba(59, 130, 246, .04)
    }

    .dc.sel {
      background: var(--ds-red) !important;
      border-color: var(--ds-red) !important;
      box-shadow: 0 4px 12px rgba(220, 38, 38, .25);
      transform: translateY(-2px)
    }

    .dc.sel .dd,
    .dc.sel .dw {
      color: #fff !important
    }

    .dc.sel .dbadge {
      background: rgba(255, 255, 255, .25);
      color: #fff
    }

    .dw {
      font-size: .58rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--txM);
      margin-bottom: 2px
    }

    .dd {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--tx);
      line-height: 1.2
    }

    .dbadge {
      display: inline-block;
      margin-top: 4px;
      font-size: .54rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--ds-red);
      color: #fff;
      line-height: 1.5
    }

    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 4px;
      overflow-x: auto
    }

    .tabs::-webkit-scrollbar {
      height: 0
    }

    .tab {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--txS);
      font-size: .78rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border-radius: 7px;
      transition: all .12s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .tab:hover {
      background: var(--sfH);
      color: var(--txB)
    }

    .tab.on {
      background: var(--pri);
      color: #fff
    }

    .tab i {
      font-size: 12px
    }

    .tab-cnt {
      font-size: .6rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .2);
      color: rgba(255, 255, 255, .9)
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 16px
    }

    .st {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      transition: all .15s;
      animation: fu .3s ease-out both
    }

    .st-lbl {
      font-size: .62rem;
      font-weight: 500;
      color: var(--txS);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px
    }

    .st-val {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1
    }

    .st-ico {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0
    }

    .cg {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      overflow: hidden;
      animation: fu .4s ease both
    }

    .ch-hd {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--bdL)
    }

    .ch-hd-l {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .ch-hd-l i {
      font-size: 13px;
      color: var(--txS)
    }

    .ch-hd h3 {
      font-size: .8rem;
      font-weight: 600;
      margin: 0
    }

    .ch-body {
      padding: 10px 14px
    }

    .r1 {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 12px;
      margin-bottom: 12px
    }

    .r2 {
      display: grid;
      grid-template-columns: 1.2fr 1fr .8fr;
      gap: 12px;
      margin-bottom: 16px
    }

    .rl {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 10px;
      overflow: hidden;
      animation: fu .4s ease .4s both
    }

    .rl-hd {
      padding: 10px 14px;
      border-bottom: 1px solid var(--bdL);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px
    }

    .rl-hd-l {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .rl-hd-l i {
      color: var(--txS);
      font-size: 13px
    }

    .rl-hd h3 {
      font-size: .8rem;
      font-weight: 600;
      margin: 0
    }

    .rl-badge {
      font-size: .6rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--priBg);
      color: var(--pri)
    }

    .rl-scr {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      overflow-x: auto
    }

    .rl-scr::-webkit-scrollbar {
      height: 4px
    }

    .rl-scr::-webkit-scrollbar-thumb {
      background: var(--bd);
      border-radius: 2px
    }

    .rc {
      padding: 10px 12px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--sf);
      min-width: 270px;
      flex-shrink: 0;
      transition: all .12s;
      border-left: 3px solid var(--pri)
    }

    .rc:hover {
      background: var(--sfH);
      box-shadow: 0 1px 4px rgba(0, 0, 0, .04)
    }

    .rc-av {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .62rem;
      font-weight: 700;
      flex-shrink: 0
    }

    .rc-body {
      flex: 1;
      min-width: 0
    }

    .rc-name {
      font-size: .78rem;
      font-weight: 600;
      color: var(--tx);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .rc-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      flex-wrap: wrap
    }

    .rc-meta span {
      font-size: .6rem;
      color: var(--txM);
      white-space: nowrap
    }

    .rc-meta .dot {
      font-size: 4px
    }

    .rc-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      flex-shrink: 0
    }

    .rc-badge {
      font-size: .58rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap
    }

    .rc-time {
      font-size: .55rem;
      color: var(--txM)
    }

    .rc-arrow {
      color: var(--txF);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      font-size: 11px
    }

    .sp-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .35);
      backdrop-filter: blur(2px);
      z-index: 999;
      animation: fi .2s ease
    }

    .sp {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 440px;
      max-width: 100vw;
      background: var(--sf);
      box-shadow: -8px 0 40px rgba(15, 23, 42, .12);
      z-index: 1000;
      animation: sir .35s cubic-bezier(.16, 1, .3, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--bd)
    }

    .sp-hd {
      padding: 18px 22px;
      border-bottom: 1px solid var(--bd);
      background: var(--bg);
      flex-shrink: 0
    }

    .sp-hd-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px
    }

    .sp-hd h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0
    }

    .sp-close {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--bd);
      background: var(--sf);
      color: var(--txS);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .15s;
      font-size: 14px
    }

    .sp-close:hover {
      background: var(--sfH)
    }

    .sp-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center
    }

    .sp-badge {
      font-size: .65rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px
    }

    .sp-banner {
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--bd);
      flex-shrink: 0
    }

    .sp-banner-ico {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px
    }

    .sp-banner-text {
      flex: 1;
      min-width: 0
    }

    .sp-banner-text div:first-child {
      font-size: .75rem;
      font-weight: 600
    }

    .sp-banner-text div:last-child {
      font-size: .68rem;
      color: var(--txS);
      margin-top: 1px
    }

    .sp-action {
      font-size: .58rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      color: #fff;
      white-space: nowrap;
      letter-spacing: .03em
    }

    .sp-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 22px 22px
    }

    .sp-section {
      font-size: .65rem;
      font-weight: 600;
      color: var(--txM);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 12px 0 4px
    }

    .sp-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--bdL)
    }

    .sp-row-ico {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--priBg);
      color: var(--pri);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      font-size: 12px
    }

    .sp-row-label {
      font-size: .62rem;
      color: var(--txM);
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 500;
      margin-bottom: 1px
    }

    .sp-row-val {
      font-size: .82rem;
      font-weight: 500;
      word-break: break-word
    }

    @keyframes fu {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes fi {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes sir {
      from {
        transform: translateX(100%)
      }

      to {
        transform: translateX(0)
      }
    }

    @keyframes pd {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    @media(max-width:1200px) {
      .stats {
        grid-template-columns: repeat(3, 1fr)
      }

      .r1 {
        grid-template-columns: 1fr
      }

      .r2 {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:900px) {
      .ct {
        padding: 14px 16px 32px
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px
      }

      .r2 {
        grid-template-columns: 1fr
      }

      .dc {
        width: 58px
      }

      .dd {
        font-size: .9rem
      }
    }

    @media(max-width:600px) {
      .stats {
        grid-template-columns: 1fr
      }

      .hd {
        padding: 10px 14px
      }

      .hd p {
        display: none
      }

      .dc {
        width: 52px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: 0s !important;
        transition-duration: 0s !important
      }
    }
  </style>
</head>

<body>
  <header class="hd">
    <div class="hd-l">
      <div class="hd-ico"><i class="fas fa-dove"></i></div>
      <div>
        <h1>Memorial Management</h1>
        <p>Funeral operations intelligence</p>
      </div>
    </div>
    <div class="hd-r">
      <button class="hd-btn"><i class="fas fa-download"></i> Export</button>
      <button class="hd-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button class="hd-btn" aria-label="Notifications"><i class="fas fa-bell"></i></button>
      <div class="hd-av">A</div>
    </div>
  </header>
  <main class="ct">
    <div class="ds-card">
      <div class="ds-nav">
        <h2 id="stripTitle"></h2>
        <div class="ds-nb"><button class="nb" id="prevW"><i class="fas fa-chevron-left"></i> Prev</button><button
            class="nb" id="todayB">Today</button><button class="nb" id="nextW">Next <i
              class="fas fa-chevron-right"></i></button></div>
      </div>
      <div class="ds-scr" id="strip"></div>
    </div>
    <div class="tabs" id="tabBar"></div>
    <div class="stats" id="statsRow"></div>
    <div class="r1" id="chartsR1"></div>
    <div class="r2" id="chartsR2"></div>
    <div class="rl" id="recordList"></div>
  </main>
  <div id="sidePanel"></div>
  <script>
    const T = {
      bg: '#F8FAFC',
      sf: '#FFFFFF',
      sfH: '#F1F5F9',
      bd: '#E2E8F0',
      bdL: '#F1F5F9',
      tx: '#0F172A',
      txB: '#334155',
      txS: '#64748B',
      txM: '#94A3B8',
      txF: '#CBD5E1',
      pri: '#2563EB',
      priBg: '#EFF6FF',
      suc: '#059669',
      sucBg: '#ECFDF5',
      wrn: '#D97706',
      wrnBg: '#FFFBEB',
      dng: '#DC2626',
      dngBg: '#FEF2F2',
      pur: '#7C3AED',
      purBg: '#F5F3FF',
      cyn: '#0891B2',
      cynBg: '#ECFEFF',
      org: '#EA580C',
      orgBg: '#FFF7ED',
      pnk: '#DB2777',
      pnkBg: '#FDF2F8',
      tea: '#0D9488',
      teaBg: '#F0FDFA',
      dsRed: '#DC2626',
      dsBlue: '#3B82F6'
    };
    const CC = {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'top',
          labels: {
            boxWidth: 12,
            usePointStyle: true,
            pointStyle: 'circle',
            padding: 14,
            font: {
              size: 10,
              family: "'Inter',sans-serif"
            }
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,.92)',
          titleColor: '#f9fafb',
          bodyColor: '#d1d5db',
          cornerRadius: 8,
          padding: {
            top: 8,
            bottom: 8,
            left: 12,
            right: 12
          },
          titleFont: {
            size: 11,
            weight: '600'
          },
          bodyFont: {
            size: 11
          },
          displayColors: true,
          boxPadding: 4,
          borderColor: 'rgba(255,255,255,.06)',
          borderWidth: 1,
          usePointStyle: true
        }
      },
      scales: {
        x: {
          grid: {
            display: false
          },
          ticks: {
            font: {
              size: 10
            },
            padding: 6
          },
          border: {
            display: false
          }
        },
        y: {
          beginAtZero: true,
          grid: {
            color: '#E2E8F055'
          },

        data: {
          labels: drE.map(d => d[0].split(' ').slice(0, 2).join(' ')),
          datasets: [{ label: 'Trips', data: drE.map(d => d[1]), backgroundColor: T.cyn + '88', borderColor: T.cyn, borderWidth: 1, borderRadius: 5, borderSkipped: false }]
        },
        options: CC
      });

      mkCh('c5', {
        type: 'doughnut',
        data: { labels: ['Utilized', 'Maintenance'], datasets: [{ data: [all.filter(r => r.status === 'Booked').length, all.filter(r => r.status === 'Maintenance').length], backgroundColor: [T.pri, T.wrn], borderWidth: 0, spacing: 4 }] },
        options: { ...CC, plugins: { ...CC.plugins, legend: { ...CC.plugins.legend, position: 'bottom', labels: { ...CC.plugins.legend.labels, boxWidth: 10, padding: 12 } } }, cutout: '65%' }
      });
    }

    /* COFFIN CHARTS */
    function renderCfCharts() {
      const all = DATA.coffins;
      document.getElementById('chartsR1').innerHTML = `
        <div class="cg" style="animation-delay:.15s">
            <div class="ch-hd"><div class="ch-hd-l"><i class="fas fa-chart-bar"></i><h3>Sales by Type</h3></div></div>
            <div class="ch-body" style="height:220px"><canvas id="c1"></canvas></div>
        </div>
        <div class="cg" style="animation-delay:.2s">
            <div class="ch-hd"><div class="ch-hd-l"><i class="fas fa-shield-halved"></i><h3>Booking Status</h3></div></div>
            <div class="ch-body" style="height:220px;display:flex;align-items:center;justify-content:center"><div style="width:180px"><canvas id="c2"></canvas></div></div>
        </div>`;

      const tM = {};
      all.forEach(r => { tM[r.type] = (tM[r.type] || 0) + 1; });
      const tE = Object.entries(tM).sort((a, b) => b[1] - a[1]);
      const tc = [T.pri, T.suc, T.pur, T.wrn, T.dng, T.cyn, T.org, T.pnk, T.tea, T.pri + '88'];

      mkCh('c1', {
        type: 'bar',
        data: {
          labels: tE.map(t => t[0].length > 16 ? t[0].slice(0, 14) + '...' : t[0]),
          datasets: [{ label: 'Sold', data: tE.map(t => t[1]), backgroundColor: tE.map((_, i) => tc[i % tc.length]), borderWidth: 0, borderRadius: 5, borderSkipped: false }]
        },
        options: CC
      });

      const bD = [
        { s: 'Booked', c: all.filter(r => r.status === 'Booked').length, co: T.pri },
        { s: 'Available', c: all.filter(r => r.status === 'Available').length, co: T.suc }
      ];

      mkCh('c2', {
        type: 'doughnut',
        data: { labels: bD.map(b => b.s), datasets: [{ data: bD.map(b => b.c), backgroundColor: bD.map(b => b.co), borderWidth: 0, spacing: 3 }] },
        options: { ...CC, plugins: { ...CC.plugins, legend: { ...CC.plugins.legend, position: 'bottom', labels: { ...CC.plugins.legend.labels, boxWidth: 10, padding: 10, font: { size: 10 } } } }, cutout: '62%' }
      });

      document.getElementById('chartsR2').innerHTML = `
        <div class="cg" style="animation-delay:.25s">
            <div class="ch-hd"><div class="ch-hd-l"><i class="fas fa-boxes-stacked"></i><h3>Stock Levels</h3></div></div>
            <div class="ch-body" style="height:190px"><canvas id="c3"></canvas></div>
        </div>
        <div class="cg" style="animation-delay:.3s">
            <div class="ch-hd"><div class="ch-hd-l"><i class="fas fa-cube"></i><h3>Material Type</h3></div></div>
            <div class="ch-body" style="height:190px;display:flex;align-items:center;justify-content:center"><div style="width:140px"><canvas id="c4"></canvas></div></div>
        </div>
        <div class="cg" style="animation-delay:.35s">
            <div class="ch-hd"><div class="ch-hd-l"><i class="fas fa-coins"></i><h3>Price Distribution</h3></div></div>
            <div class="ch-body" style="height:190px"><canvas id="c5"></canvas></div>
        </div>`;

      const stockD = all.filter(r => r.max_stock > 0).sort((a, b) => (b.stock / b.max_stock) - (a.stock / a.max_stock)).slice(0, 8);

      mkCh('c3', {
        type: 'bar',
        data: {
          labels: stockD.map(s => s.type.length > 16 ? s.type.slice(0, 14) + '...' : s.type),
          datasets: [{
            label: 'Stock %',
            data: stockD.map(s => Math.round((s.stock / s.max_stock) * 100)),
            backgroundColor: stockD.map(s => { const p = s.stock / s.max_stock; return p < 0.2 ? T.dng + '88' : p < 0.5 ? T.wrn + '88' : T.suc + '88'; }),
            borderWidth: 0,
            borderRadius: 5,
            borderSkipped: false
          }]
        },
        options: { ...CC, plugins: { ...CC.plugins, legend: { display: false } }, scales: { x: { ...CC.scales.x }, y: { ...CC.scales.y, ticks: { ...CC.scales.y.ticks, callback: value => value + '%' } } } }
      });

      const matD = { Wood: 0, Ceramic: 0, Metal: 0 };
      all.forEach(r => { matD[r.material] = (matD[r.material] || 0) + 1; });

      mkCh('c4', {
        type: 'doughnut',
        data: { labels: Object.keys(matD), datasets: [{ data: Object.values(matD), backgroundColor: [T.pri, T.cyn, T.pur], borderWidth: 0, spacing: 4 }] },
        options: { ...CC, plugins: { ...CC.plugins, legend: { ...CC.plugins.legend, position: 'bottom', labels: { ...CC.plugins.legend.labels, boxWidth: 10, padding: 12 } } }, cutout: '65%' }
      });

      const pR = [
        { l: '<2K', mn: 0, mx: 2000, co: T.suc },
        { l: '2-5K', mn: 2000, mx: 5000, co: T.pri },
        { l: '5-8K', mn: 5000, mx: 8000, co: T.pur },
        { l: '8K+', mn: 8000, mx: 99999, co: T.dng }
      ];

      mkCh('c5', {
        type: 'doughnut',
        data: { labels: pR.map(p => p.l), datasets: [{ data: pR.map(p => all.filter(r => r.price >= p.mn && r.price < p.mx).length), backgroundColor: pR.map(p => p.co), borderWidth: 0, spacing: 3 }] },
        options: { ...CC, plugins: { ...CC.plugins, legend: { ...CC.plugins.legend, position: 'bottom', labels: { ...CC.plugins.legend.labels, boxWidth: 10, padding: 12 } } }, cutout: '65%' }
      });
    }

    /* RECORD LIST - every event for the selected day */
    function renderRecords() {
      const sec = document.getElementById('recordList');
      if (!selDate) { sec.innerHTML = `<div class="rl"><div class="rl-hd"><div class="rl-hd-l"><i class="fas fa-file-text"></i><h3>Select a date to view records</h3></div></div></div>`; return }
      const dp = fmtD(selDate); let cards = '';
      if (activeTab === 'deceased') {
        DATA.deceased.filter(r => r.date_key === selDate).forEach(r => {
          const ss = r.status === 'In Morgue' ? { bg: T.priBg, c: T.pri, dot: T.pri } : r.status === 'Released' ? { bg: T.sucBg, c: T.suc, dot: T.suc } : r.status === 'Pending Autopsy' ? { bg: T.wrnBg, c: T.wrn, dot: T.wrn } : { bg: T.purBg, c: T.pur, dot: T.pur };
          const hasPM = r.pm_req && !r.pm_done;
          cards += `<div class="rc" style="border-left-color:${ss.dot}" onclick="openSidePanel('deceased',${r.id})"><div class="rc-av" style="background:${ss.bg};color:${ss.c}">${ini(r.name)}</div><div class="rc-body"><div class="rc-name">${r.name}</div><div class="rc-meta"><span style="font-family:monospace">${r.adm_num}</span><span class="dot">*</span><span>${r.gender[0]} . ${r.age}y</span><span class="dot">*</span><span>${r.time}</span></div></div><div class="rc-right"><span class="rc-badge" style="background:${ss.bg};color:${ss.c}">${hasPM ? '<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:' + T.dng + ';margin-right:3px;animation:pd 1.5s infinite"></span>' : ''}${r.status}</span><span class="rc-time">${r.time}</span></div><div class="rc-arrow"><i class="fas fa-arrow-right"></i></div></div>`;
        });
      } else if (activeTab === 'hearses') {
        DATA.hearses.filter(r => r.date_key === selDate).forEach(r => {
          const bc = r.status === 'Booked' ? T.pri : T.wrn; const bcg = r.status === 'Booked' ? T.priBg : T.wrnBg;
          cards += `<div class="rc" style="border-left-color:${bc}" onclick="openSidePanel('hearses',${r.id})"><div class="rc-av" style="background:${bcg};color:${bc}"><i class="fas fa-truck" style="font-size:12px"></i></div><div class="rc-body"><div class="rc-name">${r.vehicle}</div><div class="rc-meta"><span>${r.plate}</span><span class="dot">*</span><span>${r.driver}</span><span class="dot">*</span><span>${r.time}</span></div></div><div class="rc-right"><span class="rc-badge" style="background:${bcg};color:${bc}">${r.status}</span><span class="rc-time">${r.assigned}</span></div><div class="rc-arrow"><i class="fas fa-arrow-right"></i></div></div>`;
        });
      } else {
        DATA.coffins.filter(r => r.date_key === selDate).forEach(r => {
          const bc = r.status === 'Booked' ? T.pri : T.suc; const bcg = r.status === 'Booked' ? T.priBg : T.sucBg; const low = r.stock <= 1;
          cards += `<div class="rc" style="border-left-color:${bc}" onclick="openSidePanel('coffins',${r.id})"><div class="rc-av" style="background:${low ? T.dngBg : bcg};color:${low ? T.dng : bc}"><i class="fas fa-box" style="font-size:12px"></i></div><div class="rc-body"><div class="rc-name">${r.type}</div><div class="rc-meta"><span>${r.cf_id}</span><span class="dot">*</span><span>${r.assigned}</span><span class="dot">*</span><span>$${r.price.toLocaleString()}</span></div></div><div class="rc-right"><span class="rc-badge" style="background:${low ? T.dngBg : bcg};color:${low ? T.dng : bc}">${r.status}${low ? ' (Low)' : ''}</span><span class="rc-time">Stock: ${r.stock}</span></div><div class="rc-arrow"><i class="fas fa-arrow-right"></i></div></div>`;
        });
      }
      const cnt = document.querySelectorAll('.rc').length;
      sec.innerHTML = `<div class="rl"><div class="rl-hd"><div class="rl-hd-l"><i class="fas fa-file-text"></i><h3>${dp}</h3><span class="rl-badge">${cnt} records</span></div></div><div class="rl-scr">${cards || '<div style="text-align:center;padding:20px;color:' + T.txM + ';font-size:.8rem;min-width:200px">No records for this date</div>'}</div></div>`;
    }

    /* SIDE PANEL - full detail for a clicked record */
    function openSidePanel(type, id) {
      let r;
      if (type === 'deceased') r = DATA.deceased.find(x => x.id === id);
      else if (type === 'hearses') r = DATA.hearses.find(x => x.id === id);
      else r = DATA.coffins.find(x => x.id === id);
      if (!r) return;
      let rows = '', banner = '', low = false;
      if (type === 'deceased') {
        const ss = r.status === 'In Morgue' ? { bg: T.priBg, c: T.pri, dot: T.pri } : r.status === 'Released' ? { bg: T.sucBg, c: T.suc, dot: T.suc } : r.status === 'Pending Autopsy' ? { bg: T.wrnBg, c: T.wrn, dot: T.wrn } : { bg: T.purBg, c: T.pur, dot: T.pur };
        const ps = !r.pm_req ? { bg: T.bdL, c: T.txM, l: 'Not Requested' } : r.pm_done ? { bg: T.sucBg, c: T.suc, l: 'Completed' } : { bg: T.dngBg, c: T.dng, l: 'Pending' };
        banner = `<div class="sp-banner" style="background:${ps.bg}"><div class="sp-banner-ico" style="background:${ps.c}18;color:${ps.c}"><i class="fas fa-wave-square"></i></div><div class="sp-banner-text"><div style="color:${ps.c}">Postmortem: ${ps.l}</div>${r.pm_report ? `<div>${r.pm_report}</div>` : ''}</div>${r.pm_req && !r.pm_done ? '<span class="sp-action" style="background:' + T.dng + '">ACTION NEEDED</span>' : ''}</div>`;
        rows = `<div class="sp-section">Admission Details</div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-calendar"></i></div><div><div class="sp-row-label">Date Admitted</div><div class="sp-row-val">${fmtD(r.adm_date)} at ${r.time}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-calendar"></i></div><div><div class="sp-row-label">Date of Death</div><div class="sp-row-val">${fmtD(r.death_date)}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-user"></i></div><div><div class="sp-row-label">Gender / Age</div><div class="sp-row-val">${r.gender} . ${r.age} years</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-stethoscope"></i></div><div><div class="sp-row-label">Cause of Death</div><div class="sp-row-val">${r.cause}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-map-marker-alt"></i></div><div><div class="sp-row-label">Received From</div><div class="sp-row-val">${r.source}</div></div></div><div class="sp-section">Contact Information</div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-user"></i></div><div><div class="sp-row-label">Contact Person</div><div class="sp-row-val">${r.contact}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-phone"></i></div><div><div class="sp-row-label">Telephone</div><div class="sp-row-val">${r.tel}</div></div></div>${r.dispatch_date ? `<div class="sp-section">Dispatch Information</div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-truck"></i></div><div><div class="sp-row-label">Dispatch Date</div><div class="sp-row-val">${fmtD(r.dispatch_date)}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-map-marker-alt"></i></div><div><div class="sp-row-label">Dispatched To</div><div class="sp-row-val" style="color:${T.suc}">${r.dispatch_to}</div></div></div>` : ''}`;
      } else if (type === 'hearses') {
        rows = `<div class="sp-section">Booking Details</div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-truck"></i></div><div><div class="sp-row-label">Vehicle Type</div><div class="sp-row-val">${r.vehicle}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-id-card"></i></div><div><div class="sp-row-label">Plate Number</div><div class="sp-row-val">${r.plate}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-user"></i></div><div><div class="sp-row-label">Assigned Driver</div><div class="sp-row-val">${r.driver}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-clock"></i></div><div><div class="sp-row-label">Booking Time</div><div class="sp-row-val">${r.time}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-user-check"></i></div><div><div class="sp-row-label">Assigned To</div><div class="sp-row-val">${r.assigned}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-info-circle"></i></div><div><div class="sp-row-label">Status</div><div class="sp-row-val" style="color:${r.status === 'Booked' ? T.pri : T.wrn}">${r.status}</div></div></div>`;
      } else {
        low = r.stock <= 1;
        banner = low ? `<div style="padding:8px 22px;display:flex;align-items:center;gap:8px;background:${T.dngBg};border-bottom:1px solid ${T.bd}"><i class="fas fa-triangle-exclamation" style="color:${T.dng};font-size:13px"></i><div style="font-size:.75rem;font-weight:600;color:${T.dng}">Low stock alert - only ${r.stock} unit${r.stock !== 1 ? 's' : ''} remaining</div></div>` : '';
        rows = `<div class="sp-section">Coffin Details</div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-box"></i></div><div><div class="sp-row-label">Type</div><div class="sp-row-val">${r.type}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-barcode"></i></div><div><div class="sp-row-label">ID</div><div class="sp-row-val" style="font-family:monospace">${r.cf_id}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-user"></i></div><div><div class="sp-row-label">Assigned To</div><div class="sp-row-val">${r.assigned}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-cube"></i></div><div><div class="sp-row-label">Material</div><div class="sp-row-val">${r.material}</div></div></div><div class="sp-row"><div class="sp-row-ico"><i class="fas fa-coins"></i></div><div><div class="sp-row-label">Price</div><div class="sp-row-val">$${r.price.toLocaleString()}</div></div></div><div class="sp-section">Stock Information</div><div class="sp-row"><div class="sp-row-ico" style="background:${low ? T.dngBg : T.sucBg};color:${low ? T.dng : T.suc}"><i class="fas fa-boxes-stacked"></i></div><div><div class="sp-row-label">Stock Level</div><div class="sp-row-val" style="color:${low ? T.dng : T.suc}">${r.stock} / ${r.max_stock}${low ? ' -- LOW STOCK' : ''}</div></div></div>`;
      }
      const ss = type === 'deceased' ? (r.status === 'In Morgue' ? { bg: T.priBg, c: T.pri, dot: T.pri } : r.status === 'Released' ? { bg: T.sucBg, c: T.suc, dot: T.suc } : r.status === 'Pending Autopsy' ? { bg: T.wrnBg, c: T.wrn, dot: T.wrn } : { bg: T.purBg, c: T.pur, dot: T.pur }) : (r.status === 'Booked' ? { bg: T.priBg, c: T.pri } : { bg: T.sucBg, c: T.suc });
      const badgeHtml = type === 'deceased' ? `<span class="sp-badge" style="background:${ss.bg};color:${ss.c}"><span style="width:6px;height:6px;border-radius:50%;background:${ss.dot};display:inline-block"></span>${r.status}</span><span class="sp-badge" style="background:${T.bdL};color:${T.txS}">${r.gender} . ${r.age} yrs</span><span style="font-size:.62rem;color:${T.txM};font-family:monospace">${r.adm_num}</span>` : '';
      document.getElementById('sidePanel').innerHTML = `<div class="sp-overlay" onclick="closeSidePanel()"></div><div class="sp"><div class="sp-hd"><div class="sp-hd-top"><h3>${type === 'deceased' ? r.name : r.type}</h3><button class="sp-close" onclick="closeSidePanel()"><i class="fas fa-times"></i></button></div><div class="sp-badges">${badgeHtml}${low ? '<span class="sp-badge" style="background:' + T.dngBg + ';color:' + T.dng + '">LOW STOCK</span>' : ''}</div></div>${banner}<div class="sp-scroll">${rows}</div></div>`;
    }
    function closeSidePanel() { document.getElementById('sidePanel').innerHTML = '' }
    window.openSidePanel = openSidePanel; window.closeSidePanel = closeSidePanel;

    /* PICK DATE - select a day, show all its events, scroll it into view */
    function pickDate(key) { selDate = key; renderStrip(); renderRecords(); const el = document.querySelector('.dc.sel'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }) }

    /* RENDER ALL */
    function renderAll() { renderTabs(); renderStats(); renderCharts(); renderRecords() }

    /* NAVIGATION */
    document.getElementById('prevW').addEventListener('click', () => { vStart = addD(vStart, -7); selDate = null; renderStrip(); renderRecords() });
    document.getElementById('nextW').addEventListener('click', () => { vStart = addD(vStart, 7); selDate = null; renderStrip(); renderRecords() });
    document.getElementById('todayB').addEventListener('click', () => {
      const tk = dk(todayR.getFullYear(), todayR.getMonth(), todayR.getDate());
      let found = tk;
      for (let i = 0; i <= 30; i++) {
        const d = addD(todayR, i);
        const k = dk(d.getFullYear(), d.getMonth(), d.getDate());
        if (DATA.deceased.some(r => r.date_key === k) || DATA.hearses.some(r => r.date_key === k) || DATA.coffins.some(r => r.date_key === k)) { found = k; break; }
      }
      if (!found) { found = '2025-06-02'; }
      selDate = found;
      const p = selDate.split('-');
      const sd = new Date(+p[0], +p[1] - 1, +p[2]);
      vStart = new Date(sd);
      vStart.setDate(vStart.getDate() - ((vStart.getDay() + 6) % 7));
      renderStrip();
      renderRecords();
      setTimeout(() => {
        const el = document.querySelector('.dc.sel');
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }
      }, 50);
    });
    document.getElementById('refreshBtn').addEventListener('click', function () { const i = this.querySelector('i'); i.classList.add('fa-spin'); setTimeout(() => i.classList.remove('fa-spin'), 800) });

    /* INIT */
    renderStrip(); renderAll();
  </script>
</body>

</html>
